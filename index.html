.seat-choice .seat-k { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .08em; }
.seat-choice .seat-name { display: flex; align-items: center; gap: 7px; margin-top: 6px; font-size: 14px; font-weight: 600; }
.seat-choice .seat-ovr { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); }
.seat-choice .seat-action { display: block; margin-top: 9px; font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.sign-summary { border: 1px solid var(--line); margin: 16px 0 0; }
.sign-summary .confirm-row { font-size: 13px; }
.modal-wide { width: min(100%, 680px); }

@media (max-width: 1280px) {
  .sponsor-layout { grid-template-columns: minmax(0, 1fr) 310px; }
  .sponsor-list { grid-template-columns: 1fr; }
  .sponsor-card { display: grid; grid-template-columns: 1.1fr 1fr; gap: 10px 16px; }
  .sponsor-card-head { grid-column: 1 / -1; }
  .sponsor-desc { grid-column: 1; }
  .sponsor-numbers { grid-column: 1; align-self: start; }
  .sponsor-terms { grid-column: 2; grid-row: 2 / span 2; border-top: 0; padding-top: 0; }
  .sponsor-card-foot { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
  .sponsor-card-foot .btn { width: auto; }
}
@media (max-width: 1120px) {
  .design-layout, .drivers-layout { grid-template-columns: 1fr; }
  .blueprint-stage { min-height: 300px; }
  .lineup-list { display: grid; grid-template-columns: 1fr 1fr; }
  .slot-label { grid-column: 1 / -1; margin-bottom: -4px; }
  .lineup-summary { flex-wrap: wrap; }
  .market-list { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .sponsor-layout { grid-template-columns: 1fr; }
  .season-ready { display: grid; grid-template-columns: 220px 1fr; align-items: start; }
  .season-ready .panel-head { grid-column: 1 / -1; }
  .ready-gauges { grid-row: 2 / span 3; }
  .season-ready > .btn { align-self: center; }
  .setup-top-meta .top-stat:nth-child(2) { display: none; }
}
@media (max-width: 900px) {
  .setup-top { flex-wrap: wrap; gap: 14px; }
  .setup-top-meta { order: 3; width: 100%; }
  .setup-top-meta .top-stat { flex: 1; }
  .setup-top-meta .top-stat:nth-child(2) { display: block; }
  .setup-steps { flex-wrap: wrap; }
  .setup-step { flex: 1 1 46%; border-bottom: 1px solid var(--line); }
  .setup-progress-mini { flex: 1 1 100%; border-top: 1px solid var(--line); }
  .setup-page-head { flex-direction: column; align-items: flex-start; gap: 14px; }
  .setup-page-aside { flex: 0 0 auto; }
  .market-list { grid-template-columns: 1fr 1fr; }
  .sponsor-card { display: flex; flex-direction: column; }
  .season-ready { display: block; }
  .setup-rail { display: none; }
}
@media (max-width: 640px) {
  .setup-container { padding: 12px 14px 24px; }
  .setup-top-meta { flex-wrap: wrap; }
  .setup-top-meta .top-stat { min-width: 0; }
  .setup-team-name { font-size: 16px; }
  .setup-team-id .badge { display: none; }
  .setup-step { padding: 10px; }
  .step-copy b { font-size: 13px; }
  .step-state { display: none; }
  .setup-page-head h1 { font-size: 27px; }
  .philosophy-grid { grid-template-columns: 1fr; }
  .philosophy { min-height: 0; }
  .blueprint-stage { min-height: 230px; padding-top: 40px; }
  .car-ovr-badge { right: 10px; bottom: 8px; }
  .car-ovr-badge strong { font-size: 34px; }
  .car-ovr-badge span { display: none; }
  .blueprint-stats { grid-template-columns: 1fr 1fr; }

/* ---------- 2021–2026 free-agent register ---------- */
.market-headline { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 10px 14px 4px; }
.market-headline p { font-size: 12.5px; color: var(--ink-mute); line-height: 1.65; max-width: 420px; }
.market-filter { text-align: right; flex: 0 0 auto; }
.market-filter span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.market-filter b { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); font-weight: 500; margin-top: 2px; }
.market-list { display: flex; flex-direction: column; gap: 5px; max-height: 560px; overflow-y: auto; padding: 7px 12px 8px; }
.market-row {
  display: grid; grid-template-columns: 35px minmax(0, 1fr) 38px 94px;
  gap: 9px; align-items: center;
  width: 100%; padding: 7px 9px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.017);
  color: var(--ink-dim); text-align: left; font-weight: 400;
  border-radius: 2px;

}
.market-row:hover { border-color: rgba(var(--accent-rgb), .32); background: rgba(var(--accent-rgb), .045); }
.market-row-avatar .avatar { width: 33px; height: 33px; }
.market-row-main { min-width: 0; }
.market-row-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.market-row-name b { font-size: 13px; font-weight: 600; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.market-row-name i { font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); flex: 0 0 auto; }
.market-row-en { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.market-row-attrs { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.market-row-ovr { text-align: right; border-left: 1px solid var(--line); padding-left: 7px; }
.market-row-ovr b { display: block; font-family: var(--font-display); font-style: italic; font-size: 20px; font-weight: 900; letter-spacing: -.03em; line-height: .9; color: var(--ink-dim); }
.market-row-ovr small { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); }
.market-row-side { text-align: right; }
.market-row-side > b { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); font-weight: 500; }
.market-row-side > small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; margin-top: 1px; }
.market-row-side > em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--accent); margin-top: 2px; letter-spacing: .03em; }
.market-panel .note-line { margin-top: 0; }
@media (max-width: 800px) {
  .market-row { grid-template-columns: 33px minmax(0,1fr) 34px 82px; gap: 7px; }
  .market-row-en { display: none; }
}
@media (max-width: 520px) {
  .market-row { grid-template-columns: 31px minmax(0,1fr) 32px; }
  .market-row-side { display: none; }
  .market-headline { flex-direction: column; gap: 4px; }
  .market-filter { text-align: left; display: flex; gap: 8px; align-items: baseline; }

/* ---------- contract + morale UI ---------- */
.market-tabs { display: flex; gap: 4px; padding: 8px 12px 4px; }
.market-tab {
  border: 1px solid var(--line); background: rgba(255,255,255,.02);
  color: var(--ink-faint); font-family: var(--font-mono); font-size: 9px;
  padding: 4px 7px; border-radius: 2px; transition: .18s;
}
.market-tab b { font-weight: 500; color: var(--ink-mute); margin-left: 3px; }
.market-tab:hover { color: var(--ink-dim); border-color: var(--line-strong); }
.market-tab.active { border-color: rgba(var(--accent-rgb),.4); color: var(--accent); background: rgba(var(--accent-rgb),.06); }
.market-tab.active b { color: var(--accent); }
.market-row { border-left: 2px solid var(--row-team, var(--line)); }
.market-row.is-contracted .market-row-name b { color: var(--ink); }
.market-club {
  font-style: normal; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .02em;
  padding: 1px 4px; border: 1px solid var(--line); color: var(--ink-faint); border-radius: 2px;
  white-space: nowrap;
}
.market-club.contracted { color: var(--ink-mute); border-color: var(--line-strong); }
.market-club.free { color: var(--ok); border-color: rgba(66,224,165,.22); background: rgba(66,224,165,.04); }
.market-morale-note { padding: 7px 14px 10px; font-size: 10.5px; color: var(--ink-faint); line-height: 1.55; border-top: 1px dashed var(--line); }

.driver-morale-row { display: flex; align-items: center; gap: 8px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line); }
.driver-morale-row > span { font-size: 10.5px; color: var(--ink-faint); width: 26px; }
.driver-morale-row > i { flex: 1; height: 3px; background: rgba(255,255,255,.07); display: block; }
.driver-morale-row > i em { display: block; height: 100%; background: var(--ok); }
.driver-morale-row > b { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); font-weight: 500; min-width: 54px; text-align: right; }
.driver-morale-row.morale-ok > i em { background: var(--warn); }
.driver-morale-row.morale-bad > i em { background: var(--bad); }
.driver-morale-row.morale-bad > b { color: var(--bad); }
.driver-card-foot > div:nth-child(2) { text-align: center; }
.driver-card-foot > div:nth-child(2) b { font-size: 12px; }
.driver-card-foot { flex-wrap: wrap; }
.lineup-summary { gap: 13px; }
.lineup-summary > div:nth-child(3) b { font-size: 16px; }
.lineup-summary .btn { margin-left: auto; }

.contract-term-picker { margin-top: 13px; }
.term-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.term-option {
  border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--ink-mute);
  padding: 8px; text-align: left; border-radius: 2px; transition: .18s;
}
.term-option:hover { border-color: var(--line-strong); background: rgba(255,255,255,.045); }
.term-option.active { border-color: rgba(var(--accent-rgb),.5); background: rgba(var(--accent-rgb),.065); }
.term-option b { display: block; color: var(--ink-dim); font-size: 13px; font-weight: 600; }
.term-option.active b { color: var(--ink); }
.term-option span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--accent); margin-top: 1px; }
.term-option small { display: block; font-size: 9.5px; color: var(--ink-faint); line-height: 1.4; margin-top: 3px; }
.seat-contract { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 5px; }
.seat-choice .seat-action { display: flex; justify-content: space-between; gap: 6px; }
.sign-fineprint { font-size: 10px; color: var(--ink-faint); line-height: 1.55; margin-top: 10px; }
.modal-subtitle:first-of-type { margin-top: 0; }
@media (max-width: 640px) {
  .lineup-summary { flex-wrap: wrap; }
  .lineup-summary .btn { width: 100%; margin-left: 0; }
  .term-options { grid-template-columns: 1fr; }
  .driver-card-foot { gap: 7px; }
}

/* ---- app.css ---- */
/* ============================================================
   SEASON APP SHELL + HEADQUARTERS
   ============================================================ */

.game-screen {
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);

    radial-gradient(900px 600px at 70% -10%, rgba(var(--accent-rgb), .06), transparent 60%),
    #070a0e;
}
.game-main { min-width: 0; display: flex; flex-direction: column; }
.game-content { flex: 1; padding: 26px clamp(20px, 2.6vw, 38px) 40px; }

/* ---------- sidebar ---------- */
.app-sidebar {
  position: sticky; top: 0; height: 100vh;
  border-right: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(255,255,255,.022), transparent 22%),
    rgba(8, 11, 15, .9);
  z-index: 30;
}
.side-scroll { height: 100%; display: flex; flex-direction: column; padding: 18px 14px 14px; overflow-y: auto; }
.side-brand { display: flex; align-items: center; gap: 9px; padding: 0 3px 16px; }
.side-brand .badge { margin-left: auto; font-size: 9.5px; padding: 0 6px; }
.side-brand-name { font-family: var(--font-display); font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -.03em; font-size: 17.5px; line-height: 1; }
.side-brand-sub { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .18em; color: var(--ink-faint); margin-top: 3px; }
.side-team {
  display: flex; align-items: center; gap: 10px;
  padding: 11px;
  border: 1px solid var(--line);
  background:
    linear-gradient(115deg, rgba(var(--accent-rgb), .12), transparent 64%),

}
.side-team::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.side-team-badge { width: 36px; height: 36px; font-size: 14px; }
.side-team-copy { min-width: 0; }
.side-team-copy b { display: block; font-size: 14.5px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-team-copy span { display: block; font-family: var(--font-display); font-size: 10.5px; text-transform: uppercase; color: var(--ink-mute); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-round { padding: 14px 4px 12px; }
.side-round-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; }
.side-round-top b { color: var(--ink-mute); font-weight: 500; }
.side-round-bar { height: 2px; background: rgba(255,255,255,.07); margin-top: 7px; }
.side-round-bar i { display: block; height: 100%; background: var(--accent); }
.side-round-dots { display: flex; gap: 4px; margin-top: 7px; }
.side-round-dots i { flex: 1; height: 2px; background: rgba(255,255,255,.1); display: block; }
.side-round-dots i.done { background: rgba(var(--accent-rgb), .7); }
.side-round-dots i.next { background: #fff; box-shadow: 0 0 6px rgba(255,255,255,.6); }
.side-nav { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.side-link {
  display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 9px;
  min-height: 38px; padding: 0 9px;
  border: 0; border-left: 2px solid transparent;

}
.side-link .icon { width: 16px; height: 16px; }
.side-link span { font-size: 13.5px; font-weight: 500; }
.side-link small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .04em; }
.side-link:hover { color: var(--ink-dim); background: rgba(255,255,255,.035); }
.side-link.active { color: var(--ink); background: rgba(var(--accent-rgb), .09); border-left-color: var(--accent); }
.side-link.active .icon { color: var(--accent); }
.side-link.active small { color: var(--accent); }
.side-spacer { flex: 1; min-height: 18px; }
.side-finance { border: 1px solid var(--line); padding: 10px; background: rgba(255,255,255,.018); border-radius: 3px; }
.side-fin-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-mute); padding: 2px 0; }
.side-fin-row b { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-weight: 500; }
.side-fin-row b.conf-ok { color: var(--ok); }
.side-fin-row b.conf-warn { color: var(--warn); }
.side-fin-row b.conf-bad { color: var(--bad); }
.side-conf-bar { height: 2px; background: rgba(255,255,255,.07); margin-top: 5px; }
.side-conf-bar i { display: block; height: 100%; background: var(--ok); }
.side-conf-bar.conf-warn i { background: var(--warn); }
.side-conf-bar.conf-bad i { background: var(--bad); }
.side-foot-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 2px 0; }
.side-reset { background: none; border: 0; padding: 2px 0; color: var(--ink-faint); font-size: 10px; font-family: var(--font-mono); letter-spacing: .04em; }
.side-reset:hover { color: var(--bad); }
.side-save { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); display: flex; align-items: center; gap: 4px; }
.side-save .dot { width: 4px; height: 4px; }
.side-mobile-head { display: none; }

/* ---------- top bar ---------- */
.game-topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 18px clamp(20px, 2.6vw, 38px);
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(8,11,15,.85), rgba(8,11,15,.55));
}
.topbar-title .eyebrow { font-size: 10px; letter-spacing: .14em; }
.topbar-meta { color: var(--ink-faint); }
.topbar-title h1 { font-size: 23px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; margin-top: 5px; }
.topbar-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
.topbar-chip {
  display: flex; flex-direction: column; gap: 2px;
  min-width: 86px; padding: 6px 12px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.02);
  border-radius: 3px;
}
.topbar-chip span { font-family: var(--font-mono); font-size: 9px; letter-spacing: .09em; color: var(--ink-faint); text-transform: uppercase; }
.topbar-chip b { font-size: 14px; color: var(--ink-dim); font-weight: 600; }
.topbar-chip b.conf-ok { color: var(--ok); }
.topbar-chip b.conf-warn { color: var(--warn); }
.topbar-chip b.conf-bad { color: var(--bad); }
.game-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 14px clamp(20px, 2.6vw, 38px);
  border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
}

/* ---------- shared page heading ---------- */
.game-page { width: 100%; max-width: 1550px; margin: 0 auto; }
.page-intro-row {
  display: flex; justify-content: space-between; align-items: flex-end; gap: 30px;
  margin-bottom: 20px;
}
.page-greeting { font-size: clamp(25px, 2.7vw, 36px); font-weight: 800; letter-spacing: -.045em; line-height: 1.18; margin-top: 7px; }
.page-sub { color: var(--ink-mute); font-size: 13.5px; line-height: 1.7; margin-top: 8px; max-width: 640px; }
.page-intro-meta { text-align: right; flex: 0 0 auto; border-right: 2px solid var(--accent); padding-right: 14px; }
.page-intro-meta span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .11em; text-transform: uppercase; }
.page-intro-meta b { display: block; font-size: 14px; font-weight: 600; color: var(--ink-dim); margin-top: 4px; }
.section-title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 26px 0 12px; }
.section-title-row h3 { font-size: 20px; font-weight: 750; letter-spacing: -.03em; margin-top: 4px; }
.section-note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .04em; }
.table-empty-note { font-size: 11.5px; color: var(--ink-faint); text-align: center; padding: 13px; border-top: 1px solid var(--line); }

/* ---------- HQ hero ---------- */
.hq-hero-grid { display: grid; grid-template-columns: minmax(0, 1.56fr) minmax(330px, .84fr); gap: 12px; }
.next-race-hero {
  position: relative; overflow: hidden; min-height: 350px;
  border: 1px solid var(--line);
  background:
    radial-gradient(100% 160% at 100% 0%, rgba(var(--accent-rgb), .16), transparent 56%),
    linear-gradient(135deg, rgba(255,255,255,.045), transparent 42%),
    #0b1016;
  border-radius: 5px;
  padding: 26px;
  display: flex;
  isolation: isolate;
}
.next-race-hero::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 42px 42px;
  mask-image: radial-gradient(ellipse at 78% 52%, #000 0%, transparent 65%);
  opacity: .6;
}
.next-race-hero::after {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent 72%);
}
.next-race-bg { position: absolute; z-index: 0; right: -5%; top: 5%; width: 62%; height: 92%; color: var(--accent); opacity: .48; pointer-events: none; }
.next-race-bg svg { width: 100%; height: 100%; filter: drop-shadow(0 0 40px rgba(var(--accent-rgb), .2)); }
.next-race-copy { position: relative; z-index: 2; max-width: 62%; display: flex; flex-direction: column; align-items: flex-start; }
.next-race-copy .eyebrow { display: inline-flex; align-items: center; gap: 7px; }
.next-race-copy .eyebrow .dot { width: 5px; height: 5px; }
.next-race-copy h2 {
  font-size: clamp(38px, 4vw, 58px); font-weight: 850; letter-spacing: -.055em; line-height: 1.02;
  margin-top: 10px;
  display: flex; align-items: flex-start; gap: 12px;
}
.next-race-copy h2 span {
  font-family: var(--font-mono); font-size: 12px; font-weight: 400; letter-spacing: .04em;
  color: var(--accent); border: 1px solid rgba(var(--accent-rgb), .3); padding: 2px 6px; margin-top: 12px;
}
.next-circuit { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--ink-mute); margin-top: 8px; text-transform: uppercase; }
.next-desc { font-size: 13.5px; color: var(--ink-mute); line-height: 1.7; margin-top: 14px; max-width: 400px; }
.track-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 16px; }
.track-chips span {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 7px; border: 1px solid var(--line); background: rgba(0,0,0,.15);
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .02em;
}
.track-chips .icon { width: 11px; height: 11px; color: var(--accent); }
.next-actions { display: flex; align-items: center; gap: 18px; margin-top: auto; padding-top: 18px; flex-wrap: wrap; }
.next-weather { border-left: 1px solid var(--line); padding-left: 14px; }
.next-weather span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; }
.next-weather b { font-family: var(--font-mono); font-size: 15px; color: var(--ink-dim); font-weight: 500; }
.next-race-index { position: absolute; right: 22px; top: 18px; text-align: right; z-index: 2; }
.next-race-index span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .18em; }
.next-race-index b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 32px; line-height: .9; letter-spacing: -.04em; color: rgba(255,255,255,.58); }
.next-race-index i { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); font-style: normal; }

.board-card { padding-bottom: 12px; }
.conf-badge.conf-ok { color: var(--ok); border-color: rgba(66,224,165,.3); background: rgba(66,224,165,.06); }
.conf-badge.conf-warn { color: var(--warn); border-color: rgba(255,202,88,.3); background: rgba(255,202,88,.06); }
.conf-badge.conf-bad { color: var(--bad); border-color: rgba(255,96,114,.3); background: rgba(255,96,114,.06); }
.confidence-layout { display: flex; align-items: center; gap: 16px; padding: 14px 16px 10px; }
.confidence-ring {
  width: 100px; height: 100px; flex: 0 0 auto; border-radius: 50%;
  background: conic-gradient(from 200deg, var(--ring-color, var(--ok)) var(--conf), rgba(255,255,255,.075) 0);
  padding: 5px;
  transform: rotate(-16deg);
}
.confidence-ring-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #111820, #0a0e13);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transform: rotate(16deg);
  border: 1px solid rgba(255,255,255,.06);
}
.confidence-ring-inner b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 30px; letter-spacing: -.04em; line-height: .9; }
.confidence-ring-inner span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); margin-top: 3px; }
.confidence-ring.conf-ok { --ring-color: var(--ok); }
.confidence-ring.conf-warn { --ring-color: var(--warn); }
.confidence-ring.conf-bad { --ring-color: var(--bad); }
.confidence-copy p { font-size: 12.5px; line-height: 1.65; color: var(--ink-mute); margin-top: 5px; }
.confidence-copy .eyebrow { font-size: 9px; }
.board-goal { margin: 4px 16px 10px; border: 1px solid var(--line); background: rgba(255,255,255,.02); padding: 9px 10px; }
.board-goal span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; }
.board-goal b { display: block; font-size: 12.5px; color: var(--ink-dim); line-height: 1.5; margin-top: 3px; font-weight: 600; }
.board-rows { display: flex; padding: 2px 16px 10px; }
.board-rows > div { flex: 1; border-left: 1px solid var(--line); padding-left: 10px; }
.board-rows > div:first-child { border-left: 0; padding-left: 0; }
.board-rows span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.board-rows b { display: block; font-family: var(--font-mono); font-size: 14px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
.board-memo { margin-top: auto; padding: 9px 16px 0; border-top: 1px dashed var(--line); }
.board-memo span { font-family: var(--font-mono); font-size: 9px; color: var(--accent); letter-spacing: .08em; }
.board-memo p { font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; margin-top: 2px; }

.stat-strip { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); background: rgba(255,255,255,.016); margin-top: 12px; }
.mini-stat { padding: 12px 16px; border-left: 1px solid var(--line); position: relative; }
.mini-stat:first-child { border-left: 0; }
.mini-stat span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; }
.mini-stat b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 25px; letter-spacing: -.03em; line-height: 1.2; margin-top: 1px; }
.mini-stat b.mono { font-family: var(--font-mono); font-style: normal; font-size: 18px; font-weight: 500; }
.mini-stat small { display: block; font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hq-lower-grid { display: grid; grid-template-columns: minmax(0, 1.28fr) minmax(0, .92fr); gap: 12px; margin-top: 12px; align-items: start; }
.hq-side-stack { display: flex; flex-direction: column; gap: 12px; }
.mini-table-head { display: grid; grid-template-columns: 30px 1fr 1.1fr 44px; gap: 9px; padding: 7px 16px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; border-bottom: 1px solid var(--line); }
.mini-table-head span:last-child { text-align: right; }
.mini-standings { padding: 4px 8px 8px; }
.mini-stand-row { display: grid; grid-template-columns: 30px 1fr 1.1fr 44px; align-items: center; gap: 9px; padding: 8px; border-bottom: 1px solid rgba(255,255,255,.045); border-radius: 2px; }
.mini-stand-row:last-child { border-bottom: 0; }
.mini-stand-row.is-player { background: rgba(var(--accent-rgb), .07); box-shadow: inset 2px 0 0 var(--accent); }
.mini-pos { font-family: var(--font-mono); font-size: 13px; color: var(--ink-mute); }
.mini-team { display: flex; align-items: center; gap: 7px; min-width: 0; }
.mini-team .team-mono { width: 22px; height: 22px; font-size: 10px; }
.mini-team b { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.mini-team i { font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-bar { height: 2px; background: rgba(255,255,255,.065); display: block; }
.mini-bar i { display: block; height: 100%; background: var(--team); opacity: .7; }
.mini-points { font-family: var(--font-mono); font-size: 13px; text-align: right; color: var(--ink-dim); }
.mini-stand-row.is-player .mini-points { color: var(--ink); }

.current-project-card .panel-head { min-height: 42px; }
.project-body { display: flex; align-items: center; gap: 12px; padding: 10px 16px 12px; }
.project-car { width: 132px; flex: 0 0 auto; opacity: .8; }
.project-car svg { width: 100%; }
.project-copy { flex: 1; min-width: 0; }
.project-score { display: flex; align-items: baseline; gap: 7px; }
.project-score b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 27px; letter-spacing: -.04em; line-height: .9; }
.project-score span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.project-idle { font-size: 11.5px; color: var(--ink-faint); line-height: 1.6; margin: 6px 0 8px; }
.active-project-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-top: 4px; }
.active-project-line span { color: var(--ink-dim); }
.active-project-line b { color: var(--accent); font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
.project-progress { display: flex; gap: 3px; margin-top: 6px; }
.project-progress i { height: 3px; flex: 1; background: rgba(255,255,255,.08); }
.project-progress i.done { background: var(--accent); }
.project-stats-mini { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.project-stats-mini span { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 7px; border-left: 1px solid var(--line); font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.project-stats-mini span:first-child { border-left: 0; }
.project-stats-mini i { font-style: normal; font-size: 8.5px; }
.project-stats-mini b { color: var(--ink-dim); font-weight: 500; }
.wire-list { padding: 4px 12px 8px; }
.wire-item { display: grid; grid-template-columns: 62px 1fr 26px; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.wire-item:last-child { border-bottom: 0; }
.wire-tag { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .04em; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), .25); padding: 2px 4px; text-align: center; border-radius: 2px; white-space: nowrap; }
.wire-item b { font-size: 12.5px; font-weight: 600; line-height: 1.45; display: block; color: var(--ink-dim); }
.wire-item p { font-size: 10.5px; color: var(--ink-faint); line-height: 1.55; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.wire-time { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); text-align: right; padding-top: 2px; }

/* ---------- generic modal additions ---------- */
.howto { display: flex; flex-direction: column; border: 1px solid var(--line); margin-bottom: 16px; }
.howto-step { display: flex; gap: 12px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.howto-step:last-child { border-bottom: 0; }
.howto-step > span { font-family: var(--font-mono); font-size: 11px; color: var(--accent); padding-top: 2px; }
.howto-step b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
.howto-step p { font-size: 12.5px; color: var(--ink-mute); line-height: 1.6; margin-top: 2px; }
.sign-profile { padding: 12px; margin-bottom: 0; }
.sign-summary { margin-top: 12px; }
.modal-subtitle { font-size: 14px; font-weight: 600; color: var(--ink-dim); margin: 18px 0 9px; }
.sign-warning { color: var(--bad); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }

@media (max-width: 1320px) {
  .hq-hero-grid { grid-template-columns: minmax(0, 1.42fr) minmax(310px, .9fr); }
  .next-race-copy { max-width: 66%; }
  .next-race-bg { width: 62%; }
  .hq-lower-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, .9fr); }
  .wire-item { grid-template-columns: 58px 1fr 24px; }
}
@media (max-width: 1160px) {
  .game-screen { grid-template-columns: 218px minmax(0, 1fr); }
  .hq-hero-grid, .hq-lower-grid { grid-template-columns: 1fr; }
  .hq-side-stack { display: grid; grid-template-columns: 1fr 1fr; }
  .next-race-hero { min-height: 330px; }
  .next-race-copy { max-width: 70%; }
  .project-car { width: 150px; }
}
@media (max-width: 900px) {
  .game-screen { display: block; }
  .app-sidebar {
    position: sticky; top: 0; height: auto; border-right: 0; border-bottom: 1px solid var(--line-strong);
    background: rgba(8, 11, 15, .96); backdrop-filter: blur(16px);
  }
  .side-scroll { flex-direction: row; align-items: center; height: auto; padding: 0; overflow: visible; }
  .side-brand, .side-team, .side-round, .side-spacer, .side-finance, .side-foot-actions { display: none; }
  .side-nav { flex-direction: row; margin: 0; padding: 0 10px; overflow-x: auto; width: 100%; }
  .side-link { border-left: 0; border-bottom: 2px solid transparent; min-height: 48px; padding: 0 12px; flex: 0 0 auto; grid-template-columns: 16px auto; }
  .side-link small { display: none; }
  .side-link.active { border-bottom-color: var(--accent); background: transparent; }
  .side-link span { font-size: 13px; }
  .side-mobile-head { display: none; }
  .game-topbar { padding: 14px 18px; }
  .topbar-title h1 { font-size: 19px; }
  .topbar-chip { display: none; }
  .game-content { padding: 18px; }
  .game-footer { padding: 12px 18px; }
  .next-race-copy { max-width: 78%; }
  .next-race-bg { width: 65%; opacity: .35; }
  .hq-side-stack { grid-template-columns: 1fr; }
  .page-intro-meta { display: none; }
  .page-intro-row { margin-bottom: 16px; }
  .stat-strip { grid-template-columns: 1fr 1fr; }
  .mini-stat:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .mini-stat:nth-child(4) { border-top: 1px solid var(--line); }
}
@media (max-width: 640px) {
  .game-topbar { flex-wrap: wrap; gap: 10px; }
  .topbar-actions { width: 100%; justify-content: flex-start; }
  .topbar-actions .btn { width: 100%; }
  .game-content { padding: 14px; }
  .next-race-hero { min-height: 0; padding: 18px; }
  .next-race-copy { max-width: 100%; }
  .next-race-copy h2 { font-size: 34px; }
  .next-race-bg { width: 100%; top: 20%; opacity: .18; }
  .next-race-index { right: 14px; top: 12px; }
  .next-race-index b { font-size: 24px; }
  .next-actions { margin-top: 14px; }
  .next-race-copy .next-desc { font-size: 12.5px; }
  .board-card { padding-bottom: 10px; }
  .confidence-layout { gap: 12px; }
  .confidence-ring { width: 86px; height: 86px; }
  .stat-strip { grid-template-columns: 1fr; }
  .mini-stat { border-left: 0; border-top: 1px solid var(--line); }
  .mini-stat:first-child { border-top: 0; }
  .mini-table-head, .mini-stand-row { grid-template-columns: 26px 1fr 50px; }
  .mini-table-head span:nth-child(3) { display: none; }
  .mini-stand-row .mini-bar { display: none; }
  .project-body { flex-direction: column; align-items: flex-start; }
  .project-car { width: 100%; max-width: 260px; }
  .wire-item { grid-template-columns: 58px 1fr; }
  .wire-time { display: none; }
  .game-footer { flex-direction: column; align-items: flex-start; gap: 5px; }
  .page-greeting { font-size: 26px; }
  .section-title-row { flex-direction: column; align-items: flex-start; gap: 4px; }
  .next-actions .btn { width: 100%; }
  .next-weather { border-left: 0; padding-left: 0; }
}

/* ---------- legibility pass ---------- */
.wire-item b { font-size: 13px; }
.wire-item p { font-size: 11px; }
.mini-table-head { font-size: 9.5px; }
.mini-team b { font-size: 13px; }
.mini-points { font-size: 13.5px; }
.topbar-chip b { font-size: 14.5px; }
.side-link span { font-size: 14px; }
.side-switch {
  background: none; border: 0; padding: 2px 0; color: var(--ink-faint);
  font-size: 10px; font-family: var(--font-mono); letter-spacing: .04em;
}
.side-switch:hover { color: var(--accent); }
.side-foot-actions { flex-wrap: wrap; row-gap: 5px; }
.topbar-switch { display: none; }
@media (max-width: 900px) { .topbar-switch { display: inline-flex; } }

/* ---------- driver form / dynamic ability ---------- */
.form-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; border: 1px solid var(--line);
  border-radius: 2px; font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-mute); background: rgba(255,255,255,.025);
  white-space: nowrap; vertical-align: middle;
}
.form-badge i { font-style: normal; font-size: 10px; line-height: 1; color: currentColor; }
.form-badge b { font-weight: 600; font-size: inherit; font-family: inherit; color: inherit; white-space: nowrap; overflow: visible; text-overflow: clip; }
.form-badge em { font-style: normal; font-size: 10.5px; color: var(--ink-faint); font-family: inherit; }
.form-badge.is-compact { padding: 1px 5px; font-size: 10.5px; }
.form-hot { color: var(--ok); border-color: rgba(66,224,165,.3); background: rgba(66,224,165,.07); }
.form-good { color: #8fe3bf; border-color: rgba(66,224,165,.2); background: rgba(66,224,165,.045); }
.form-steady { color: var(--ink-mute); }
.form-cold { color: var(--warn); border-color: rgba(255,202,88,.26); background: rgba(255,202,88,.055); }
.form-bad { color: var(--bad); border-color: rgba(255,96,114,.26); background: rgba(255,96,114,.055); }
.ovr-delta { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); font-weight: 500; margin-top: 1px; }
.ovr-delta.up { color: var(--ok); }
.ovr-delta.down { color: var(--bad); }
.driver-form-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.driver-form-row > span:first-child { font-size: 11px; color: var(--ink-faint); width: 26px; flex: 0 0 auto; }
.driver-form-row .form-badge { margin-left: auto; }
.season-form-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 15px 4px; border-top: 1px solid var(--line); }
.season-form-row > div { display: flex; align-items: center; gap: 8px; }
.season-form-row > div > span:first-child { font-size: 11px; color: var(--ink-mute); }
.form-spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; width: 58px; flex: 0 0 auto; }
.form-spark i { flex: 1; min-width: 3px; border-radius: 1px 1px 0 0; background: var(--ink-faint); opacity: .75; }
.form-spark i.hot { background: var(--ok); }
.form-spark i.good { background: #8fe3bf; }
.form-spark i.steady { background: var(--ink-mute); }
.form-spark i.cold { background: var(--warn); }
.form-spark i.bad { background: var(--bad); }
.form-spark.is-large { height: 24px; width: 86px; }
.result-form { border: 1px solid var(--line); background: rgba(255,255,255,.012); }
.result-form-row { display: flex; align-items: center; gap: 7px; padding: 5px 9px; border-top: 1px solid rgba(255,255,255,.04); }
.result-form-row > span:first-child { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-mute); flex: 1; min-width: 0; }
.result-form-row .avatar { width: 19px; height: 19px; }
.result-form-row > b { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
.result-form-row > b.positive { color: var(--ok); }
.result-form-row > b.negative { color: var(--bad); }
.result-form-row > em { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); width: 34px; text-align: right; }
.result-development { border: 1px solid var(--line); background: rgba(255,255,255,.012); margin-top: 7px; }
.result-dev-row { display: flex; align-items: center; gap: 7px; padding: 5px 9px; border-top: 1px solid rgba(255,255,255,.04); }
.result-dev-row > span:first-child { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-mute); flex: 1; min-width: 0; }
.result-dev-row .avatar { width: 19px; height: 19px; }
.result-dev-row > b { font-family: var(--font-mono); font-size: 10px; font-weight: 500; color: var(--ok); white-space: nowrap; }
.result-dev-row > em { font-style: normal; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); text-align: right; flex: 1.2; line-height: 1.4; }

/* text density helpers */
.team-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.market-rules-fold { margin: 0 12px 12px; }
.calendar-data-fold { margin-top: 10px; }

/* keep form badges from being squeezed in flex rows */
.form-badge { flex: 0 0 auto; }
.driver-form-row { flex-wrap: wrap; }
.season-form-row { flex-wrap: wrap; }

@media (max-width: 640px) {
  .topbar-actions { width: 100%; justify-content: flex-start; }
  .topbar-actions .btn { width: auto; }
}

/* ---- pages.css ---- */
/* ============================================================
   RESEARCH CENTRE + RACE DRIVERS
   ============================================================ */

.rnd-top-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(330px, .9fr); gap: 12px; align-items: stretch; }
.car-detail-panel { overflow: hidden; }
.car-detail-body { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 270px; }
.car-detail-art {
  position: relative; display: flex; align-items: center; justify-content: center; padding: 18px;
  background:
    radial-gradient(ellipse at 50% 52%, rgba(var(--accent-rgb), .1), transparent 60%),
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: auto, 32px 32px, 32px 32px;
  border-right: 1px solid var(--line);
  overflow: hidden;
}
.car-detail-art svg { width: min(100%, 520px); height: auto; }
.car-detail-art::after { content: "TECHNICAL VIEW / PB-26"; position: absolute; left: 14px; bottom: 12px; font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-faint); }
.car-detail-score { position: absolute; right: 16px; top: 14px; text-align: right; }
.car-detail-score strong { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: -.05em; line-height: .9; }
.car-detail-score span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; margin-top: 3px; }
.car-detail-stats { padding: 18px 18px 14px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.detail-stat > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.detail-stat span { font-size: 12px; color: var(--ink-mute); }
.detail-stat b { font-family: var(--font-display); font-style: italic; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.detail-stat > i { display: block; height: 3px; background: rgba(255,255,255,.07); margin: 5px 0 4px; }
.detail-stat > i em { display: block; height: 100%; background: linear-gradient(90deg, rgba(var(--accent-rgb), .45), var(--accent)); }
.detail-stat small { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .03em; }

.rnd-active-panel { padding-bottom: 0; display: flex; flex-direction: column; }
.rnd-active-body { padding: 18px 18px 4px; }
.rnd-active-icon {
  width: 38px; height: 38px; border: 1px solid rgba(var(--accent-rgb), .3); background: rgba(var(--accent-rgb), .08);
  display: grid; place-items: center; color: var(--accent); margin-bottom: 11px;
}
.rnd-active-icon.idle { color: var(--ink-mute); border-color: var(--line-strong); background: rgba(255,255,255,.025); }
.rnd-active-icon .icon { width: 17px; height: 17px; }
.rnd-active-copy h3, .rnd-idle-body h3 { font-size: 20px; font-weight: 750; letter-spacing: -.03em; line-height: 1.25; margin-top: 3px; }
.rnd-active-copy p, .rnd-idle-body p { font-size: 12px; color: var(--ink-mute); line-height: 1.65; margin-top: 5px; }
.rnd-progress-block { margin-top: 16px; }
.rnd-progress-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
.rnd-progress-head b { color: var(--ink-dim); font-weight: 500; }
.rnd-progress { display: flex; gap: 4px; margin-top: 5px; }
.rnd-progress i { flex: 1; height: 4px; background: rgba(255,255,255,.075); }
.rnd-progress i.done { background: rgba(var(--accent-rgb), .65); }
.rnd-progress i.current { background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), .5); }
.rnd-idle-body { padding: 24px 18px 12px; display: flex; gap: 13px; align-items: flex-start; }
.rnd-window-meta { display: flex; margin-top: auto; border-top: 1px solid var(--line); }
.rnd-window-meta > div { flex: 1; padding: 10px 12px; border-left: 1px solid var(--line); }
.rnd-window-meta > div:first-child { border-left: 0; }
.rnd-window-meta span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .02em; }
.rnd-window-meta b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rnd-active-panel .note-line { padding-bottom: 12px; }

.upgrade-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.upgrade-card { padding: 16px; display: flex; flex-direction: column; transition: border-color .25s, transform .25s; }
.upgrade-card:hover { border-color: var(--line-strong); }
.upgrade-card.maxed { opacity: .68; }
.upgrade-card.is-blocked { background: rgba(255,255,255,.012); }
.rnd-card-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.rnd-tag { display: inline-block; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), .25); background: rgba(var(--accent-rgb), .06); padding: 1px 5px; border-radius: 2px; }
.rnd-card-top h3 { font-size: 17.5px; font-weight: 700; letter-spacing: -.02em; line-height: 1.3; margin-top: 6px; }
.rnd-en { font-family: var(--font-mono); font-size: 9px; letter-spacing: .09em; color: var(--ink-faint); }
.rnd-level { text-align: right; }
.rnd-level span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; }
.rnd-level b { font-family: var(--font-display); font-style: italic; font-size: 24px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.rnd-level b i { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); font-weight: 400; }
.rnd-desc { font-size: 12px; color: var(--ink-mute); line-height: 1.65; margin-top: 10px; }
.rnd-effects { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.rnd-effects > span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); margin-right: 3px; }
.rnd-effects b { font-size: 10px; font-weight: 500; color: var(--ok); border: 1px solid rgba(66,224,165,.2); background: rgba(66,224,165,.06); padding: 2px 5px; }
.rnd-meta-row { display: flex; gap: 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 11px; padding: 8px 0; }
.rnd-meta-row > div span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.rnd-meta-row > div b { display: block; font-size: 11.5px; color: var(--ink-dim); font-weight: 600; margin-top: 2px; }
.rnd-meta-row > div b.mono { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.rnd-meta-row > div b em { font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); text-decoration: line-through; margin-left: 5px; }
.rnd-level-dots { display: flex; gap: 3px; margin-top: 9px; }
.rnd-level-dots i { width: 18px; height: 2px; background: rgba(255,255,255,.09); }
.rnd-level-dots i.done { background: var(--accent); }
.upgrade-card > .btn { margin-top: 12px; width: 100%; }
.rnd-block-reason { display: block; text-align: center; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); margin-top: 6px; }

/* ---------- drivers ---------- */
.driver-page-grid { display: grid; grid-template-columns: 1fr 1fr .82fr; gap: 12px; align-items: stretch; }
.season-driver-card { --driver: var(--accent); overflow: hidden; position: relative; padding: 0 0 12px; }
.season-driver-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--driver), transparent 70%); }
.season-driver-head { display: flex; gap: 12px; align-items: center; padding: 15px; border-bottom: 1px solid var(--line); }
.season-driver-id { flex: 1; min-width: 0; }
.season-driver-id h3 { font-size: 19px; font-weight: 750; letter-spacing: -.025em; line-height: 1.25; }
.season-driver-id > span:last-child { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.season-driver-ovr { text-align: right; align-self: flex-start; }
.season-driver-ovr span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; }
.season-driver-ovr b { font-family: var(--font-display); font-style: italic; font-size: 31px; font-weight: 900; letter-spacing: -.04em; line-height: .95; color: var(--driver); }
.driver-season-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.driver-season-stats > div { padding: 9px 10px; border-left: 1px solid var(--line); }
.driver-season-stats > div:first-child { border-left: 0; }
.driver-season-stats span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.driver-season-stats b { display: block; font-family: var(--font-display); font-style: italic; font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.season-attrs { padding: 12px 15px 3px; display: flex; flex-direction: column; gap: 7px; }
.season-attr { display: flex; align-items: center; gap: 9px; }
.season-attr span { width: 26px; font-size: 11px; color: var(--ink-mute); flex: 0 0 auto; }
.season-attr i { flex: 1; height: 3px; background: rgba(255,255,255,.07); display: block; }
.season-attr i em { display: block; height: 100%; background: var(--driver); opacity: .8; }
.season-attr b { width: 18px; text-align: right; font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); font-weight: 500; }
.season-racecraft {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
  padding: 9px 15px 12px; border-top: 1px solid var(--line);
}
.season-racecraft > span {
  grid-column: 1 / -1; font-family: var(--font-mono); font-size: 8px;
  letter-spacing: .14em; color: var(--ink-faint);
}
.season-racecraft > div { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.season-racecraft > div span { font-size: 9.5px; color: var(--ink-faint); }
.season-racecraft > div b { font-family: var(--font-mono); font-size: 12px; color: var(--ink); font-weight: 600; }
.season-racecraft > div i { flex: 1 0 100%; display: block; height: 2px; background: rgba(255,255,255,.07); }
.season-racecraft > div i em { display: block; height: 100%; background: var(--driver); opacity: .75; }
.season-driver-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 10px 15px 0; margin-top: 5px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--ink-faint); }
.season-driver-foot > span { display: flex; align-items: center; gap: 4px; }
.season-driver-foot i { font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.season-driver-foot b { color: var(--ink-mute); font-weight: 500; }
.driver-market-closed { display: flex; flex-direction: column; }
.driver-market-closed .panel-head { padding: 13px 14px; }
.closed-body { padding: 18px 15px 12px; }
.closed-icon { width: 35px; height: 35px; display: grid; place-items: center; border: 1px solid var(--line-strong); color: var(--ink-faint); margin-bottom: 10px; }
.closed-icon .icon { width: 16px; height: 16px; }
.closed-body h3 { font-size: 18.5px; line-height: 1.35; letter-spacing: -.025em; font-weight: 700; }
.closed-body p { font-size: 11.5px; color: var(--ink-mute); line-height: 1.7; margin-top: 6px; }
.closed-note { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); padding: 8px 9px; margin-top: 12px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.closed-note b { font-weight: 500; color: var(--ink-mute); text-align: right; }
.driver-pair-summary { padding: 12px 15px 15px; margin-top: auto; border-top: 1px solid var(--line); }
.pair-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; margin-top: 8px; }
.pair-bars > div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 3px; font-size: 11px; color: var(--ink-mute); }
.pair-bars b { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-weight: 500; }
.driver-expenses { margin-top: 12px; }
.expense-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.expense-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-mute); }
.expense-row:nth-child(3n) { border-right: 0; }
.expense-row.total { color: var(--ink); background: rgba(var(--accent-rgb), .04); }
.expense-row b { font-family: var(--font-mono); color: var(--ink-dim); font-weight: 500; }
.expense-row.total b { color: var(--accent); }
.expense-foot { display: flex; gap: 20px; flex-wrap: wrap; padding: 9px 15px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .03em; }

/* ---------- driver development / simulator ---------- */
.driver-development-panel { margin-bottom: 12px; overflow: hidden; }
.dev-toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  padding: 12px 15px; border-bottom: 1px solid var(--line);
  background: linear-gradient(100deg, rgba(var(--accent-rgb), .055), transparent 60%);
}
.dev-toolbar-copy > span { display: block; font-family: var(--font-mono); font-size: 8px; letter-spacing: .13em; color: var(--ink-faint); }
.dev-toolbar-copy > span em { font-style: normal; color: var(--accent); margin-left: 5px; }
.dev-toolbar-copy > b { display: block; font-family: var(--font-display); font-style: italic; font-size: 22px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.dev-toolbar-copy > small { display: block; font-size: 10px; color: var(--ink-faint); margin-top: 2px; }
.dev-facility { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.dev-facility > div span { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); letter-spacing: .06em; }
.dev-facility > div b { display: block; font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
.dev-facility .btn { font-size: 10px; min-height: 30px; }
.dev-facility .btn .icon { width: 12px; height: 12px; }
.dev-driver-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.dev-driver-row {
  position: relative; padding: 14px 15px;
  border-right: 1px solid var(--line);
  background: linear-gradient(135deg, color-mix(in srgb, var(--driver) 4%, transparent), transparent 58%);
}
.dev-driver-row:nth-child(2n) { border-right: 0; }
.dev-driver-head { display: flex; align-items: center; gap: 10px; }
.dev-driver-id { flex: 1; min-width: 0; }
.dev-driver-id > span { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); letter-spacing: .04em; }
.dev-driver-id > b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
.dev-driver-id > small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--driver); margin-top: 1px; }
.dev-driver-ovr { text-align: right; flex: 0 0 auto; }
.dev-driver-ovr span { display: block; font-family: var(--font-mono); font-size: 7.5px; color: var(--ink-faint); letter-spacing: .08em; }
.dev-driver-ovr b { display: block; font-family: var(--font-display); font-style: italic; font-size: 25px; font-weight: 900; line-height: .95; color: var(--driver); }
.dev-driver-ovr small { display: block; font-family: var(--font-mono); font-size: 7.5px; color: var(--ink-faint); margin-top: 2px; }
.dev-xp-head { display: flex; justify-content: space-between; gap: 10px; margin-top: 12px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.dev-xp-head b { font-weight: 500; color: var(--ink-mute); }
.dev-xp-bar { height: 4px; background: rgba(255,255,255,.06); margin-top: 5px; overflow: hidden; border-radius: 2px; }
.dev-xp-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--driver), var(--accent)); transition: width .3s ease; }
.dev-gain-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 7px; font-size: 9.5px; color: var(--ink-faint); }
.dev-gain-line em { font-style: normal; font-family: var(--font-mono); font-size: 8px; color: var(--ink-mute); }
.dev-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.dev-actions .btn { font-size: 10px; min-height: 28px; padding: 0 9px; }
.dev-actions .btn small { font-family: var(--font-mono); font-size: 8px; opacity: .68; margin-left: 5px; }
.dev-actions .btn .icon { width: 12px; height: 12px; }
.dev-panel-note {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 10px 15px 12px; border-top: 1px solid var(--line);
  font-size: 10px; line-height: 1.65; color: var(--ink-faint);
}
.dev-panel-note .icon { width: 12px; height: 12px; flex: 0 0 auto; margin-top: 1px; }

@media (max-width: 1320px) {
  .rnd-top-grid { grid-template-columns: 1fr; }
  .driver-page-grid { grid-template-columns: 1fr 1fr; }
  .driver-market-closed { grid-column: 1 / -1; }
  .closed-body { padding-bottom: 6px; }
  .driver-pair-summary { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .pair-bars { flex: 1; min-width: 250px; margin-top: 0; }
  .upgrade-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 980px) {
  .car-detail-body { grid-template-columns: 1fr; }
  .car-detail-art { min-height: 230px; border-right: 0; border-bottom: 1px solid var(--line); }
  .car-detail-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; padding: 16px; }
  .upgrade-grid { grid-template-columns: 1fr; }
  .expense-grid { grid-template-columns: 1fr 1fr; }
  .expense-row:nth-child(3n) { border-right: 1px solid var(--line); }
  .expense-row:nth-child(2n) { border-right: 0; }
}
@media (max-width: 800px) {
  .driver-page-grid { grid-template-columns: 1fr; }
  .driver-market-closed { grid-column: auto; }
  .driver-pair-summary { display: block; }
  .pair-bars { margin-top: 8px; }
  .dev-driver-list { grid-template-columns: 1fr; }
  .dev-driver-row { border-right: 0; border-bottom: 1px solid var(--line); }
  .dev-driver-row:last-child { border-bottom: 0; }
  .dev-toolbar { align-items: flex-start; }
  .dev-facility { width: 100%; justify-content: space-between; }
}
@media (max-width: 640px) {
  .car-detail-stats { grid-template-columns: 1fr; }
  .car-detail-art { min-height: 180px; }
  .rnd-window-meta { flex-wrap: wrap; }
  .rnd-window-meta > div { flex: 1 1 50%; border-top: 1px solid var(--line); }
  .rnd-meta-row { gap: 14px; }
  .upgrade-card { padding: 13px; }
  .driver-season-stats { grid-template-columns: 1fr 1fr; }
  .driver-season-stats > div:nth-child(3) { border-left: 0; border-top: 1px solid var(--line); }
  .driver-season-stats > div:nth-child(4) { border-top: 1px solid var(--line); }
  .expense-grid { grid-template-columns: 1fr; }
  .expense-row { border-right: 0 !important; }
  .closed-body { padding-top: 14px; }
}

/* ============================================================
   R&D TREE + RISK
   ============================================================ */
.risk-up { color: var(--bad) !important; }
.risk-down { color: var(--ok) !important; }
.risk-mid { color: var(--warn) !important; }
.car-risk-strip { display: flex; border-top: 1px solid var(--line); background: rgba(255,255,255,.018); }
.car-risk-strip > div { flex: 1; padding: 9px 14px; border-left: 1px solid var(--line); }
.car-risk-strip > div:first-child { border-left: 0; }
.car-risk-strip span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.car-risk-strip b { display: block; font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
.rnd-tree-platform {
  display: flex; align-items: center; gap: 13px;
  border: 1px solid var(--line); background:
    linear-gradient(90deg, rgba(var(--accent-rgb), .08), transparent 55%),
    rgba(255,255,255,.018);
  padding: 12px 15px;
  position: relative;
  overflow: hidden;
}
.rnd-tree-platform::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.platform-mark {
  width: 34px; height: 34px; flex: 0 0 auto;
  display: grid; place-items: center; border: 1px solid rgba(var(--accent-rgb), .3);
  color: var(--accent); font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 16px;
}
.rnd-tree-platform h4 { font-size: 15px; font-weight: 650; margin-top: 2px; }
.rnd-tree-platform p { font-size: 11px; color: var(--ink-mute); line-height: 1.55; max-width: 580px; margin-left: 10px; flex: 1; }
.platform-risk { margin-left: auto; text-align: right; }
.platform-risk span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.platform-risk b { display: block; font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin-top: 1px; }
.tree-branches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; margin-top: 9px; align-items: start; }
.rnd-branch { border: 1px solid var(--line); background: rgba(255,255,255,.012); min-width: 0; }
.branch-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(var(--branch-rgb), .10), transparent 72%); }
.branch-code {
  width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center;
  border: 1px solid rgba(var(--branch-rgb), .42); color: var(--branch);
  font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 14px;
  background: rgba(var(--branch-rgb), .06);
}
.branch-head h4 { font-size: 13.5px; font-weight: 650; line-height: 1.2; }
.branch-head span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; }
.branch-head > b { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--branch); font-weight: 500; }
.branch-desc { font-size: 10.5px; line-height: 1.55; color: var(--ink-faint); padding: 8px 10px; border-bottom: 1px solid var(--line); min-height: 44px; }
.branch-nodes { display: flex; flex-direction: column; gap: 7px; padding: 9px 9px 10px; position: relative; }
.branch-nodes::before { content: ""; position: absolute; left: 3px; top: 14px; bottom: 20px; width: 1px; background: linear-gradient(var(--branch), var(--line) 30%, transparent); opacity: .35; }
.tree-node {
  position: relative; padding: 9px 10px 9px 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.018);
  border-left: 2px solid var(--line);
}
.tree-node::before { content: ""; position: absolute; left: -9px; top: 16px; width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--branch); background: #0b1017; }
.tree-node.is-completed { border-color: rgba(var(--branch-rgb), .28); background: rgba(var(--branch-rgb), .035); border-left-color: var(--branch); }
.tree-node.is-active { border-color: rgba(var(--accent-rgb), .45); background: rgba(var(--accent-rgb), .055); box-shadow: 0 0 20px -12px rgba(var(--accent-rgb), .7); }
.tree-node.is-locked { opacity: .56; }
.node-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.node-tier { font-family: var(--font-mono); font-size: 8.5px; color: var(--branch); border: 1px solid rgba(var(--branch-rgb), .3); padding: 1px 4px; letter-spacing: .04em; }
.node-state { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.tree-node.is-completed .node-state { color: var(--ok); }
.tree-node.is-active .node-state { color: var(--accent); }
.tree-node h4 { font-size: 14.5px; font-weight: 650; line-height: 1.3; margin-top: 6px; }
.tree-node h4 em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; letter-spacing: .04em; }
.node-desc { font-size: 10.5px; color: var(--ink-mute); line-height: 1.55; margin-top: 5px; }
.node-effects { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.node-effects span { font-size: 9.5px; color: var(--ink-mute); border: 1px solid var(--line); padding: 2px 4px; background: rgba(255,255,255,.02); }
.node-effects b { color: var(--ok); font-weight: 500; }
.node-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; margin-top: 8px; }
.node-meta > div { display: flex; justify-content: space-between; gap: 4px; }
.node-meta span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.node-meta b { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; color: var(--ink-mute); text-align: right; }
.node-progress { height: 2px; background: rgba(255,255,255,.07); margin-top: 7px; }
.node-progress i { display: block; height: 100%; background: var(--accent); }
.node-requires { font-family: var(--font-mono); font-size: 8.5px; color: var(--warn); margin-top: 6px; line-height: 1.5; }
.node-btn { width: 100%; min-height: 29px; font-size: 11px; margin-top: 8px; padding: 0 8px; }
.node-btn:disabled { opacity: .55; filter: none; }
.tree-node.is-completed .node-btn { color: var(--ok); border-color: rgba(66,224,165,.22); opacity: 1; }
.rnd-active-panel .note-line { margin-top: auto; }

@media (max-width: 1380px) {
  .tree-branches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .branch-desc { min-height: 0; }
}
@media (max-width: 800px) {
  .tree-branches { grid-template-columns: 1fr; }
  .rnd-tree-platform { flex-wrap: wrap; }
  .rnd-tree-platform p { margin-left: 0; flex-basis: 100%; }
  .platform-risk { margin-left: 0; text-align: left; }
  .car-risk-strip { flex-wrap: wrap; }
  .car-risk-strip > div { flex: 1 1 50%; border-top: 1px solid var(--line); }
  .car-risk-strip > div:nth-child(-n+2) { border-top: 0; }
}

/* season driver morale */
.season-morale { padding: 9px 15px 3px; border-top: 1px solid var(--line); }
.season-morale > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.season-morale span { font-size: 11px; color: var(--ink-mute); }
.season-morale b { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-weight: 500; }
.season-morale > i { display: block; height: 3px; background: rgba(255,255,255,.07); margin-top: 5px; }
.season-morale > i em { display: block; height: 100%; background: var(--ok); transition: width .35s; }
.season-morale.morale-ok > i em { background: var(--warn); }
.season-morale.morale-bad > i em { background: var(--bad); }
.season-morale.morale-bad b { color: var(--bad); }
.season-morale > small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 3px; }

/* form badge inside identity blocks must stay inline */
.season-driver-id > span.form-badge { display: inline-flex; width: fit-content; }
.form-badge { width: fit-content; }

/* compact R&D copy */
.node-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.branch-desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.form-explainer { margin-bottom: 12px; }
.form-explainer .fold-body { max-width: 900px; }

/* ---- season.css ---- */
/* ============================================================
   COMMERCIAL / CALENDAR / STANDINGS / WEEKEND BRIEFING
   ============================================================ */

/* ---------- commercial ---------- */
.commercial-hero {
  display: flex; align-items: stretch; gap: 0;
  border: 1px solid var(--line);
  background:
    radial-gradient(100% 160% at 100% 0%, rgba(var(--sponsor-rgb), .17), transparent 58%),
    linear-gradient(140deg, rgba(255,255,255,.045), transparent 46%),
    #0b1016;
  position: relative; overflow: hidden;
}
.commercial-hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sponsor); }
.commercial-brand { padding: 26px 28px; flex: 1.25; min-width: 0; position: relative; z-index: 1; }
.commercial-wordmark { font-family: var(--font-display); font-weight: 900; font-size: clamp(42px, 5vw, 76px); letter-spacing: -.055em; line-height: .84; color: var(--sponsor); text-transform: uppercase; }
.sponsor-role { display: inline-block; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--ink-mute); margin-top: 12px; border: 1px solid var(--line); padding: 4px 7px; }
.commercial-brand p { max-width: 520px; margin-top: 12px; color: var(--ink-mute); font-size: 13.5px; line-height: 1.7; }
.commercial-subline { margin-top: 18px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .13em; }
.commercial-nums { flex: 0 0 41%; display: grid; grid-template-columns: 1fr; border-left: 1px solid var(--line); background: rgba(0,0,0,.12); }
.commercial-nums > div { display: flex; flex-direction: column; justify-content: center; padding: 14px 24px; border-bottom: 1px solid var(--line); position: relative; }
.commercial-nums > div:last-child { border-bottom: 0; }
.commercial-nums span { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .08em; text-transform: uppercase; }
.commercial-nums b { font-family: var(--font-mono); font-size: 24px; font-weight: 500; color: var(--ink); line-height: 1.2; margin-top: 2px; }
.commercial-nums small { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
.sponsor-target { border: 1px solid var(--line); border-top: 0; background: rgba(255,255,255,.016); padding: 15px 18px 14px; }
.target-head { display: flex; justify-content: space-between; gap: 18px; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .04em; }
.target-head b { color: var(--ink-dim); font-weight: 500; }
.target-head b.met { color: var(--ok); }
.target-track { height: 5px; background: rgba(255,255,255,.07); margin-top: 10px; position: relative; }
.target-track > i { display: block; height: 100%; background: linear-gradient(90deg, rgba(var(--sponsor-rgb), .25), var(--sponsor)); transition: width .4s; }
.target-track > span { position: absolute; top: -3px; width: 1px; height: 11px; background: var(--ink-mute); }
.target-scale { display: flex; justify-content: space-between; margin-top: 5px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.target-scale span:nth-child(2) { color: var(--sponsor); }
.reward-blocks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
.reward-blocks > div { border: 1px solid var(--line); padding: 7px 8px; background: rgba(255,255,255,.015); }
.reward-blocks > div.on { border-color: rgba(var(--sponsor-rgb), .35); background: rgba(var(--sponsor-rgb), .06); }
.reward-blocks b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink-mute); }
.reward-blocks .on b { color: var(--sponsor); }
.reward-blocks span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; }
.tech-benefit { display: flex; gap: 26px; margin-top: 10px; flex-wrap: wrap; }
.tech-benefit > div { display: flex; align-items: baseline; gap: 7px; }
.tech-benefit span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.tech-benefit b { font-family: var(--font-mono); font-size: 11.5px; font-weight: 500; color: var(--ink-dim); }
.commercial-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 12px; margin-top: 12px; }
.contract-term-list { display: flex; flex-direction: column; }
.contract-term-list > div { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 9px 16px; border-bottom: 1px solid var(--line); font-size: 12px; }
.contract-term-list > div:last-child { border-bottom: 0; }
.contract-term-list span { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .02em; }
.contract-term-list b { font-weight: 500; color: var(--ink-dim); line-height: 1.55; }
.contract-term-list b.mono { font-family: var(--font-mono); }
.finance-card .ledger { padding: 10px 16px; }
.ledger-opener { display: flex; align-items: baseline; justify-content: space-between; padding: 5px 0 9px; border-bottom: 1px solid var(--line-strong); }
.ledger-opener span { font-size: 12px; color: var(--ink-mute); }
.ledger-opener b { font-family: var(--font-mono); font-size: 21px; font-weight: 500; color: var(--ink); }
.ledger-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--ink-faint); padding: 4px 0; }
.ledger-row b { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; color: var(--ink-mute); }
.ledger-row.income b { color: var(--ok); }
.ledger-row.expense b { color: var(--ink-mute); }
.finance-projection { border-top: 1px solid var(--line); padding: 9px 16px 12px; background: rgba(255,255,255,.018); }
.finance-projection span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.finance-projection b { display: block; font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--ink-dim); margin-top: 2px; }
.finance-projection small { font-size: 10px; color: var(--ink-faint); }

/* ---------- calendar ---------- */
.season-progress-panel { display: grid; grid-template-columns: 150px 1fr; gap: 18px 26px; align-items: center; border: 1px solid var(--line); padding: 12px 16px; background: rgba(255,255,255,.018); margin-bottom: 12px; }
.season-progress-copy { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.season-progress-copy span { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .06em; }
.season-progress-copy b { font-family: var(--font-display); font-style: italic; font-size: 20px; font-weight: 800; letter-spacing: -.03em; }
.season-progress-track { height: 3px; background: rgba(255,255,255,.07); }
.season-progress-track i { display: block; height: 100%; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), .3); }
.season-progress-line { grid-column: 2; display: flex; justify-content: space-between; margin-top: -16px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.calendar-list { border-top: 1px solid var(--line); }
.calendar-row {
  display: grid; grid-template-columns: 74px minmax(230px, 1.5fr) minmax(180px, .8fr) minmax(170px, .7fr);
  gap: 20px; align-items: center;
  padding: 14px 16px;
  border: 1px solid var(--line); border-top: 0;
  background: rgba(255,255,255,.013);
  transition: background .2s;
  position: relative;
}
.calendar-row:hover { background: rgba(255,255,255,.028); }
.calendar-row.next { background: linear-gradient(90deg, rgba(var(--accent-rgb), .08), transparent 60%); box-shadow: inset 2px 0 0 var(--accent); }
.calendar-row.locked { opacity: .55; }
.cal-round { border-right: 1px solid var(--line); padding-right: 14px; }
.cal-round span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .12em; }
.cal-round b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 31px; letter-spacing: -.045em; line-height: 1; }
.cal-round i { display: inline-block; font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .05em; margin-top: 4px; }
.calendar-row.next .cal-round i { color: var(--accent); }
.calendar-row.completed .cal-round i { color: var(--ok); }
.cal-track { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cal-circuit { width: 86px; flex: 0 0 auto; color: var(--accent); opacity: .55; }
.cal-circut svg, .cal-circuit svg { width: 100%; }
.cal-copy { min-width: 0; }
.cal-copy h3 { font-size: 16.5px; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
.cal-copy > span { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-copy p { font-size: 10.5px; color: var(--ink-faint); line-height: 1.55; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; max-width: 420px; }
.cal-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px; }
.cal-specs > div { display: grid; grid-template-columns: 38px 1fr 24px; gap: 5px; align-items: center; }
.cal-specs span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.cal-specs i { height: 2px; background: rgba(255,255,255,.07); display: block; }
.cal-specs i em { display: block; height: 100%; background: var(--ink-faint); }
.cal-specs b { font-family: var(--font-mono); font-size: 9px; color: var(--ink-mute); font-weight: 400; text-align: right; }
.calendar-row.next .cal-specs i em { background: var(--accent); }
.cal-result { display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap; text-align: right; }
.cal-winner span, .cal-player-result span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.cal-winner b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 500; margin-top: 1px; }
.cal-player-result { border-left: 1px solid var(--line); padding-left: 12px; }
.cal-player-result b { font-family: var(--font-display); font-style: italic; font-size: 19px; line-height: 1; display: block; font-weight: 800; }
.cal-player-result em { font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.cal-result .btn { flex: 0 0 auto; }
.cal-result small { width: 100%; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); text-align: right; }
.cal-lock { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.cal-lock .icon { width: 12px; height: 12px; }

/* ---------- standings ---------- */
.standings-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(320px, .75fr); gap: 12px; align-items: start; }
.standings-side { display: flex; flex-direction: column; gap: 12px; }
.standings-table-wrap { overflow-x: auto; }
.standings-table { width: 100%; border-collapse: collapse; min-width: 540px; }
.standings-table.small { min-width: 0; }
.standings-table th {
  text-align: left; padding: 8px 12px; font-family: var(--font-mono); font-size: 8.5px; font-weight: 500; letter-spacing: .08em; color: var(--ink-faint);
  border-bottom: 1px solid var(--line); text-transform: uppercase; white-space: nowrap;
}
.standings-table th:first-child, .standings-table th:last-child { text-align: center; }
.standings-table td { padding: 8px 12px; font-size: 12px; color: var(--ink-mute); border-bottom: 1px solid rgba(255,255,255,.04); }
.standings-table tbody tr:last-child td { border-bottom: 0; }
.standings-table tbody tr.is-player { background: rgba(var(--accent-rgb), .065); }
.standings-table tbody tr.is-player td { color: var(--ink-dim); }
.standings-table td:first-child { width: 38px; text-align: center; }
.standings-table td:last-child { text-align: right; }
