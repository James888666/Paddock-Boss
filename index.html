/* ============================================================
   LIVE QUALIFYING
   ============================================================ */
body.quali-open { overflow: hidden; }
.quali-layer {
  position: fixed; inset: 0; z-index: 145;
  display: flex; flex-direction: column;
  background:
    radial-gradient(1100px 650px at 62% 0%, rgba(var(--accent-rgb), .08), transparent 62%),
    #05070a;
  color: var(--ink);
  isolation: isolate;
  overflow: hidden;
}
.quali-layer::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 20%, #000, transparent 80%);
}
.quali-hud {
  flex: 0 0 auto;
  display: grid; grid-template-columns: minmax(230px, 1.2fr) 170px minmax(230px, .9fr) auto;
  gap: 18px; align-items: center;
  padding: 13px 20px;
  min-height: 74px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(14,19,26,.96), rgba(9,13,18,.9));
}
.quali-hud-title { display: flex; align-items: baseline; gap: 10px; margin-top: 3px; min-width: 0; }
.quali-hud-title b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 25px; letter-spacing: -.03em; line-height: 1; }
.quali-hud-title span { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-hud-clock { display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 18px; }
.quali-hud-clock > span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .14em; }
.quali-hud-clock b { font-family: var(--font-mono); font-size: 27px; font-weight: 500; letter-spacing: -.04em; line-height: 1.15; color: var(--ink); font-variant-numeric: tabular-nums; }
.quali-hud-clock small { font-family: var(--font-mono); font-size: 10px; color: var(--accent); letter-spacing: .04em; }
.quali-hud-meta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); }
.quali-hud-meta small { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .03em; }
.quali-hud-controls { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
.quali-control-btn {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 30px; padding: 0 9px;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.03);
  color: var(--ink-dim); border-radius: 2px; font-size: 11.5px; transition: .18s;
}
.quali-control-btn .icon { width: 12px; height: 12px; }
.quali-control-btn:hover { color: var(--ink); border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.07); }
.quali-control-btn.is-paused { color: var(--accent); border-color: rgba(var(--accent-rgb), .4); background: rgba(var(--accent-rgb), .08); }
.quali-progress-track { flex: 0 0 auto; height: 2px; background: rgba(255,255,255,.06); }
.quali-progress-track i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), .65); transition: width .2s linear; }
.quali-body {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: minmax(0, 1fr) 330px;
  gap: 10px; padding: 10px 12px 12px;
}
.quali-board {
  min-width: 0; min-height: 0;
  border: 1px solid var(--line);
  background:
    linear-gradient(160deg, rgba(255,255,255,.026), transparent 34%),
    rgba(11, 16, 22, .82);
  display: flex; flex-direction: column; overflow: hidden;
}
.quali-board-head {
  flex: 0 0 auto; min-height: 40px; padding: 9px 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; color: var(--ink-mute); text-transform: uppercase;
}
.quali-board-head em { font-style: normal; color: var(--ink-faint); margin-left: 5px; font-size: 10px; }
.quali-live-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-faint); font-size: 10px; letter-spacing: .05em; }
.quali-live-tag .dot { width: 4px; height: 4px; color: var(--ok); animation: livePulse 1.5s ease-in-out infinite; }
.quali-live-table { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.quali-live-head, .quali-live-row {
  display: grid; grid-template-columns: 34px minmax(170px, 1.45fr) 72px 96px 86px 38px;
  gap: 8px; align-items: center; padding: 0 13px;
}
.quali-live-head {
  position: sticky; top: 0; z-index: 3;
  min-height: 32px; background: #0b1017;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .06em;
}
.quali-live-head span:nth-child(4), .quali-live-head span:nth-child(5), .quali-live-head span:nth-child(6) { text-align: right; }
.quali-live-row {
  min-height: 39px; border-bottom: 1px solid rgba(255,255,255,.045);
  border-left: 2px solid transparent;
  position: relative;
}
.quali-live-row:nth-child(even) { background: rgba(255,255,255,.01); }
.quali-live-row.is-player { background: rgba(var(--accent-rgb), .075); border-left-color: var(--accent); }
.quali-live-row.is-out { opacity: .56; }
.ql-pos { font-family: var(--font-mono); font-size: 13px; color: var(--ink-mute); }
.quali-live-row.is-player .ql-pos { color: var(--ink); }
.ql-driver { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ql-driver .avatar { width: 25px; height: 25px; }
.ql-driver b { display: block; font-size: 13px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-live-row.is-player .ql-driver b { color: var(--ink); }
.ql-driver small { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
.ql-team { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ql-team i { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }
.ql-time { font-size: 12px; color: var(--ink-dim); text-align: right; }
.ql-gap { font-size: 11px; color: var(--ink-faint); text-align: right; }
.ql-laps { font-size: 11px; color: var(--ink-faint); text-align: right; }
.quali-cut-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 27px; padding: 0 13px; margin: 0;
  background: rgba(255,96,114,.055);
  border-top: 1px dashed rgba(255,96,114,.35);
  border-bottom: 1px dashed rgba(255,96,114,.35);
  font-family: var(--font-mono); font-size: 10px; color: var(--bad); letter-spacing: .03em;
}
.quali-cut-row b { font-weight: 500; }
.quali-side { min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.quali-side-card {
  border: 1px solid var(--line);
  background:
    linear-gradient(160deg, rgba(255,255,255,.026), transparent 34%),
    rgba(11, 16, 22, .82);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.quali-session-card { flex: 0 0 auto; }
.quali-feed-card { flex: 1; min-height: 0; }
.quali-side-title {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-mute); letter-spacing: .07em;
}
.quali-circuit { position: relative; height: 130px; padding: 8px 12px; color: var(--accent); border-bottom: 1px solid var(--line); }
.quali-circuit svg { width: 100%; height: 100%; }
.quali-circuit > span { position: absolute; left: 12px; bottom: 8px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .08em; }
.quali-session-facts { display: flex; flex-direction: column; padding: 4px 12px 7px; }
.quali-session-facts > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.quali-session-facts > div:last-child { border-bottom: 0; }
.quali-session-facts span { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); }
.quali-session-facts b { font-size: 11.5px; color: var(--ink-dim); font-weight: 500; text-align: right; }
.quali-player-live { padding: 4px 12px 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 5px; }
.quali-player-row { display: flex; align-items: center; gap: 7px; padding: 5px 0; }
.quali-player-row .avatar { width: 25px; height: 25px; }
.qpl-car { font-family: var(--font-mono); font-size: 10px; color: var(--accent); width: 38px; flex: 0 0 auto; }
.qpl-name { flex: 1; min-width: 0; }
.qpl-name b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 600; }
.qpl-name small { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.quali-live-feed { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 9px; }
.quali-feed-item { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 7px; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.quali-feed-item:last-child { border-bottom: 0; }
.quali-feed-item > span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.quali-feed-item b { font-size: 11.5px; color: var(--ink-mute); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-feed-item em { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
.quali-feed-item em.improved { color: var(--ok); }
.quali-feed-empty { padding: 12px 0; font-size: 12px; color: var(--ink-faint); }

@media (max-width: 1180px) {
  .quali-hud { grid-template-columns: minmax(190px, 1fr) 150px minmax(200px, .8fr) auto; gap: 12px; }
  .quali-body { grid-template-columns: minmax(0, 1fr) 300px; }
  .quali-hud-title span { display: none; }
}
@media (max-width: 940px) {
  .quali-layer { overflow-y: auto; }
  .quali-hud { position: sticky; top: 0; z-index: 20; grid-template-columns: minmax(180px,1fr) 150px; }
  .quali-hud-meta { display: none; }
  .quali-hud-controls { grid-column: 1 / -1; justify-content: flex-start; border-top: 1px solid var(--line); padding-top: 8px; }
  .quali-body { grid-template-columns: 1fr; overflow: visible; }
  .quali-board { min-height: 520px; max-height: 620px; }
  .quali-side { display: grid; grid-template-columns: 1fr 1fr; }
  .quali-feed-card { min-height: 250px; }
}
@media (max-width: 680px) {
  .quali-hud { grid-template-columns: 1fr auto; padding: 11px 12px; gap: 8px 12px; }
  .quali-hud-clock { border-left: 0; padding-left: 0; }
  .quali-hud-controls { justify-content: space-between; }
  .quali-control-btn span { display: none; }
  .quali-control-btn { padding: 0 8px; }
  .quali-body { padding: 8px; }
  .quali-side { grid-template-columns: 1fr; }
  .quali-live-head, .quali-live-row { grid-template-columns: 28px minmax(110px,1.4fr) 74px 34px; padding: 0 9px; }
  .quali-live-head span:nth-child(3), .ql-team { display: none; }
  .quali-live-head span:nth-child(5), .ql-gap { display: none; }
}

/* ---------- real-time race clock ---------- */
.race-hud-lap { display: flex; align-items: center; gap: 0; }
.race-lap-main { display: flex; align-items: baseline; gap: 6px; }
.race-lap-times { display: flex; flex-direction: column; gap: 1px; margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--line); }
.race-lap-times > b { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; color: var(--ink-dim); letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.race-lap-times > small { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); white-space: nowrap; }
.race-hud { grid-template-columns: minmax(220px, 1.2fr) 245px minmax(240px, .9fr) auto; }
.race-dot { transition: transform .16s linear, opacity .4s ease; }
@media (max-width: 1300px) {
  .race-hud { grid-template-columns: minmax(170px, 1fr) 215px minmax(200px, .85fr) auto; }
}
@media (max-width: 1120px) {
  .race-hud { grid-template-columns: minmax(180px,1fr) 215px 1fr; }
}
@media (max-width: 820px) {
  .race-hud { grid-template-columns: 1fr auto; }
  .race-hud-lap { grid-column: 2; }
  .race-lap-times { display: none; }
}

body.race-open #toast-root, body.quali-open #toast-root { top: auto; bottom: 16px; right: 16px; }
body.race-open .toast, body.quali-open .toast { animation-name: toastInUp; }
@keyframes toastInUp { from { opacity: 0; transform: translateY(10px); } }

@media (max-width: 820px) {
  .race-lap-times { display: flex; margin-left: 8px; padding-left: 8px; }
  .race-lap-times > b { font-size: 10px; }
  .race-lap-times > small { display: none; }
}
.race-skip-btn.is-confirm { color: var(--bad); border-color: rgba(255,96,114,.5); background: rgba(255,96,114,.08); }

/* ============================================================
   LIVE TYRE WEAR + PIT WALL
   ============================================================ */
.race-tower-cols { grid-template-columns: 22px minmax(0, 1fr) 72px 56px; }
.tower-row { grid-template-columns: 22px 2px minmax(0, 1fr) 72px 56px; }
.tower-tyre { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.tower-tyre-line { display: flex; align-items: center; gap: 3px; min-width: 0; width: 100%; }
.tower-wear {
  display: block; width: 56px; height: 2px; border-radius: 2px;
  background: rgba(255,255,255,.08); overflow: hidden;
}
.tower-wear b {
  display: block; height: 100%; width: 0; border-radius: 2px;
  background: var(--wear-color, var(--ok)); transition: width .15s linear;
}
.tower-wear-num {
  margin-left: auto; font-family: var(--font-mono); font-size: 8px;
  font-weight: 500; line-height: 1.2; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.race-wear-block {
  margin-top: 8px; padding: 7px 8px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.008));
}
.race-retired-block {
  margin-top: 8px; padding: 8px 9px;
  border: 1px solid rgba(255,96,114,.25);
  background: rgba(255,96,114,.045);
  display: flex; align-items: center; gap: 8px;
}
.race-retired-block span { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .06em; color: var(--bad); }
.race-retired-block b { font-size: 12px; font-weight: 600; color: var(--ink-dim); }
.race-retired-block small { margin-left: auto; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); }
.race-wear-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint);
  letter-spacing: .03em;
}
.race-wear-head em {
  font-style: normal; color: var(--ok); margin-left: 4px; font-size: 7.5px;
  letter-spacing: .06em;
}
.race-wear-head b {
  font-family: var(--font-mono); font-size: 14px; font-weight: 600;
  color: var(--wear-color, var(--ok)); line-height: 1;
  font-variant-numeric: tabular-nums;
}
.race-wear-bar {
  height: 6px; border-radius: 2px; background: rgba(255,255,255,.075);
  margin-top: 5px; overflow: hidden;
}
.race-wear-bar i {
  display: block; height: 100%; border-radius: 2px;
  background: var(--wear-color, var(--ok)); transition: width .2s linear;
  box-shadow: 0 0 8px color-mix(in srgb, var(--wear-color, var(--ok)) 45%, transparent);
}
.race-wear-meta {
  display: flex; justify-content: space-between; align-items: center; gap: 5px;
  flex-wrap: wrap; margin-top: 3px;
  font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint);
  line-height: 1.4;
}
.race-wear-label { color: var(--wear-color, var(--ok)); font-weight: 500; }
.race-pitwall { margin-top: 7px; padding-top: 7px; border-top: 1px dashed var(--line); }
.race-pitwall.is-disabled { opacity: .55; }
.race-pitwall-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint);
  letter-spacing: .04em;
}
.race-pitwall-head em { font-style: normal; color: var(--ink-mute); }
.race-pitwall-head small { font-size: 7.5px; color: var(--ink-faint); }
.race-mode-row {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 3px; margin-top: 5px;
}
.race-mode-btn {
  min-height: 25px; padding: 3px 4px;
  border: 1px solid var(--line); border-radius: 2px;
  background: rgba(255,255,255,.02); color: var(--ink-mute);
  font-family: var(--font-mono); font-size: 8.5px; transition: .16s;
}
.race-mode-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
.race-mode-btn.active {
  color: var(--ink); border-color: rgba(var(--accent-rgb), .5);
  background: rgba(var(--accent-rgb), .10);
}
.race-mode-btn:disabled { opacity: .4; cursor: default; }
.race-pit-row { display: flex; align-items: center; gap: 4px; margin-top: 5px; }
.race-tyre-picks { display: flex; gap: 3px; }
.race-tyre-btn {
  width: 27px; height: 27px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: 50%;
  background: rgba(255,255,255,.018); color: var(--tyre);
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
}
.race-tyre-btn:hover:not(:disabled) { border-color: var(--tyre); }
.race-tyre-btn.active {
  border-color: var(--tyre);
  background: color-mix(in srgb, var(--tyre) 15%, transparent);
  box-shadow: inset 0 0 0 1px #06090d, 0 0 8px color-mix(in srgb, var(--tyre) 22%, transparent);
}
.race-tyre-btn:disabled { opacity: .4; cursor: default; }
.race-pit-now {
  flex: 1; min-height: 27px; min-width: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  border: 1px solid rgba(var(--accent-rgb), .42); border-radius: 2px;
  background: rgba(var(--accent-rgb), .10); color: var(--ink);
  font-size: 9px; font-weight: 600; transition: .16s;
}
.race-pit-now .icon { width: 12px; height: 12px; color: var(--accent); flex: 0 0 auto; }
.race-pit-now:hover:not(:disabled) { background: rgba(var(--accent-rgb), .18); border-color: rgba(var(--accent-rgb), .7); }
.race-pit-now:disabled { opacity: .4; cursor: default; }
.race-pitline {
  display: flex; align-items: center; justify-content: space-between;
  gap: 6px; flex-wrap: wrap;
  margin-top: 5px; font-family: var(--font-mono); font-size: 8px;
  color: var(--ink-faint); line-height: 1.45;
}
.race-pit-cancel {
  border: 0; background: none; padding: 0 2px;
  color: var(--bad); font-family: var(--font-mono); font-size: 8px;
  text-decoration: underline; text-underline-offset: 2px;
}
.race-pit-cancel:hover { color: #ff9aa4; }
@media (max-width: 360px) {
  .race-tyre-btn { width: 24px; height: 24px; }
  .race-pit-now { font-size: 8.5px; }
}

/* ---------- live race engineer advice ---------- */
.race-engineer-live {
  display: grid; grid-template-columns: 25px minmax(0, 1fr) auto;
  gap: 7px; align-items: flex-start;
  margin-top: 7px; padding: 7px;
  border: 1px dashed var(--line-strong);
  background: linear-gradient(135deg, rgba(99,184,255,.055), transparent 68%), rgba(255,255,255,.012);
}
.race-engineer-icon {
  width: 25px; height: 25px; flex: 0 0 auto;
  border: 1px solid rgba(99,184,255,.28); color: var(--info);
  display: grid; place-items: center;
}
.race-engineer-icon .icon { width: 13px; height: 13px; }
.race-engineer-copy { min-width: 0; }
.race-engineer-copy b {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 8px; font-weight: 600;
  color: var(--ink-mute); letter-spacing: .03em;
}
.race-engineer-copy b em { font-style: normal; font-size: 7px; color: var(--info); letter-spacing: .06em; }
.race-engineer-copy p { font-size: 8.5px; line-height: 1.5; color: var(--ink-mute); margin-top: 2px; }
.race-engineer-tag {
  align-self: flex-start; padding: 2px 5px;
  border: 1px solid var(--line-strong); border-radius: 2px;
  font-family: var(--font-mono); font-size: 7px; color: var(--ink-faint);
  letter-spacing: .02em; white-space: nowrap;
}
.race-engineer-live[data-tone="ok"] { border-color: rgba(66,224,165,.22); background: rgba(66,224,165,.025); }
.race-engineer-live[data-tone="ok"] .race-engineer-tag { color: var(--ok); border-color: rgba(66,224,165,.3); }
.race-engineer-live[data-tone="info"] { border-color: rgba(99,184,255,.25); }
.race-engineer-live[data-tone="info"] .race-engineer-tag { color: var(--info); border-color: rgba(99,184,255,.3); }
.race-engineer-live[data-tone="warn"] { border-color: rgba(255,202,88,.3); background: rgba(255,202,88,.035); }
.race-engineer-live[data-tone="warn"] .race-engineer-tag { color: var(--warn); border-color: rgba(255,202,88,.35); }
.race-engineer-live[data-tone="danger"] { border-color: rgba(255,96,114,.38); background: rgba(255,96,114,.05); }
.race-engineer-live[data-tone="danger"] .race-engineer-tag { color: var(--bad); border-color: rgba(255,96,114,.4); }
.race-engineer-live[data-tone="muted"] { opacity: .6; }

/* ---- end.css ---- */
/* ============================================================
   SEASON END — final report
   ============================================================ */
.end-screen {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(1100px 720px at 78% -8%, rgba(var(--accent-rgb), .16), transparent 60%),
    linear-gradient(180deg, #070a0e, #080b10 70%);
}
.end-atmosphere { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.end-atmosphere::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 58px 58px;
  mask-image: radial-gradient(ellipse at 50% 12%, #000 0%, transparent 72%);
}
.end-speedlines {
  position: absolute; inset: -15% -10% auto auto; width: 70%; height: 100%;
  background: repeating-linear-gradient(116deg, transparent 0 96px, rgba(255,255,255,.04) 97px 98px, transparent 99px 214px);
  mask-image: linear-gradient(90deg, transparent, #000 50%, transparent);
  opacity: .6;
}
.end-circuit {
  position: absolute; right: -8%; top: 6%; width: 62%; max-width: 920px; color: var(--accent); opacity: .7;
}
.end-circuit svg { width: 100%; height: auto; }
.end-shell { position: relative; z-index: 1; width: min(1480px, 100%); margin: 0 auto; padding: 20px clamp(18px, 4vw, 56px) 30px; }
.end-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.end-top-meta { display: flex; align-items: center; gap: 18px; }
.end-top .back-link { color: var(--ink-mute); }

.end-hero {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, .75fr);
  gap: clamp(30px, 4vw, 70px);
  align-items: center;
  padding: clamp(32px, 6vh, 72px) 0 clamp(28px, 4.5vh, 54px);
}
.end-hero-copy h1 {
  font-size: clamp(38px, 5.6vw, 76px);
  font-weight: 850; letter-spacing: -.06em; line-height: 1.02;
  margin-top: 12px;
  max-width: 900px;
  background: linear-gradient(96deg, #fff 10%, #dfe6ef 62%, rgba(255,255,255,.48));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.end-screen.is-champion .end-hero-copy h1 {
  background: linear-gradient(96deg, #fff 4%, color-mix(in srgb, var(--accent) 65%, white) 55%, var(--accent));
  -webkit-background-clip: text; background-clip: text;
}
.end-hero-copy > p { max-width: 660px; margin-top: 18px; color: var(--ink-mute); font-size: 15px; line-height: 1.85; }
.end-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 22px; }
.end-tags span { border: 1px solid var(--line); background: rgba(255,255,255,.02); padding: 6px 9px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .03em; }
.end-tags b { color: var(--ink-dim); font-weight: 500; margin-left: 4px; }
.end-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }

.end-hero-side { display: flex; flex-direction: column; gap: 10px; }
.end-position {
  border: 1px solid var(--line); padding: 15px 18px;
  background:
    linear-gradient(120deg, rgba(var(--accent-rgb), .12), transparent 65%),
    rgba(255,255,255,.018);
  position: relative; overflow: hidden;
}
.end-position::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.end-position > span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .12em; }
.end-position > b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 64px; line-height: .9; letter-spacing: -.06em; margin-top: 4px; }

.end-position > em { position: absolute; right: 16px; top: 16px; font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--ok); border: 1px solid rgba(66,224,165,.25); padding: 3px 5px; }
.end-screen.is-fail .end-position > em { color: var(--bad); border-color: rgba(255,96,114,.25); }
.champion-card {
  border: 1px solid var(--line); background: rgba(255,255,255,.018); padding: 14px 16px;
  display: grid; grid-template-columns: 30px 1fr 1px 1fr; gap: 12px; align-items: center;
  position: relative; overflow: hidden;
}
.champion-card::after {
  content: ""; position: absolute; right: -20px; bottom: -25px; width: 120px; height: 120px;
  background: repeating-conic-gradient(rgba(255,255,255,.035) 0 25%, transparent 0 50%);
  background-size: 16px 16px; transform: rotate(18deg); mask-image: radial-gradient(circle, #000, transparent 70%);
}
.champ-mark { width: 28px; height: 28px; color: var(--accent); display: grid; place-items: center; border: 1px solid rgba(var(--accent-rgb), .25); }
.champ-mark .icon { width: 14px; height: 14px; }
.champ-copy span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .07em; }
.champ-copy b { display: block; font-size: 14px; font-weight: 650; margin-top: 2px; }
.champ-copy small { display: block; font-size: 9.5px; color: var(--ink-faint); margin-top: 1px; }

.end-grid { display: grid; grid-template-columns: 1.12fr .88fr; gap: 12px; align-items: stretch; }
.end-board-panel, .end-finance-panel, .end-car-panel, .end-final-teams { min-width: 0; }
.end-car-panel { display: flex; flex-direction: column; }
.end-car-panel .end-car-body { flex: 1; }
.end-board-body { display: flex; gap: 18px; align-items: center; padding: 14px 16px 10px; }
.end-board-score { flex: 0 0 auto; text-align: center; border-right: 1px solid var(--line); padding-right: 18px; min-width: 108px; }
.end-board-score b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 47px; line-height: .9; letter-spacing: -.05em; }
.end-board-score span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.end-board-score small { display: block; font-size: 9px; color: var(--ink-faint); margin-top: 5px; white-space: nowrap; }
.end-board-score.conf-ok b { color: var(--ok); }
.end-board-score.conf-warn b { color: var(--warn); }
.end-board-score.conf-bad b { color: var(--bad); }
.end-board-copy { min-width: 0; }
.end-objective { display: flex; align-items: baseline; gap: 9px; padding: 2px 0; }
.end-objective span { flex: 0 0 58px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.end-objective b { font-size: 11.5px; color: var(--ink-dim); font-weight: 500; }
.end-board-copy p { font-size: 11px; color: var(--ink-faint); line-height: 1.6; margin-top: 6px; }
.end-progress { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); }
.end-progress span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; }
.end-progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,.07); }
.end-progress-bar i { display: block; height: 100%; background: var(--accent); }
.end-progress b { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); font-weight: 500; }

.end-finance-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 8px 16px; gap: 0; }
.end-finance-grid > div { padding: 7px 0; border-bottom: 1px solid var(--line); }
.end-finance-grid > div:nth-last-child(-n+2) { border-bottom: 0; }
.end-finance-grid span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.end-finance-grid b { display: block; font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); font-weight: 500; margin-top: 1px; }
.end-sponsor-outcome { border-top: 1px solid var(--line); padding: 9px 16px 11px; }
.end-sponsor-outcome p { font-size: 11px; color: var(--ink-mute); line-height: 1.6; margin-top: 3px; }

.end-car-body { display: flex; align-items: center; gap: 18px; padding: 14px 16px 10px; }
.end-car-score { flex: 0 0 92px; border-right: 1px solid var(--line); padding-right: 15px; }
.end-car-score b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 43px; line-height: .9; letter-spacing: -.05em; }
.end-car-score span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .03em; margin-top: 4px; }
.end-car-stats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 14px; }
.end-car-stats > div { display: grid; grid-template-columns: 1fr auto; gap: 3px; }
.end-car-stats span { font-size: 9.5px; color: var(--ink-faint); }
.end-car-stats b { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); font-weight: 500; }
.end-car-stats i { grid-column: 1 / -1; height: 2px; background: rgba(255,255,255,.07); display: block; }
.end-car-stats i em { display: block; height: 100%; background: var(--accent); opacity: .75; }
.end-car-foot { border-top: 1px solid var(--line); padding: 8px 16px; font-size: 10px; color: var(--ink-faint); line-height: 1.55; }

.end-table td { padding: 7px 10px; }
.end-driver-table { margin-top: 12px; }
.end-table th { font-size: 8.5px; }
.end-table .standing-pts { font-size: 17.5px !important; }

.end-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .08em; color: var(--ink-faint); text-transform: uppercase;
}

@media (max-width: 1180px) {
  .end-hero { grid-template-columns: 1fr; gap: 24px; padding-top: 36px; }
  .end-hero-side { display: grid; grid-template-columns: 1fr 1fr; align-items: stretch; }
  .end-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .end-shell { padding: 16px 16px 24px; }
  .end-top-meta .badge { display: none; }
  .end-hero-copy h1 { font-size: clamp(34px, 6.2vw, 54px); }
  .end-top-meta .back-link { font-size: 10px; }
  .end-hero-side { grid-template-columns: 1fr; }
  .end-grid { grid-template-columns: 1fr; }
  .end-board-score { min-width: 86px; padding-right: 12px; }
  .end-finance-grid { grid-template-columns: 1fr 1fr; }
  .end-foot { flex-direction: column; align-items: flex-start; gap: 5px; }
}
@media (max-width: 560px) {
  .end-top .back-link { display: none; }
  .end-hero { padding: 26px 0; }
  .end-actions { flex-direction: column; align-items: stretch; }
  .end-actions .btn { width: 100%; }
  .end-tags span { font-size: 9px; }
  .champion-card { grid-template-columns: 26px 1fr 1fr; gap: 10px; }
  .champ-divider { display: none; }
  .champ-mark { display: none; }
  .champ-copy span { font-size: 8px; }
  .champ-copy b { font-size: 12px; }
  .end-board-body { flex-direction: column; align-items: flex-start; gap: 10px; }
  .end-board-score { border-right: 0; padding-right: 0; text-align: left; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .end-board-score small { margin-top: 0; }
  .end-progress { flex-wrap: wrap; }
  .end-finance-grid { grid-template-columns: 1fr; }
  .end-finance-grid > div { border-bottom: 1px solid var(--line) !important; }
  .end-finance-grid > div:last-child { border-bottom: 0 !important; }
  .end-car-body { flex-direction: column; align-items: flex-start; }
  .end-car-score { border-right: 0; padding-right: 0; }
  .end-actions .btn + .btn { margin-top: 0; }
}
.end-contracts { border-top: 1px solid var(--line); padding: 9px 16px 11px; }
.end-contract-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-top: 4px; }
.end-contract-row span { font-size: 11px; color: var(--ink-mute); }
.end-contract-row b { font-family: var(--font-mono); font-size: 9.5px; font-weight: 500; color: var(--ink-faint); text-align: right; }
.end-screen { overflow-x: clip; }

/* ---- offseason.css ---- */
/* ============================================================
   OFF-SEASON — contract summit and season transition
   ============================================================ */
.offseason-screen {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(1200px 700px at 82% -10%, rgba(var(--accent-rgb), .14), transparent 60%),
    linear-gradient(180deg, #070a0e, #080b10 68%);
}
.off-bg { position: absolute; inset: 0; pointer-events: none; }
.off-bg::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 62px 62px;
  mask-image: radial-gradient(ellipse at 50% 12%, #000, transparent 74%);
}
.off-speedline {
  position: absolute; right: -15%; top: 4%; width: 80%; height: 90%;
  background: repeating-linear-gradient(112deg, transparent 0 104px, rgba(255,255,255,.035) 105px 106px, transparent 107px 230px);
  mask-image: linear-gradient(90deg, transparent, #000 52%, transparent);
  opacity: .55;
}
.off-year {
  position: absolute; right: 1%; top: -2%;
  font-family: var(--font-display); font-style: italic; font-weight: 900;
  font-size: clamp(220px, 34vw, 500px); line-height: .8; letter-spacing: -.08em;
  color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.045);
  user-select: none;
}
.off-shell { width: min(1500px, 100%); margin: 0 auto; padding: 18px clamp(18px, 3.8vw, 54px) 0; position: relative; z-index: 2; }

.off-hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr); gap: clamp(28px, 4vw, 60px); align-items: center; padding: clamp(30px, 5.5vh, 62px) 0 clamp(24px, 4vh, 44px); }
.off-hero-copy h1 { font-size: clamp(38px, 5.3vw, 72px); font-weight: 850; letter-spacing: -.055em; line-height: 1.03; margin-top: 11px; }
.off-hero-copy h1 em { font-style: normal; color: var(--accent); text-shadow: 0 0 50px rgba(var(--accent-rgb), .2); }
.off-hero-copy > p { max-width: 650px; margin-top: 16px; color: var(--ink-mute); font-size: 14px; line-height: 1.8; }
.off-hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.off-hero-tags span { border: 1px solid var(--line); background: rgba(255,255,255,.02); padding: 6px 9px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
.off-hero-tags b { color: var(--ink-dim); font-weight: 500; margin-left: 4px; }
.off-last-card {
  border: 1px solid var(--line); padding: 17px 19px; background:
    radial-gradient(100% 120% at 100% 0%, rgba(var(--accent-rgb), .1), transparent 60%),
    rgba(255,255,255,.02);
  position: relative;
}
.off-last-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.off-last-pos { display: flex; align-items: baseline; gap: 7px; margin-top: 9px; }
.off-last-pos span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.off-last-pos b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 43px; letter-spacing: -.05em; line-height: .9; }
.off-last-pos i { font-family: var(--font-mono); font-style: normal; font-size: 11px; color: var(--ink-mute); }
.off-last-rows { display: flex; gap: 0; margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.off-last-rows > div { flex: 1; padding: 8px 0; border-left: 1px solid var(--line); padding-left: 10px; }
.off-last-rows > div:first-child { border-left: 0; padding-left: 0; }
.off-last-rows span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.off-last-rows b { display: block; font-family: var(--font-mono); font-size: 13px; color: var(--ink-dim); font-weight: 500; margin-top: 1px; }
.off-champion { padding-top: 10px; display: flex; flex-direction: column; }

.off-champion b { font-size: 15px; margin-top: 2px; }
.off-champion small { font-size: 10px; color: var(--ink-faint); margin-top: 1px; }

.offseason-grid { display: grid; grid-template-columns: minmax(0, 1.26fr) minmax(330px, .74fr); gap: 12px; align-items: start; }
.off-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.offseat-morale.morale-bad > i em { background: var(--bad); }
.offseat-morale b { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-mute); font-weight: 500; text-align: right; margin-top: 2px; }
.offseat-foot { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; padding: 7px 10px; border-top: 1px solid var(--line); }

.offseat-foot > span b { color: var(--ink-mute); font-weight: 500; }
.offseat-foot .btn { margin-left: auto; }
.offseat-link { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); text-decoration: underline; text-underline-offset: 3px; }

.off-contract-note { display: flex; align-items: center; gap: 5px; border-top: 1px solid var(--line); padding: 8px 13px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }

.off-market-panel .panel-head { background: rgba(255,255,255,.015); }

.off-market-list { max-height: 500px; }
.off-market-panel .note-line { margin-top: 0; }

.off-car-rating span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 3px; }
.off-car-facts { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.off-car-facts > div { display: flex; justify-content: space-between; gap: 8px; }
.off-car-facts span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }

.off-car-note { display: flex; align-items: flex-start; gap: 5px; border-top: 1px solid var(--line); padding: 8px 14px 10px; font-size: 10px; color: var(--ink-faint); line-height: 1.55; }

.offsponsor-options { padding: 10px; display: flex; flex-direction: column; gap: 6px; }

  border: 1px solid var(--line); padding: 9px 10px;
  background: linear-gradient(110deg, rgba(var(--sponsor-rgb), .06), transparent 70%);
}
.offsponsor-name { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-weight: 800; letter-spacing: -.01em; font-size: 15px; color: var(--sponsor); }

.off-commit-copy { flex: 1; min-width: 0; }
.off-commit-title { font-size: 14px; font-weight: 650; }
.off-commit-checks { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
.off-commit-checks span { display: flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.off-commit-checks span.ok { color: var(--ok); }
.off-commit-checks span.bad { color: var(--bad); }
.off-commit-checks .icon { width: 9px; height: 9px; }
.off-commit-budget { text-align: right; }
.off-commit-budget span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.off-commit-budget b { display: block; font-family: var(--font-mono); font-size: 14px; color: var(--ink-dim); font-weight: 500; }
.off-commit > .btn { flex: 0 0 auto; }

@media (max-width: 1180px) {
  .offseason-grid { grid-template-columns: 1fr; }
  .off-side { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .off-sponsor-panel { grid-row: span 2; }
  .off-hero { grid-template-columns: 1fr; gap: 22px; padding-top: 32px; }
  .off-last-card { max-width: 560px; }
}
@media (max-width: 800px) {
  .offseason-screen { overflow: visible; }
  .off-shell { padding: 14px 14px 0; }
  .off-top { flex-wrap: wrap; gap: 12px; }
  .off-top-meta { justify-content: flex-start; }
  .off-hero-copy h1 { font-size: clamp(32px, 9vw, 50px); }
  .off-hero-copy > p { font-size: 13px; }
  .off-side { display: flex; }
  .off-commit { flex-wrap: wrap; position: sticky; }
  .off-commit-budget { margin-left: auto; }
  .off-commit > .btn { width: 100%; }
  .offseat-foot { gap: 9px; }
  .offseat-foot .btn { margin-left: 0; }
  .offseat-morale { width: 100px; }
}
@media (max-width: 520px) {
  .off-bg .off-year { font-size: 280px; }
  .off-top-meta .badge.team { display: none; }
  .off-top .back-link { font-size: 9px; }
  .off-hero-tags span { font-size: 8.5px; }
  .offseat-body { flex-wrap: wrap; }
  .offseat-morale { width: 100%; flex-basis: 100%; }
  .off-contract-panel .panel-head { flex-wrap: wrap; gap: 5px; }
  .off-market-head { flex-direction: column; gap: 5px; }
  .off-market-head .market-filter { display: flex; gap: 8px; align-items: baseline; text-align: left; }
  .off-market-head .market-filter b { margin-top: 0; }
  .off-commit-title { font-size: 13px; }
  .off-commit-checks { gap: 7px; }
}

.offseat-id > span.form-badge { display: inline-flex; width: fit-content; font-family: var(--font-mono); }
.offseason-screen { overflow-x: clip; }
</style>
</head>

/* ------------------------------------------------------------
   Classic circuit silhouettes: deterministic stylised outlines.
   Historical layouts are illustrative, not surveyed geometry.
   ------------------------------------------------------------ */
const CLASSIC_ART_CACHE = {};

function classicHash(text) {
  let hash = 2166136261;
  for (let i = 0; i < text.length; i += 1) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function classicCircuitArt(track) {
  const id = track?.id || 'classic';
  if (CLASSIC_ART_CACHE[id]) return CLASSIC_ART_CACHE[id];
  let seed = classicHash(id);
  const random = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const count = 12 + (classicHash(id) % 3) * 2;
  const points = [];
  for (let i = 0; i < count; i += 1) {
    const angle = (i / count) * Math.PI * 2 - Math.PI / 2 + (random() - 0.5) * 0.2;
    const radius = i % 4 === 0
      ? 118 + random() * 46
      : i % 4 === 2
        ? 52 + random() * 28
        : 78 + random() * 50;
    points.push({
      x: 300 + Math.cos(angle) * radius * 1.36 + (random() - 0.5) * 16,
      y: 160 + Math.sin(angle) * radius * 0.88 + (random() - 0.5) * 12
    });
  }
  const clampPoint = (point) => ({
    x: Math.max(34, Math.min(566, point.x)),
    y: Math.max(28, Math.min(292, point.y))
  });
  const safe = points.map(clampPoint);
  let path = `M ${safe[0].x.toFixed(1)} ${safe[0].y.toFixed(1)}`;
  for (let i = 0; i < safe.length; i += 1) {
    const p0 = safe[(i - 1 + safe.length) % safe.length];
    const p1 = safe[i];
    const p2 = safe[(i + 1) % safe.length];
    const p3 = safe[(i + 2) % safe.length];
    const c1 = { x: p1.x + (p2.x - p0.x) / 9, y: p1.y + (p2.y - p0.y) / 9 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 9, y: p2.y - (p3.y - p1.y) / 9 };
    path += ` C ${c1.x.toFixed(1)} ${c1.y.toFixed(1)}, ${c2.x.toFixed(1)} ${c2.y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  path += ' Z';
  CLASSIC_ART_CACHE[id] = { path, start: [safe[0].x, safe[0].y] };
  return CLASSIC_ART_CACHE[id];
}

/* ---------- tiny DOM helpers ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
const round1 = (n) => Math.round(n * 10) / 10;
const round2 = (n) => Math.round(n * 100) / 100;

function escapeHTML(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function hexToRgb(hex) {
  const clean = hex.replace('#', '');
  const full = clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean;
  const n = parseInt(full, 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

/* ---------- format ---------- */
function money(n, digits = 1, signed = false) {
  const value = Math.abs(Number(n) || 0).toFixed(digits);
  const sign = n < 0 ? '−' : signed && n > 0 ? '+' : '';
  return `${sign}$${value}M`;
}

function pct(n) { return `${Math.round(n * 100)}%`; }

function formatLap(seconds) {
  if (!Number.isFinite(seconds)) return '—';
  const min = Math.floor(seconds / 60);
  const sec = (seconds - min * 60).toFixed(3).padStart(6, '0');
  return `${min}:${sec}`;
}

function formatGap(seconds) {
  if (!Number.isFinite(seconds) || seconds <= 0.01) return 'LEADER';
  return `+${seconds.toFixed(1)}`;
}

function positionLabel(pos) {
  return pos ? `P${pos}` : 'DNF';
}

function chance(prob) { return Math.random() < prob; }

function randn() {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* ---------- driver form / dynamic ability ---------- */
const FORM_LIMIT = 5;
const FORM_HISTORY_LIMIT = 8;
const FORM_TONE = { hot: '火热', good: '上扬', steady: '平稳', cold: '低迷', bad: '挣扎' };

function emptyFormRecord() {
  return { value: 0, trend: 0, history: [] };
}

function normalizeDriverForm(raw) {
  const form = (raw && typeof raw === 'object') ? raw : {};
  DRIVERS.forEach((driver) => {
    const record = form[driver.id];
    if (!record || typeof record !== 'object' || !Number.isFinite(Number(record.value))) {
      form[driver.id] = emptyFormRecord();
      return;
    }
    form[driver.id] = {
      value: clamp(Number(record.value), -FORM_LIMIT, FORM_LIMIT),
      trend: clamp(Number(record.trend) || 0, -3, 3),
      history: Array.isArray(record.history)
        ? record.history.map(Number).filter(Number.isFinite).slice(-FORM_HISTORY_LIMIT)
        : []
    };
  });
  return form;
}

function ensureDriverFormState() {
  state.driverForm = normalizeDriverForm(state.driverForm);
}

function formRecordFor(driverId) {
  if (!state.driverForm) state.driverForm = {};
  if (!state.driverForm[driverId]) state.driverForm[driverId] = emptyFormRecord();
  return state.driverForm[driverId];
}

function weekendConditionFor(driverId) {
  const value = state.weekend?.form?.[driverId];
  return Number.isFinite(Number(value)) ? clamp(Number(value), -2.5, 2.5) : 0;
}

function driverFormValue(driverId) {
  const record = state.driverForm?.[driverId];
  const base = Number(record?.value) || 0;
  return clamp(base + weekendConditionFor(driverId), -FORM_LIMIT - 1, FORM_LIMIT + 1);
}

function formTone(value) {
  if (value >= 2.4) return 'hot';
  if (value >= 0.9) return 'good';
  if (value > -0.9) return 'steady';
  if (value > -2.4) return 'cold';
  return 'bad';
}

function formLabel(value) {
  return FORM_TONE[formTone(value)] || '平稳';
}

function formDeltaText(delta) {
  if (!Number.isFinite(delta) || Math.abs(delta) < 0.05) return '±0';
  return `${delta > 0 ? '+' : ''}${delta.toFixed(1)}`;
}

function formTrendIcon(value) {
  if (value >= 0.9) return '▲';
  if (value <= -0.9) return '▼';
  return '·';
}

function formBadgeHTML(value, options = {}) {
  const tone = formTone(value);
  const label = formLabel(value);
  const showValue = options.showValue !== false;
  const compact = options.compact;
  return `<span class="form-badge form-${tone} ${compact ? 'is-compact' : ''}" title="车手状态：${label}（${formDeltaText(value)}）">
    <i>${formTrendIcon(value)}</i><b>${label}</b>${showValue ? `<em>${formDeltaText(value)}</em>` : ''}
  </span>`;
}

/* ---------- driver development ---------- */
const SIM_LEVEL_MAX = 4;
const SIM_SESSION_COST = 0.06;
const SIM_SESSION_XP = 7;
const SIM_UPGRADE_COSTS = { 2: 2.8, 3: 4.8, 4: 7.0 };
const DEV_STAT_KEYS = ['pace', 'consistency', 'tyre', 'wet', 'feedback'];
const DEV_GAIN_PAIRS = {
  young: [
    ['pace', 'feedback'],
    ['tyre', 'consistency'],
    ['pace', 'tyre'],
    ['consistency', 'feedback'],
    ['wet', 'pace'],
    ['tyre', 'feedback']
  ],
  veteran: [
    ['feedback', 'tyre'],
    ['consistency', 'feedback'],
    ['tyre', 'consistency'],
    ['feedback', 'pace'],
    ['wet', 'feedback'],
    ['tyre', 'pace']
  ]
};
const DEV_AGE_BANDS = [
  { max: 20, rate: 1.45, threshold: 100, label: '新星加速' },
  { max: 23, rate: 1.28, threshold: 112, label: '青年上升期' },
  { max: 26, rate: 1.12, threshold: 126, label: '快速成长期' },
  { max: 29, rate: 0.95, threshold: 142, label: '黄金期' },
  { max: 32, rate: 0.80, threshold: 165, label: '成熟期' },
  { max: 35, rate: 0.65, threshold: 195, label: '经验期' },
  { max: 99, rate: 0.50, threshold: 230, label: '老将期' }
];

function driverAge(driver) {
  if (!driver) return 0;
  const override = Number(state.driverAges?.[driver.id]);
  return Number.isFinite(override) ? override : (Number(driver.age) || 25);
}

function emptyDriverProgress() {
  return {
    xp: 0,
    totalXp: 0,
    points: 0,
    sessions: 0,
    bonus: { pace: 0, consistency: 0, tyre: 0, wet: 0, feedback: 0 },
    lastGains: [],
    history: []
  };
}

function normalizeDriverProgressRecord(raw) {
  const base = emptyDriverProgress();
  const source = raw && typeof raw === 'object' ? raw : {};
  DEV_STAT_KEYS.forEach((key) => {
    base.bonus[key] = clamp(Math.round(Number(source.bonus?.[key]) || 0), 0, MAX_STAT);
  });
  base.xp = clamp(Number(source.xp) || 0, 0, 99999);
  base.totalXp = clamp(Number(source.totalXp) || 0, 0, 999999);
  base.points = clamp(Math.round(Number(source.points) || 0), 0, 9999);
  base.sessions = clamp(Math.round(Number(source.sessions) || 0), 0, 99999);
  base.lastGains = Array.isArray(source.lastGains) ? source.lastGains.filter((key) => DEV_STAT_KEYS.includes(key)).slice(-5) : [];
  base.history = Array.isArray(source.history) ? source.history.slice(-10) : [];
  return base;
}

function normalizeDriverProgress(raw) {
  const map = {};
  DRIVERS.forEach((driver) => {
    map[driver.id] = normalizeDriverProgressRecord(raw?.[driver.id]);
  });
  return map;
}

function normalizeDriverAges(raw) {
  const map = {};
  if (!raw || typeof raw !== 'object') return map;
  DRIVERS.forEach((driver) => {
    const value = Number(raw[driver.id]);
    if (Number.isFinite(value)) map[driver.id] = clamp(Math.round(value), 16, 65);
  });
  return map;
}

function normalizeSimulatorState(raw) {
  const level = clamp(Math.round(Number(raw?.level) || 1), 1, SIM_LEVEL_MAX);
  const capacity = 1 + level;
  return {
    level,
    used: clamp(Math.round(Number(raw?.used) || 0), 0, capacity),
    weekRound: Number.isFinite(Number(raw?.weekRound)) ? Number(raw.weekRound) : -1
  };
}

function driverProgressFor(driverId) {
  if (!state.driverProgress || typeof state.driverProgress !== 'object') state.driverProgress = {};
  let record = state.driverProgress[driverId];
  if (!record || typeof record !== 'object') {
    record = emptyDriverProgress();
    state.driverProgress[driverId] = record;
  }
  if (!record.bonus || typeof record.bonus !== 'object') record.bonus = {};
  DEV_STAT_KEYS.forEach((key) => {
    record.bonus[key] = clamp(Math.round(Number(record.bonus[key]) || 0), 0, MAX_STAT);
  });
  record.xp = clamp(Number(record.xp) || 0, 0, 99999);
  record.totalXp = clamp(Number(record.totalXp) || 0, 0, 999999);
  record.points = clamp(Math.round(Number(record.points) || 0), 0, 9999);
  record.sessions = clamp(Math.round(Number(record.sessions) || 0), 0, 99999);
  if (!Array.isArray(record.lastGains)) record.lastGains = [];
  if (!Array.isArray(record.history)) record.history = [];
  state.driverProgress[driverId] = record;
  return record;
}

function driverDevelopmentProfile(driver) {
  const age = driverAge(driver);
  const band = DEV_AGE_BANDS.find((candidate) => age <= candidate.max) || DEV_AGE_BANDS[DEV_AGE_BANDS.length - 1];
  return { ...band, age };
}

function driverOvrFormula(stats) {
  if (!stats) return 0;
  return (Number(stats.pace) || 0) * 0.50
    + (Number(stats.consistency) || 0) * 0.15
    + (Number(stats.tyre) || 0) * 0.15
    + (Number(stats.wet) || 0) * 0.10
    + (Number(stats.feedback) || 0) * 0.10;
}

function driverPermanentStats(driver) {
  if (!driver) return null;
  const record = driverProgressFor(driver.id);
  const stats = {};
  DEV_STAT_KEYS.forEach((key) => {
    stats[key] = clamp((Number(driver[key]) || 1) + (record.bonus[key] || 0), 1, MAX_STAT);
  });
  const baseScore = driverOvrFormula(driver);
  const grownScore = driverOvrFormula(stats);
  const ovr = clamp(Math.round((Number(driver.ovr) || grownScore) + (grownScore - baseScore)), 1, MAX_STAT);
  return {
    ...driver,
    ...stats,
    age: driverAge(driver),
    ovr,
    baseOvr: ovr,
    devPoints: record.points,
    devXp: record.xp,
    devBonus: { ...record.bonus }
  };
}

function applyDevelopmentPoint(record, driver) {
  const age = driverAge(driver);
  const table = age <= 26 ? DEV_GAIN_PAIRS.young : DEV_GAIN_PAIRS.veteran;
  const pair = table[record.points % table.length];
  const gains = [];
  [...pair, ...DEV_STAT_KEYS].forEach((key) => {
    if (gains.length >= 2 || gains.includes(key)) return;
    if ((Number(driver[key]) || 0) + (record.bonus[key] || 0) < MAX_STAT) {
      record.bonus[key] = (record.bonus[key] || 0) + 1;
      gains.push(key);
    }
  });
  record.points += 1;
  return gains;
}

function grantDriverXp(driverId, amount, source = 'race') {
  const driver = DRIVER_MAP[driverId];
  const xp = round1(Math.max(0, Number(amount) || 0));
  if (!driver || xp <= 0) return null;
  const profile = driverDevelopmentProfile(driver);
  const record = driverProgressFor(driverId);
  const ovrBefore = driverPermanentStats(driver).ovr;
  record.xp = round1(record.xp + xp);
  record.totalXp = round1(record.totalXp + xp);
  if (source === 'simulator') record.sessions += 1;
  const points = [];
  let guard = 0;
  while (record.xp >= profile.threshold && guard < 20) {
    record.xp = round1(record.xp - profile.threshold);
    points.push(applyDevelopmentPoint(record, driver));
    guard += 1;
  }
  const gains = Array.from(new Set(points.flat()));
  if (gains.length) record.lastGains = gains;
  record.history = [...record.history, { source, xp, points: points.length, gains, at: Date.now() }].slice(-10);
  const after = driverPermanentStats(driver);
  return {
    driverId,
    name: driver.cn,
    xp,
    points: points.length,
    gains,
    threshold: profile.threshold,
    progressXp: record.xp,
    ovrBefore,
    ovrAfter: after.ovr,
    profile
  };
}

function awardRaceDevelopment(ordered, options = {}) {
  const teamEntries = new Map();
  ordered.forEach((entry) => {
    if (!teamEntries.has(entry.teamId)) teamEntries.set(entry.teamId, []);
    teamEntries.get(entry.teamId).push(entry);
  });
  const changes = [];
  ordered.forEach((entry) => {
    const driver = entry.driver || DRIVER_MAP[entry.driverId];
    if (!driver) return;
    let baseXp = 1;
    if (!entry.retired) {
      const position = entry.position || 22;
      baseXp = position === 1 ? 10 : position <= 3 ? 8 : position <= 6 ? 6 : position <= 10 ? 4 : position <= 15 ? 2.5 : 1.5;
      if (entry.grid === 1) baseXp += 1.5;
      else if (entry.grid <= 3) baseXp += 1;
      baseXp += Math.min(2, (entry.overtakes || 0) * 0.4);
      const teammates = (teamEntries.get(entry.teamId) || []).filter((candidate) => candidate !== entry);
      if (teammates.some((mate) => mate.position && entry.position < mate.position)) baseXp += 1;
    }
    if (options.wet) baseXp += 0.5;
    const profile = driverDevelopmentProfile(driver);
    const result = grantDriverXp(entry.driverId, round1(Math.min(18, baseXp) * profile.rate), 'race');
    if (result) changes.push({ ...result, teamId: entry.teamId, isPlayer: state.roster.includes(entry.driverId) });
  });
  return changes;
}

function simulatorCapacityForLevel(level = state.simulator?.level) {
  return 1 + clamp(Math.round(Number(level) || 1), 1, SIM_LEVEL_MAX);
}

function ensureSimulatorWeek() {
  if (!state.simulator || typeof state.simulator !== 'object') {
    state.simulator = { level: 1, used: 0, weekRound: state.raceIndex };
  }
  state.simulator.level = clamp(Math.round(Number(state.simulator.level) || 1), 1, SIM_LEVEL_MAX);
  if (state.simulator.weekRound !== state.raceIndex) {
    state.simulator.used = 0;
    state.simulator.weekRound = state.raceIndex;
  }
  const capacity = simulatorCapacityForLevel(state.simulator.level);
  state.simulator.used = clamp(Math.round(Number(state.simulator.used) || 0), 0, capacity);
  return state.simulator;
}

function simulatorSessionsLeft() {
  const simulator = ensureSimulatorWeek();
  return Math.max(0, simulatorCapacityForLevel(simulator.level) - simulator.used);
}

function simulatorUpgradeCostFor(level) {
  return SIM_UPGRADE_COSTS[level] || 0;
}

function simulatorSessionXp(driver) {
  return round1(SIM_SESSION_XP * driverDevelopmentProfile(driver).rate);
}

function effectiveDriverStats(driver) {
  if (!driver) return null;
  const base = driverPermanentStats(driver);
  const form = driverFormValue(driver.id);
  const adj = (baseValue, weight) => clamp(Math.round(baseValue + form * weight), 1, MAX_STAT);
  const stats = {
    pace: adj(base.pace, 0.9),
    consistency: adj(base.consistency, 0.55),
    tyre: adj(base.tyre, 0.5),
    wet: adj(base.wet, 0.4),
    feedback: adj(base.feedback, 0.35)
  };
  const ovr = clamp(Math.round(base.ovr + form * 0.85), 1, MAX_STAT);
  return { ...base, ...stats, ovr, baseOvr: base.ovr, form, formDelta: round1(form), formTone: formTone(form) };
}

function effectiveDriverOvr(driver) {
  return effectiveDriverStats(driver)?.ovr ?? driver?.ovr ?? 0;
}

function developedDriverOvr(driver) {
  return driverPermanentStats(driver)?.ovr ?? driver?.ovr ?? 0;
}

/* Racecraft is derived from the five core attributes: pace and feedback drive
   attacking, consistency/tyre/feedback govern clean-air following, and race
   intelligence + consistency govern defending. These ratings are what let a
   top driver fight a faster car — or maximise one that is already quick. */
function driverRacecraft(driver) {
  const e = effectiveDriverStats(driver) || driver;
  if (!e) return { overtake: 70, follow: 70, defend: 70, aggression: 70 };
  const overtake = clamp(Math.round(e.pace * 0.34 + e.feedback * 0.24 + e.consistency * 0.20 + e.tyre * 0.12 + e.wet * 0.10), 1, MAX_STAT);
  const follow = clamp(Math.round(e.consistency * 0.32 + e.feedback * 0.24 + e.tyre * 0.24 + e.pace * 0.12 + e.wet * 0.08), 1, MAX_STAT);
  const defend = clamp(Math.round(e.consistency * 0.30 + e.feedback * 0.26 + e.tyre * 0.22 + e.pace * 0.14 + e.wet * 0.08), 1, MAX_STAT);
  return { overtake, follow, defend, aggression: Math.round(overtake * 0.6 + defend * 0.4) };
}

function formHistoryFor(driverId) {
  const record = state.driverForm?.[driverId];
  const history = Array.isArray(record?.history) ? record.history.slice(-6) : [];
  return history.length ? history : [Number(record?.value) || 0];
}

function formSparkHTML(driverId, extra = '') {
  let history = formHistoryFor(driverId);
  if (history.length === 1) history = [0, ...history];
  return `<span class="form-spark ${extra}" title="最近 ${history.length} 场状态走势">${history.map((value) => {
    const height = clamp(Math.round(((value + FORM_LIMIT) / (FORM_LIMIT * 2)) * 100), 8, 100);
    return `<i class="${formTone(value)}" style="height:${height}%"></i>`;
  }).join('')}</span>`;
}

function updateDriverFormsAfterRace(ordered) {
  ensureDriverFormState();
  const playerIds = new Set(state.roster || []);
  const raced = new Set();
  ordered.forEach((entry) => {
    const record = state.driverForm[entry.driverId];
    if (!record) return;
    raced.add(entry.driverId);
    const before = record.value;
    let delta = 0;
    if (entry.retired) {
      delta -= 1.0 + Math.random() * 0.3;
    } else {
      delta += clamp((12 - entry.position) * 0.085, -0.55, 1.0);
      delta += clamp(((entry.grid || entry.position) - entry.position) * 0.05, -0.3, 0.32);
      delta += clamp((entry.overtakes || 0) * 0.025, 0, 0.16);
      if (entry.position === 1) delta += 0.35;
      else if (entry.position <= 3) delta += 0.18;
    }
    if (playerIds.has(entry.driverId)) {
      delta += (moraleFor(entry.driverId) - 70) * 0.012;
    }
    delta += randn() * 0.1;
    const next = clamp(before * 0.72 + delta, -4.5, 4.5);
    record.value = round1(next);
    record.trend = round1(record.value - before);
    record.history = [...(record.history || []), record.value].slice(-FORM_HISTORY_LIMIT);
  });
  DRIVERS.forEach((driver) => {
    if (raced.has(driver.id)) return;
    const record = state.driverForm[driver.id];
    if (!record) return;
    const next = record.value * 0.92;
    record.trend = round1(next - record.value);
    record.value = round1(next);
  });
}

/* ---------- domain accessors ---------- */
function currentSeasonYear() {
  return state.seasonYear || SEASON_YEAR;
}

function effectiveLineup(teamId) {
  if (!teamId) return [];
  if (teamId === state.teamId && state.roster.length) return state.roster;
  return (state.lineups && state.lineups[teamId]) || TEAM_MAP[teamId]?.drivers || [];
}

function currentTeam() {
  return TEAM_MAP[state.teamId] || TEAM_MAP[state.selectedTeamId] || null;
}

function currentSponsor() { return state.sponsorId ? SPONSOR_MAP[state.sponsorId] : null; }
function playerCarNumber(driverId) {
  const index = (state.roster || []).indexOf(driverId);
  return index >= 0 ? index + 1 : null;
}
function rosterDrivers() { return state.roster.map((id) => DRIVER_MAP[id]).filter(Boolean); }
function salarySum() { return round2(rosterDrivers().reduce((sum, d) => sum + d.salary, 0)); }
function defaultCalendarIds() {
  return TRACKS.map((track) => track.id);
}

function normalizeCalendarIds(ids) {
  const picked = [];
  (Array.isArray(ids) ? ids : []).forEach((id) => {
    if (typeof id !== 'string' || !TRACK_MAP[id]) return;
    if (picked.includes(id) || picked.length >= TRACKS.length) return;
    picked.push(id);
  });
  return picked.length ? picked : defaultCalendarIds();
}

function seasonCalendar() {
  const ids = normalizeCalendarIds(state?.calendarIds);
  return ids.map((id, index) => {
    const track = TRACK_MAP[id];
    return { ...track, round: index + 1, calendarIndex: index };
  });
}

function calendarCount() {
  return normalizeCalendarIds(state?.calendarIds).length;
}

function activeTrackById(trackId) {
  return seasonCalendar().find((track) => track.id === trackId) || TRACK_MAP[trackId] || null;
}

function isDefaultCalendar(ids = state?.calendarIds) {
  return normalizeCalendarIds(ids).join('|') === defaultCalendarIds().join('|');
}

function calendarSummaryText() {
  const calendar = seasonCalendar();
  if (isDefaultCalendar()) return `标准赛历 · ${calendar.length} 站`;
  return `自定义赛历 · ${calendar.length} 站 · ${calendar[0]?.gp || '—'} → ${calendar[calendar.length - 1]?.gp || '—'}`;
}

function calendarEditable() {
  if (!state) return false;
  if (state.stage === 'preseason' || state.stage === 'offseason') return true;
  return state.stage === 'season' && (state.races?.length || 0) === 0;
}

function calendarLengthForSave(save) {
  return normalizeCalendarIds(save?.calendarIds).length;
}

function nextTrack() {
  const calendar = seasonCalendar();
  return calendar[Math.min(state.raceIndex, calendar.length - 1)] || calendar[0] || TRACKS[0];
}

function seasonIsOver() {
  return state.raceIndex >= calendarCount();
}

function activeTeamOfDriver(driverId) {
  if (!driverId) return null;
  if (state.roster && state.roster.includes(driverId)) return state.teamId;
  for (const team of TEAMS) {
    if ((state.lineups?.[team.id] || []).includes(driverId)) return team.id;
  }
  return null;
}

function driverColor(driver) {
  if (!driver) return '#cfd8e3';
  const teamId = activeTeamOfDriver(driver.id);
  if (teamId) return TEAM_MAP[teamId]?.color || '#9aa6b4';
  return driver.freeColor || '#8492a2';
}

function driverTeam(driver) {
  if (!driver) return null;
  return TEAM_MAP[activeTeamOfDriver(driver.id)] || null;
}

function contractEndFor(driverId) {
  return state.contractEnd?.[driverId] ?? DRIVER_MAP[driverId]?.contractEnd ?? null;
}

function contractYearsRemaining(driverId) {
  const end = contractEndFor(driverId);
  if (!end) return 0;
  if (end < currentSeasonYear()) return 0;
  return Math.max(1, end - currentSeasonYear() + 1);
}

function buyoutFee(driverId) {
  const driver = DRIVER_MAP[driverId];
  if (!driver || !activeTeamOfDriver(driverId)) return 0;
  return round1(driver.salary * contractYearsRemaining(driverId) * 1.4);
}

function releaseFee(driverId) {
  const driver = DRIVER_MAP[driverId];
  if (!driver) return 0;
  return round1(driver.salary * contractYearsRemaining(driverId) * 0.8);
}

function signOnFee(driver, term = 2) {
  if (!driver) return 0;
  return round1(driver.salary * 2.4 * (0.86 + Number(term) * 0.14));
}

function moraleFor(driverId) {
  return state.morale?.[driverId] ?? 70;
}

function moraleLabel(value) {
  if (value >= 82) return '极佳';
  if (value >= 70) return '良好';
  if (value >= 55) return '平稳';
  if (value >= 40) return '低落';
  return '危机';
}

function initializeContracts() {
  if (!state.contractEnd) state.contractEnd = {};
  TEAMS.forEach((team) => {
    effectiveLineup(team.id).forEach((driverId) => {
      if (state.contractEnd[driverId] == null) {
        state.contractEnd[driverId] = DRIVER_MAP[driverId]?.contractEnd ?? (currentSeasonYear() + 1);
      }
    });
  });
}

function ensurePlayerMorale() {
  if (!state.morale) state.morale = {};
  const team = currentTeam();
  const teamCar = team ? carOvr(team.base) : 82;
  state.roster.forEach((driverId, index) => {
    const driver = DRIVER_MAP[driverId];
    if (!driver || state.morale[driverId] != null) return;
    const years = Math.max(1, contractYearsRemaining(driverId));
    const base = 66 + Math.round((developedDriverOvr(driver) - 75) * 0.5) + (years >= 2 ? 3 : -2) + (index === 0 ? 2 : 0) + Math.round((teamCar - 82) * 0.15);
    state.morale[driverId] = clamp(base, 35, 92);
  });
}

function philosophyMods() {
  return state.philosophy ? (PHILOSOPHIES[state.philosophy]?.bonus || {}) : {};
}

function currentCarStats() {
  const team = currentTeam();
  if (!team) return { aero: 70, chassis: 70, power: 70, reliability: 70 };
  const stats = { ...team.base };
  const mods = philosophyMods();
  Object.keys(stats).forEach((key) => {
    stats[key] += (mods[key] || 0);
    stats[key] += (state.allocation[key] || 0);
  });
  completedRndNodes().forEach((node) => {
    Object.entries(node.effects).forEach(([key, value]) => {
      if (stats[key] !== undefined) stats[key] += value;
    });
  });
  Object.keys(stats).forEach((key) => { stats[key] = clamp(Math.round(stats[key]), 1, MAX_STAT); });
  return stats;
}

function completedRndNodes() {
  const ids = state.upgradeNodes || [];
  return RND_NODES.filter((node) => ids.includes(node.id));
}

function completedUpgradeCount() {
  return (state.upgradeNodes || []).length;
}

function nodePrereqsMet(node) {
  if (!node || !Array.isArray(node.requires)) return true;
  return node.requires.every((id) => (state.upgradeNodes || []).includes(id));
}

function upgradeNodeCost(node) {
  if (!node) return 0;
  const discount = state.sponsorId === 'novatech' ? 0.8 : 1;
  return round1(node.cost * discount);
}

function upgradeReliabilityRisk() {
  return round1(completedRndNodes().reduce((sum, node) => sum + (node.riskDelta || 0), 0));
}

function estimatedDnfRisk(carStats = currentCarStats()) {
  const base = 1.4 + (100 - carStats.reliability) * 0.30;
  return Math.max(0.5, round1(base + Math.max(0, upgradeReliabilityRisk())));
}

function carOvr(stats) {
  if (!stats) return 0;
  return Math.round(stats.aero * 0.30 + stats.chassis * 0.27 + stats.power * 0.25 + stats.reliability * 0.18);
}

function teamCarStats(teamId) {
  if (teamId === state.teamId) return currentCarStats();
  const base = TEAM_MAP[teamId]?.base || { aero: 70, chassis: 70, power: 70, reliability: 70 };
  const seasonDev = Math.max(0, currentSeasonYear() - SEASON_YEAR) * 2;
  const dev = Math.min(10, Math.floor(state.raceIndex / 3) + seasonDev);
  return {
    aero: clamp(base.aero + dev, 1, MAX_STAT),
    chassis: clamp(base.chassis + dev, 1, MAX_STAT),
    power: clamp(base.power + dev, 1, MAX_STAT),
    reliability: clamp(base.reliability + dev, 1, MAX_STAT)
  };
}

function carScoreForTrack(stats, track) {
  const powerW = 0.28 + track.power * 0.30;
  const aeroW = 0.28 + track.df * 0.30;
  const chassisW = Math.max(0.12, 1 - powerW - aeroW);
  return stats.aero * aeroW + stats.chassis * chassisW + stats.power * powerW;
}

function driverScore(driver, wet) {
  const effective = effectiveDriverStats(driver) || driver;
  let score = wet
    ? effective.wet * 0.50 + effective.pace * 0.30 + effective.consistency * 0.20
    : effective.pace * 0.58 + effective.tyre * 0.16 + effective.consistency * 0.16 + effective.feedback * 0.10;
  if (state.roster && state.roster.includes(driver.id)) {
    score += (moraleFor(driver.id) - 70) * 0.04;
  }
  return score;
}

function combinedScore(teamId, driver, track, wet) {
  const car = teamCarStats(teamId);
  return carScoreForTrack(car, track) * 0.63 + driverScore(driver, wet) * 0.37;
}



function activeDriverTeamMap() {
  const map = new Map();
  TEAMS.forEach((team) => {
    effectiveLineup(team.id).forEach((id) => {
      if (DRIVER_MAP[id]) map.set(id, team.id);
    });
  });
  return map;
}

function allDriversInChampionship() {
  return Array.from(activeDriverTeamMap().keys()).map((id) => DRIVER_MAP[id]);
}

function standings() {
  const driverTable = new Map();
  activeDriverTeamMap().forEach((teamId, id) => {
    driverTable.set(id, {
      driver: DRIVER_MAP[id],
      teamId,
      points: 0, wins: 0, podiums: 0, best: 99, dnf: 0
    });
  });
  const teamTable = new Map();
  TEAMS.forEach((t) => teamTable.set(t.id, { team: t, points: 0, wins: 0, podiums: 0 }));

  state.races.forEach((race) => {
    race.rows.forEach((row) => {
      const d = driverTable.get(row.driverId);
      const t = teamTable.get(row.teamId);
      if (d) {
        d.points += row.points || 0;
        if (row.position === 1) d.wins += 1;
        if (row.position && row.position <= 3) d.podiums += 1;
        if (row.position) d.best = Math.min(d.best, row.position);
        if (row.dnf) d.dnf += 1;
      }
      if (t) {
        t.points += row.points || 0;
        if (row.position === 1) t.wins += 1;
        if (row.position && row.position <= 3) t.podiums += 1;
      }
    });
  });

  const drivers = Array.from(driverTable.values()).sort((a, b) =>
    b.points - a.points || b.wins - a.wins || b.podiums - a.podiums || a.best - b.best);
  const constructors = Array.from(teamTable.values()).sort((a, b) =>
    b.points - a.points || b.wins - a.wins || b.podiums - a.podiums);

  return { drivers, constructors };
}

function playerChampionship() {
  const table = standings();
  const driver = table.drivers.find((row) => row.driver.id === state.roster[0]) || table.drivers.find((row) => state.roster.includes(row.driver.id));
  const team = table.constructors.findIndex((row) => row.team.id === state.teamId) + 1;
  return { driver, position: driver ? table.drivers.indexOf(driver) + 1 : 0, teamPosition: team || 0, table };
}

function boardVerdict(snapshot) {
  const team = TEAM_MAP[state.teamId] || snapshot;
  if (!team) return { key: 'ok', delta: 0, label: '等待评估', detail: '' };
  return { key: 'ok', delta: 0, label: '', detail: '' };
}

function boardForResult(bestPosition, bothDnf) {
  const team = currentTeam();
  if (!team) return { key: 'ok', delta: 1, label: '符合预期', detail: '' };
  if (bothDnf) return { key: 'dnf', delta: BOARD_DELTAS.dnf, label: '双退', detail: '两台车都未能完赛，董事会非常不满。' };
  const target = team.targetPos;
  if (bestPosition === 1) return { key: 'great', delta: BOARD_DELTAS.great, label: '超额完成', detail: `分站冠军！完成并超越本场目标（P${target}）。` };
  const rel = target - bestPosition;
  if (rel >= 2) return { key: 'great', delta: BOARD_DELTAS.great, label: '超额完成', detail: `最佳完赛 P${bestPosition}，优于本场目标（P${target}）。` };
  if (rel >= 0) return { key: 'good', delta: BOARD_DELTAS.good, label: '达成目标', detail: `最佳完赛 P${bestPosition}，完成本场目标（P${target}）。` };
  if (rel >= -2) return { key: 'ok', delta: BOARD_DELTAS.ok, label: '差距不大', detail: `最佳完赛 P${bestPosition}，略低于目标（P${target}）。` };
  if (rel >= -4) return { key: 'poor', delta: BOARD_DELTAS.poor, label: '低于预期', detail: `最佳完赛 P${bestPosition}，未达到目标（P${target}）。` };
  return { key: 'bad', delta: BOARD_DELTAS.bad, label: '令人失望', detail: `最佳完赛 P${bestPosition}，与目标（P${target}）差距明显。` };
}

function confidenceClass(value) {
  if (value >= 70) return 'ok';
  if (value >= 40) return 'warn';
  return 'bad';
}
