      <div class="modal-head">
        <div>
          ${modalData.kicker ? `<div class="eyebrow">${escapeHTML(modalData.kicker)}</div>` : ''}
          <h2 class="modal-title">${modalData.title || ''}</h2>
        </div>
        ${modalData.dismissible === false ? '' : `<button type="button" class="modal-close" data-action="close-modal" aria-label="关闭">${icon('close')}</button>`}
      </div>
      <div class="modal-body">${modalData.body || ''}</div>
      <div class="modal-actions">${modalActionsHTML(actions)}</div>
    </section>
  </div>`;
}

function openModal(config) {
  modalData = config;
  renderModal();
}

function closeModal() {
  modalData = null;
  renderModal();
}

function toast(message, type = 'info') {
  const root = $('#toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="dot" style="color:${type === 'error' ? 'var(--bad)' : type === 'success' ? 'var(--ok)' : 'var(--accent)'}"></span><span>${message}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }, 3000);
}

function render(options = {}) {
  const previousScroll = window.scrollY;
  const viewKey = `${state.screen}|${state.route}|${state.setupStep}|${state.stage}`;
  const viewChanged = lastRenderView !== null && lastRenderView !== viewKey;
  applyTheme(currentTeam());
  const app = $('#app');
  if (!app) return;
  let html = '';
  switch (state.screen) {
    case 'teams': html = viewTeamSelect(); break;
    case 'setup': html = viewSetup(); break;
    case 'game': html = viewGame(); break;
    case 'end': html = viewSeasonEnd(); break;
    case 'offseason': html = viewOffseason(); break;
    case 'landing':
    default: html = viewLanding(); break;
  }
  app.innerHTML = html;
  renderModal();
  lastRenderView = viewKey;

  if (options.scrollTarget) {
    window.setTimeout(() => document.getElementById(options.scrollTarget)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 40);
    return;
  }

  let targetScroll = previousScroll;
  if (options.preserveScroll === false || (options.preserveScroll !== true && viewChanged)) {
    targetScroll = 0;
  }
  window.scrollTo({ top: targetScroll, behavior: 'instant' });
  window.requestAnimationFrame(() => {
    window.scrollTo({ top: targetScroll, behavior: 'instant' });
  });
}

function setScreen(screen) {
  state.screen = screen;
  render();
}

/* ---------- persistence ---------- */
/*
  Save compatibility policy:
  - The three slot keys (paddock_boss_save_slot_1..3) are permanent; never rename them.
  - On schema changes, extend normalizeSave() and bump SAVE_SCHEMA instead.
  - The old single-career key is imported once into slot 1 and left untouched.
  - Each slot keeps a one-generation backup; existing saves are never overwritten by a new build.
*/
function normalizeSave(raw) {
  if (!raw || typeof raw !== 'object' || !raw.teamId || !TEAM_MAP[raw.teamId]) return null;
  const saved = { ...freshState(), ...raw };
  saved.calendarIds = normalizeCalendarIds(raw.calendarIds);
  saved.scheduleDraft = null;
  saved.scheduleSearch = '';
  const calendarIds = saved.calendarIds;
  saved.roster = (Array.isArray(raw.roster) ? raw.roster : []).filter((id) => DRIVER_MAP[id]);
  if (saved.roster.length < 2) {
    TEAM_MAP[raw.teamId].drivers.forEach((id) => {
      if (!saved.roster.includes(id) && saved.roster.length < 2) saved.roster.push(id);
    });
  }
  saved.roster = saved.roster.slice(0, 2);

  saved.lineups = (raw.lineups && typeof raw.lineups === 'object') ? raw.lineups : {};
  TEAMS.forEach((team) => {
    if (team.id === saved.teamId) return;
    const existing = Array.isArray(saved.lineups[team.id]) ? saved.lineups[team.id].filter((id) => DRIVER_MAP[id]) : [];
    const merged = Array.from(new Set([...existing, ...team.drivers])).slice(0, 2);
    saved.lineups[team.id] = merged.length === 2 ? merged : team.drivers.slice();
  });

  saved.contractEnd = (raw.contractEnd && typeof raw.contractEnd === 'object') ? raw.contractEnd : {};
  TEAMS.forEach((team) => {
    const ids = team.id === saved.teamId ? saved.roster : saved.lineups[team.id];
    ids.forEach((id) => {
      if (saved.contractEnd[id] == null) {
        saved.contractEnd[id] = DRIVER_MAP[id]?.contractEnd ?? (SEASON_YEAR + 1);
      }
    });
  });

  saved.morale = (raw.morale && typeof raw.morale === 'object') ? raw.morale : {};
  saved.roster.forEach((id) => {
    if (saved.morale[id] == null) saved.morale[id] = 70;
  });

  saved.driverForm = normalizeDriverForm(raw.driverForm);
  saved.driverProgress = normalizeDriverProgress(raw.driverProgress);
  saved.driverAges = normalizeDriverAges(raw.driverAges);
  saved.simulator = normalizeSimulatorState(raw.simulator);
  saved.simSpend = Number(raw.simSpend) || 0;
  saved.simSpeed = [1, 2, 4, 8, 16].includes(Number(raw.simSpeed)) ? Number(raw.simSpeed) : 1;

  let nodes = Array.isArray(raw.upgradeNodes) ? raw.upgradeNodes.filter((id) => RND_NODE_MAP[id]) : [];
  if (!nodes.length && raw.upgradeLevels && typeof raw.upgradeLevels === 'object') {
    RND_BRANCHES.forEach((branch) => {
      const level = Math.min(3, Number(raw.upgradeLevels[branch.id]) || 0);
      RND_NODES
        .filter((node) => node.branch === branch.id)
        .sort((a, b) => a.tier - b.tier)
        .slice(0, level)
        .forEach((node) => nodes.push(node.id));
    });
  }
  saved.upgradeNodes = Array.from(new Set(nodes));

  if (raw.activeUpgrade) {
    let node = RND_NODE_MAP[raw.activeUpgrade.nodeId];
    if (!node && raw.activeUpgrade.id && RND_BRANCH_MAP[raw.activeUpgrade.id]) {
      node = RND_NODES
        .filter((candidate) => candidate.branch === raw.activeUpgrade.id && !saved.upgradeNodes.includes(candidate.id))
        .sort((a, b) => a.tier - b.tier)[0];
    }
    saved.activeUpgrade = node ? {
      ...raw.activeUpgrade,
      nodeId: node.id,
      name: node.name,
      roundsLeft: Math.max(1, Number(raw.activeUpgrade.roundsLeft) || 1),
      totalRounds: Math.max(1, Number(raw.activeUpgrade.totalRounds) || node.rounds),
      cost: Number(raw.activeUpgrade.cost) || node.cost,
      devRisk: node.devRisk,
      riskDelta: node.riskDelta
    } : null;
  } else {
    saved.activeUpgrade = null;
  }

  const rawRaces = Array.isArray(raw.races) ? raw.races.slice() : [];
  const looksCurrentCalendar = rawRaces.every((race) => {
    const index = Number(race.roundIndex);
    return calendarIds[index] === race.trackId;
  });
  const mappedRaces = rawRaces.map((race) => {
    const mappedIndex = calendarIds.indexOf(race.trackId);
    return { ...race, roundIndex: mappedIndex >= 0 ? mappedIndex : Number(race.roundIndex) };
  }).filter((race) => Number.isInteger(race.roundIndex) && race.roundIndex >= 0 && race.roundIndex < calendarIds.length);
  const raceMap = new Map();
  mappedRaces.forEach((race) => raceMap.set(race.roundIndex, race));
  saved.races = Array.from(raceMap.values()).sort((a, b) => a.roundIndex - b.roundIndex);

  const usedRounds = new Set(saved.races.map((race) => race.roundIndex));
  const firstUnraced = calendarIds.findIndex((_, index) => !usedRounds.has(index));
  if (saved.stage === 'end') {
    saved.raceIndex = clamp(Number(raw.raceIndex) || calendarIds.length, 0, calendarIds.length);
  } else if (looksCurrentCalendar && Number.isFinite(Number(raw.raceIndex))) {
    saved.raceIndex = clamp(Number(raw.raceIndex), 0, calendarIds.length);
  } else {
    saved.raceIndex = firstUnraced === -1 ? calendarIds.length : firstUnraced;
  }

  saved.weekend = null;
  if (raw.stage === 'season' && raw.weekend && raw.weekend.trackId && TRACK_MAP[raw.weekend.trackId]) {
    const weekend = raw.weekend;
    const nextTrackId = calendarIds[saved.raceIndex];
    if (weekend.trackId === nextTrackId) {
      if (Array.isArray(weekend.practice?.sessions) && Number.isFinite(Number(weekend.qualiStage))) {
        saved.weekend = {
          ...weekend,
          prep: { setup: 0, tyre: 0, quali: 0, ...(weekend.prep || {}) },
          qualiSegments: Array.isArray(weekend.qualiSegments) ? weekend.qualiSegments : [],
          form: weekend.form || {},
          strategies: (weekend.strategies && typeof weekend.strategies === 'object') ? weekend.strategies : {},
          quali: Array.isArray(weekend.quali) ? weekend.quali : []
        };
      } else if (Array.isArray(weekend.quali) && weekend.quali.length) {
        // Legacy weekend with pre-computed qualifying, before practice/Q1-Q3 flow.
        saved.weekend = {
          roundIndex: saved.raceIndex,
          trackId: weekend.trackId,
          wet: !!weekend.wet,
          tempTrack: weekend.tempTrack,
          tempAir: weekend.tempAir,
          practice: { sessions: [1, 2, 3].map((n) => ({ session: n, skipped: true, programId: null, gain: 0 })) },
          prep: { setup: 0, tyre: 0, quali: 0 },
          qualiStage: 3,
          qualiSegments: [],
          form: {},
          strategies: {},
          quali: weekend.quali.map((entry, index) => ({ ...entry, segment: entry.segment || (index < 10 ? 'Q3' : index < 16 ? 'Q2' : 'Q1') })),
          createdAt: Date.now()
        };
      }
    }
  }

  if (!['preseason', 'season', 'end', 'offseason'].includes(saved.stage)) saved.stage = 'season';
  saved.seasonYear = Number(raw.seasonYear) || SEASON_YEAR;
  saved.seasonHistory = Array.isArray(raw.seasonHistory) ? raw.seasonHistory : [];
  saved.marketFilter = ['all', 'free', 'contracted'].includes(raw.marketFilter) ? raw.marketFilter : 'all';
  saved.cash = Number(saved.cash) || 0;
  saved.board = Number.isFinite(Number(saved.board)) ? Number(saved.board) : START_CONFIDENCE;
  saved.raceIndex = clamp(Number(saved.raceIndex) || 0, 0, calendarIds.length);
  saved.upgradeNodes = saved.upgradeNodes || [];
  saved.saveSchema = SAVE_SCHEMA;
  if (![1, 2, 4, 8, 16].includes(Number(saved.simSpeed))) saved.simSpeed = 1;
  saved.slot = Number(raw.slot) || null;
  saved.lastSavedAt = raw.lastSavedAt || raw.createdAt || null;
  saved.importedFromLegacy = !!raw.importedFromLegacy;
  return saved;
}

function readSaveKey(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    return normalizeSave(JSON.parse(raw));
  } catch (err) {
    return null;
  }
}

function slotStorageKey(slot) { return `${SLOT_SAVE_PREFIX}${slot}`; }
function slotBackupStorageKey(slot) { return `${SLOT_BACKUP_PREFIX}${slot}`; }

function readLegacySave() {
  const main = readSaveKey(SAVE_KEY);
  if (main) return main;
  const backup = readSaveKey(SAVE_BACKUP_KEY);
  if (backup) return backup;
  for (const key of LEGACY_SAVE_KEYS) {
    const legacy = readSaveKey(key);
    if (legacy) return legacy;
  }
  return null;
}

function readSlot(slot) {
  const number = Number(slot);
  if (!Number.isInteger(number) || number < 1 || number > SAVE_SLOT_COUNT) return null;
  const main = readSaveKey(slotStorageKey(number));
  if (main) {
    main.slot = number;
    return main;
  }
  const backup = readSaveKey(slotBackupStorageKey(number));
  if (backup) {
    backup.slot = number;
    return backup;
  }
  return null;
}

function listSlots() {
  return Array.from({ length: SAVE_SLOT_COUNT }, (_, index) => {
    const slot = index + 1;
    return { slot, save: readSlot(slot) };
  });
}

function latestSlotEntry() {
  const filled = listSlots().filter((entry) => entry.save);
  if (!filled.length) return null;
  return filled.sort((a, b) => (b.save.lastSavedAt || 0) - (a.save.lastSavedAt || 0))[0];
}

function firstEmptySlotNumber() {
  const empty = listSlots().find((entry) => !entry.save);
  return empty ? empty.slot : null;
}

function ensureSlotSystemInitialized() {
  try {
    if (localStorage.getItem(SLOT_INIT_KEY)) return;
    const anySlot = listSlots().some((entry) => entry.save);
    if (!anySlot) {
      const legacy = readLegacySave();
      if (legacy) {
        legacy.slot = 1;
        legacy.importedFromLegacy = true;
        legacy.lastSavedAt = legacy.lastSavedAt || legacy.createdAt || Date.now();
        const payload = JSON.stringify({ ...legacy, saveSchema: SAVE_SCHEMA });
        // Preserve the legacy key untouched, but expose it as slot 1 and back it up.
        localStorage.setItem(slotStorageKey(1), payload);
        localStorage.setItem(slotBackupStorageKey(1), payload);
      }
    }
    localStorage.setItem(SLOT_INIT_KEY, '1');
  } catch (err) {
    console.warn('Slot initialization failed', err);
  }
}

function peekSave() {
  const latest = latestSlotEntry();
  return latest ? latest.save : null;
}

function hasSave() {
  return listSlots().some((entry) => !!entry.save);
}

function saveState() {
  try {
    if (!state.teamId || !state.slot) return;
    state.lastSavedAt = Date.now();
    state.saveSchema = SAVE_SCHEMA;
    const key = slotStorageKey(state.slot);
    const backupKey = slotBackupStorageKey(state.slot);
    const previous = localStorage.getItem(key);
    if (previous) localStorage.setItem(backupKey, previous);
    localStorage.setItem(key, JSON.stringify(state));
    localStorage.setItem(SLOT_INIT_KEY, '1');
  } catch (err) {
    console.warn('Save failed', err);
  }
}

function clearSlotData(slot) {
  try {
    localStorage.removeItem(slotStorageKey(slot));
    localStorage.removeItem(slotBackupStorageKey(slot));
  } catch (err) { /* noop */ }
}

function clearSave() {
  if (state.slot) clearSlotData(state.slot);
}

function resumeScreen(snapshot) {
  if (snapshot.stage === 'preseason') {
    snapshot.screen = 'setup';
    snapshot.setupStep = clamp(Number(snapshot.setupStep) || 0, 0, 2);
  } else if (snapshot.stage === 'end') {
    snapshot.screen = 'end';
  } else if (snapshot.stage === 'offseason') {
    snapshot.screen = 'offseason';
  } else {
    snapshot.screen = 'game';
    if (!['hq', 'rnd', 'drivers', 'sponsor', 'calendar', 'standings', 'weekend'].includes(snapshot.route)) snapshot.route = 'hq';
    if (!snapshot.weekend && snapshot.route === 'weekend') snapshot.route = 'hq';
  }
  return snapshot;
}

function loadSlot(slot) {
  const save = readSlot(slot);
  if (!save) {
    toast('这个存档位目前是空的。', 'error');
    return;
  }
  state = resumeScreen({ ...save, slot: Number(slot) });
  closeModal();
  render();
}

function continueCareer() {
  const latest = latestSlotEntry();
  if (!latest) {
    toast('没有找到存档。', 'error');
    return;
  }
  loadSlot(latest.slot);
}

/* ---------- boot ---------- */
function boot() {
  ensureSlotSystemInitialized();
  if (hasSave()) document.body.dataset.hasSave = '1';
  applyTheme(null);
  render();
}

boot();

document.addEventListener('click', (event) => {
  const el = event.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action.startsWith('race-')) {
    if (typeof handleRaceAction === 'function' && handleRaceAction(action, el)) {
      if (el.tagName === 'BUTTON') event.preventDefault();
      return;
    }
  }
  if (el.tagName === 'BUTTON' && el.type !== 'submit') event.preventDefault();
  handleAction(action, el);
});

document.addEventListener('click', (event) => {
  if (!modalData) return;
  if (event.target.classList.contains('overlay') && modalData.dismissible !== false) closeModal();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && modalData && modalData.dismissible !== false) closeModal();
});

document.addEventListener('change', (event) => {
  if (event.target.closest('#strategy-form') && typeof updateStrategyPreview === 'function') {
    updateStrategyPreview();
    saveState();
  }
});

document.addEventListener('input', (event) => {
  if (event.target.id === 'schedule-search' && modalData) {
    state.scheduleSearch = event.target.value;
    updateScheduleAvailable();
  }
});

function allocatePoint(key, dir) {
  if (!Object.prototype.hasOwnProperty.call(state.allocation, key)) return;
  const value = state.allocation[key] || 0;
  const used = Object.values(state.allocation).reduce((a, b) => a + b, 0);
  if (dir > 0) {
    if (value >= 4 || used >= DESIGN_POINTS) return;
    state.allocation[key] = value + 1;
  } else if (dir < 0) {
    if (value <= 0) return;
    state.allocation[key] = value - 1;
  }
  state.designConfirmed = false;
  saveState();
  render();
}

      <span class="seat-action">${canAfford ? `替换 · 总计 ${money(total, 1)}` : `预算不足 · 需要 ${money(total, 1)}`}</span>
    </button>`;
  }).join('');
  const canAny = [0, 1].some((i) => {
    const current = DRIVER_MAP[state.roster[i]];
    return state.cash >= round1(signFee + buyout + releaseFee(current.id));
  });

    kicker: incomingTeam ? 'Driver market / Contract buyout' : 'Driver market / Free agent',

      <div class="driver-attrs">${Object.keys(DRIVER_STAT_LABELS).map((key) => { const effective = effectiveDriverStats(driver); return `<div class="driver-attr"><span>${DRIVER_STAT_LABELS[key]}</span><i><em style="width:${effective[key]}%"></em></i><b>${effective[key]}</b></div>`; }).join('')}</div>

          <b>${years} 年</b><span>至 ${currentSeasonYear() + years - 1}</span><small>${years === 1 ? '灵活但缺乏保障' : years === 2 ? '平衡承诺与成本' : '长期安全感最高'}</small>

function signDriverToSeat(driverId, seat) {
  const driver = DRIVER_MAP[driverId];
  const seatIndex = clamp(seat, 0, 1);
  if (!driver || !state.roster[seatIndex]) return;
  if (state.roster.includes(driverId)) return;
  initializeContracts();
  const term = [1, 2, 3].includes(Number(modalData?.term)) ? Number(modalData.term) : 2;
  const incomingTeamId = activeTeamOfDriver(driverId);
  const buyout = buyoutFee(driverId);
  const signFee = signOnFee(driver, term);
  const oldDriverId = state.roster[seatIndex];
  const oldDriver = DRIVER_MAP[oldDriverId];
  const release = releaseFee(oldDriverId);
  const total = round1(signFee + buyout + release);
  if (state.cash < total) {
    toast(`预算不足，完成这笔交易需要 ${money(total, 2)}。`, 'error');
    return;
  }
  const newEnd = currentSeasonYear() + term - 1;
  const teammateId = state.roster[1 - seatIndex];
  const teammate = DRIVER_MAP[teammateId];

  state.cash = round2(state.cash - total);
  state.signingSpend = round2((state.signingSpend || 0) + total);
  state.roster[seatIndex] = driverId;
  delete state.contractEnd[oldDriverId];
  state.contractEnd[driverId] = newEnd;

  if (!state.morale) state.morale = {};
  state.morale[driverId] = clamp(66 + Math.round((developedDriverOvr(driver) - 75) * 0.4) + term * 3, 35, 95);
  if (teammate) {
    const dependentMorale = moraleFor(teammateId) + (developedDriverOvr(driver) > developedDriverOvr(teammate) ? -4 : 2);
    state.morale[teammateId] = clamp(dependentMorale, 25, 98);
  }

  if (incomingTeamId) {
    const incomingLineup = state.lineups[incomingTeamId] || [];
    const rivalSeat = incomingLineup.indexOf(driverId);
    if (rivalSeat >= 0) {
      const replacement = DRIVERS
        .filter((candidate) => candidate.id !== oldDriverId && !activeTeamOfDriver(candidate.id) && !state.roster.includes(candidate.id))
        .sort((a, b) => developedDriverOvr(b) - developedDriverOvr(a))[0];
      if (replacement) {
        state.lineups[incomingTeamId][rivalSeat] = replacement.id;
        state.contractEnd[replacement.id] = currentSeasonYear() + 1;
      } else {
        state.lineups[incomingTeamId][rivalSeat] = oldDriverId;
        state.contractEnd[oldDriverId] = currentSeasonYear() + 1;
      }
    }
  }

  if (state.stage !== 'offseason') {
    state.lineupConfirmed = false;
    state.setupStep = 1;
  }
  closeModal();
  saveState();
  render();
  toast(`${driver.cn} 已签入 CAR ${seatIndex + 1}（合同至 ${newEnd}），${oldDriver?.cn || '原车手'} 离队。总成本 ${money(total, 2)}。`, 'success');
}

function buyUpgrade(nodeId) {
  const node = RND_NODE_MAP[nodeId];
  if (!node) return;
  if (state.activeUpgrade) {
    toast('当前已有研发项目在进行，等待交付后再启动新项目。', 'error');
    return;
  }
  if ((state.upgradeNodes || []).includes(node.id)) {
    toast('该节点已经完成。', 'error');
    return;
  }
  if (!nodePrereqsMet(node)) {
    const missing = node.requires.map((id) => RND_NODE_MAP[id]?.name).filter(Boolean).join('、');
    toast(`需要先完成前置节点：${missing}。`, 'error');
    return;
  }
  const cost = upgradeNodeCost(node);
  if (state.cash < cost) {
    toast('预算不足，无法启动研发。', 'error');
    return;
  }
  state.cash = round2(state.cash - cost);
  state.rndSpend = round2((state.rndSpend || 0) + cost);
  state.activeUpgrade = {
    nodeId: node.id,
    name: node.name,
    roundsLeft: node.rounds,
    totalRounds: node.rounds,
    cost,
    devRisk: node.devRisk,
    riskDelta: node.riskDelta,
    startedAt: state.raceIndex
  };
  saveState();
  render();
  toast(`${node.name} 已立项，预计 ${node.rounds} 站后交付。`, 'success');
}

function runSimulatorSessions(driverId, runAll = false) {
  if (state.stage !== 'season') {
    toast('模拟器只在赛季内开放。', 'error');
    return;
  }
  const driver = DRIVER_MAP[driverId];
  if (!driver || !state.roster.includes(driverId)) {
    toast('只能为本队正选车手安排模拟器。', 'error');
    return;
  }
  ensureSimulatorWeek();
  const left = simulatorSessionsLeft();
  if (left <= 0) {
    toast('本周模拟器工时已用完，下一站前会重置。', 'error');
    return;
  }
  const affordable = Math.max(0, Math.floor((state.cash + 0.0001) / SIM_SESSION_COST));
  const count = Math.min(runAll ? left : 1, affordable);
  if (count <= 0) {
    toast(`预算不足：一次模拟器需要 ${money(SIM_SESSION_COST, 2)}。`, 'error');
    return;
  }
  const xpPerSession = simulatorSessionXp(driver);
  let totalXp = 0;
  let totalPoints = 0;
  const gains = new Set();
  for (let i = 0; i < count; i += 1) {
    state.cash = round2(state.cash - SIM_SESSION_COST);
    state.simSpend = round2((state.simSpend || 0) + SIM_SESSION_COST);
    state.simulator.used += 1;
    const result = grantDriverXp(driverId, xpPerSession, 'simulator');
    if (result) {
      totalXp = round1(totalXp + result.xp);
      totalPoints += result.points;
      result.gains.forEach((key) => gains.add(key));
    }
  }
  saveState();
  render();
  const gainText = gains.size ? `，成长 +${totalPoints}（${[...gains].map((key) => DRIVER_STAT_LABELS[key]).join(' / ')}）` : '';
  const partialText = count < (runAll ? left : 1) ? '（预算限制）' : '';
  toast(`${driver.cn} 完成 ${count} 次模拟器：+${round1(totalXp)} XP${gainText}${partialText}，本周剩余 ${simulatorSessionsLeft()} 次。`, 'success');
}

    body: `<p>这个操作会删除该存档位中的全部赛季、合同、预算和研发进度。其他两个存档位不会受到影响，旧版本原始存档也会保留。</p>
      <div class="confirm-points">
        <div class="confirm-row"><span>车队</span><b>${TEAM_MAP[save.teamId]?.cn || '未知'}</b></div>
        <div class="confirm-row"><span>赛季</span><b>${save.seasonYear} · ${save.stage === 'offseason' ? '休赛期' : save.stage === 'end' ? '赛季结束' : save.stage === 'preseason' ? '季前准备' : `第 ${Math.min(save.raceIndex + 1, calendarLengthForSave(save))} 站`}</b></div>
      </div>`,
    actions: [
      { label: '保留存档', action: 'close-modal' },
      { label: '清空此档', action: 'confirm-clear-slot', kind: 'btn-danger' }
    ]
  });
  modalData.slot = slot;
}

function confirmClearSlot() {
  const slot = Number(modalData?.slot);
  if (!Number.isInteger(slot)) return;
  clearSlotData(slot);
  if (state.slot === slot) state = freshState();
  closeModal();
  state.screen = 'landing';
  render();
  toast(`存档位 ${String(slot).padStart(2, '0')} 已清空。`, 'success');
}

function ensureRivalContracts() {
  const year = currentSeasonYear();
  TEAMS.forEach((rival) => {
    if (rival.id === state.teamId) return;
    const lineup = state.lineups?.[rival.id] || rival.drivers;
    lineup.forEach((driverId) => {
      if ((state.contractEnd[driverId] || 0) < year) state.contractEnd[driverId] = year + 1;
    });
  });
}

function enterOffseason() {
  if (state.stage !== 'end') return;
  const table = standings();
  const team = currentTeam();
  const teamIndex = table.constructors.findIndex((row) => row.team.id === state.teamId);
  const teamPos = teamIndex >= 0 ? teamIndex + 1 : table.constructors.length;
  const teamRow = table.constructors[teamIndex];
  const wdc = table.drivers[0];
  const wcc = table.constructors[0];
  const previousYear = currentSeasonYear();
  const nextYear = previousYear + 1;
  const achieved = teamPos <= team.targetCC;
  const historyEntry = {
    year: previousYear,
    teamPosition: teamPos,
    teamPoints: teamRow?.points || 0,
    targetCC: team.targetCC,
    achieved,
    board: Math.round(state.board),
    driverChampion: wdc ? { cn: wdc.driver.cn, teamId: wdc.teamId, points: wdc.points } : null,
    teamChampion: wcc ? { cn: wcc.team.cn, points: wcc.points } : null,
    races: state.races.length
  };
  state.seasonHistory = [...(state.seasonHistory || []), historyEntry];

  // Rival teams renew or replace expiring contracts automatically.
  state.seasonYear = nextYear;
  ensureRivalContracts();

  state.stage = 'offseason';
  state.screen = 'offseason';
  state.route = 'hq';
  state.sponsorId = null;
  state.lineupConfirmed = false;
  state.weekend = null;
  state.marketFilter = 'all';
  state.board = clamp(Math.round((achieved ? 60 : 46) + (state.board - START_CONFIDENCE) * 0.2), 25, 85);
  closeModal();
  saveState();
  render();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function openRenewDriverModal(driverId, term = 2) {
  const driver = DRIVER_MAP[driverId];
  if (!driver || !state.roster.includes(driverId)) return;
  initializeContracts();
  const contractTerm = [1, 2, 3].includes(Number(term)) ? Number(term) : 2;
  const year = currentSeasonYear();
  const currentEnd = contractEndFor(driverId) || (year - 1);
  const expired = currentEnd < year;
  const baseEnd = expired ? year - 1 : currentEnd;
  const newEnd = baseEnd + contractTerm;
  const fee = round1(driver.salary * (0.9 + contractTerm * 0.35) * (expired ? 1 : 1.12));
  const projectedMorale = clamp(moraleFor(driverId) + 3 + contractTerm, 20, 98);
  const canAfford = state.cash >= fee;
  openModal({
    kicker: expired ? 'Contract summit / Expired deal' : 'Contract summit / Extension',
    title: `续约 ${driver.cn}`,
    team: currentTeam(),
    body: `<div class="driver-card sign-profile" style="--accent:${driverColor(driver)}">
      <div class="driver-card-head">${avatarHTML(driver, true)}<div class="driver-name-block"><span class="driver-number">#${driver.num} / ${driver.flag} · ${driverAge(driver)} 岁</span><h3>${driver.cn}</h3><span class="driver-en">${driver.name} · ${expired ? '合同已到期' : `合同至 ${currentEnd}`}</span></div><div class="driver-ovr"><span>OVR</span><b>${developedDriverOvr(driver)}</b></div></div>
    </div>
    <div class="contract-term-picker">
      <div class="modal-subtitle">续约年限</div>
      <div class="term-options">
        ${[1, 2, 3].map((years) => `<button type="button" class="term-option ${contractTerm === years ? 'active' : ''}" data-action="renew-term" data-driver="${driverId}" data-term="${years}">
          <b>${years} 年</b><span>至 ${baseEnd + years}</span><small>${years === 1 ? '短约保持灵活' : years === 2 ? '稳定过渡' : '锁定核心'}</small>
        </button>`).join('')}
      </div>
    </div>
    <div class="sign-summary">
      <div class="confirm-row"><span>原合同</span><b>${expired ? '已到期' : `至 ${currentEnd} 赛季`}</b></div>
      <div class="confirm-row"><span>新合同到期</span><b>${newEnd} 赛季末</b></div>
      <div class="confirm-row"><span>续约签字费</span><b>${money(fee, 2)}</b></div>
      <div class="confirm-row"><span>预计续约后士气</span><b>${projectedMorale} · ${moraleLabel(projectedMorale)}</b></div>
      <div class="confirm-row"><span>续约后预算</span><b class="${canAfford ? 'risk-down' : 'risk-up'}">${money(state.cash - fee, 2)}</b></div>
    </div>
    ${canAfford ? '' : `<p class="sign-warning">预算不足，无法完成续约。</p>`}`,
    actions: [
      { label: '取消', action: 'close-modal' },
      { label: canAfford ? `签下 ${newEnd} 年合同` : '预算不足', action: canAfford ? 'confirm-renew' : 'close-modal', kind: 'btn-primary' }
    ]
  });
  modalData.term = contractTerm;
  modalData.driverId = driverId;
}

function confirmDriverRenewal() {
  const driverId = modalData?.driverId;
  const driver = DRIVER_MAP[driverId];
  if (!driver || !state.roster.includes(driverId)) return;
  const term = [1, 2, 3].includes(Number(modalData?.term)) ? Number(modalData.term) : 2;
  const year = currentSeasonYear();
  const currentEnd = contractEndFor(driverId) || (year - 1);
  const expired = currentEnd < year;
  const newEnd = (expired ? year - 1 : currentEnd) + term;
  const fee = round1(driver.salary * (0.9 + term * 0.35) * (expired ? 1 : 1.12));
  if (state.cash < fee) {
    toast('预算不足，无法完成续约。', 'error');
    return;
  }
  state.cash = round2(state.cash - fee);
  state.signingSpend = round2((state.signingSpend || 0) + fee);
  state.contractEnd[driverId] = newEnd;
  if (!state.morale) state.morale = {};
  state.morale[driverId] = clamp(moraleFor(driverId) + 3 + term, 20, 98);
  closeModal();
  saveState();
  render();
  toast(`${driver.cn} 已续约至 ${newEnd} 赛季末。`, 'success');
}

function startNewSeason() {
  if (state.stage !== 'offseason') return;
  const year = currentSeasonYear();
  const unsigned = state.roster.filter((driverId) => (contractEndFor(driverId) || 0) < year);
  if (state.roster.length !== 2 || unsigned.length) {
    toast(`两位车手都必须拥有有效的 ${year} 或更晚合同。`, 'error');
    return;
  }
  if (!state.sponsorId) {
    toast('请先签下新赛季赞助商。', 'error');
    return;
  }
  ensureRivalContracts();
  ensureDriverFormState();
  state.calendarIds = normalizeCalendarIds(state.calendarIds);
  state.driverAges = state.driverAges || {};
  DRIVERS.forEach((driver) => {
    state.driverAges[driver.id] = clamp(driverAge(driver) + 1, 16, 65);
  });
  DRIVERS.forEach((driver) => {
    const record = state.driverForm[driver.id];
    if (!record) return;
    const age = driverAge(driver);
    const ageBias = age >= 37 ? -0.25 : age <= 23 ? 0.15 : 0;
    const next = clamp(record.value * 0.58 + ageBias + randn() * 0.2, -4, 4);
    record.trend = round1(next - record.value);
    record.value = round1(next);
  });
  state.stage = 'season';
  state.screen = 'game';
  state.route = 'hq';
  state.races = [];
  state.raceIndex = 0;
  state.weekend = null;
  state.lineupConfirmed = true;
  state.setupStep = 0;
  state.marketFilter = 'all';
  state.seasonSponsorResult = null;
  state.simulator = normalizeSimulatorState({ ...(state.simulator || {}), used: 0, weekRound: 0 });
  ensurePlayerMorale();
  saveState();
  render();
  const team = currentTeam();
  const car = currentCarStats();
  openModal({
    kicker: `Season ${year} / Lights out`,
    title: `${year}，重新发车。`,
    team,
    dismissible: false,
    body: `<p>休赛期结束。赛车与研发节点直接延续，车手合同已经确认。新的 ${calendarCount()} 站赛季从现在开始。</p>
      <div class="confirm-points">
        <div class="confirm-row"><span>赛季</span><b>${year}</b></div>
        <div class="confirm-row"><span>赛车综合性能</span><b>${carOvr(car)} / 100</b></div>
        <div class="confirm-row"><span>车手阵容</span><b>${state.roster.map((id) => DRIVER_MAP[id]?.cn).join(' / ')}</b></div>
        <div class="confirm-row"><span>董事会信心</span><b>${Math.round(state.board)} / 100</b></div>
        <div class="confirm-row"><span>赛历</span><b>${calendarSummaryText()}</b></div>
        <div class="confirm-row"><span>揭幕站</span><b>${seasonCalendar()[0]?.gp || '—'} · ${seasonCalendar()[0]?.circuit || ''}</b></div>
      </div>`,
    actions: [
      { label: '前往总部', action: 'close-modal' },
      { label: '进入第一站', action: 'open-weekend', kind: 'btn-team', arrow: true }
    ]
  });
}

function requestResetCareer() {

  });

function slotStageLabel(save) {
  if (!save) return 'EMPTY';
  if (save.stage === 'preseason') return '季前准备';
  if (save.stage === 'offseason') return `${save.seasonYear} 休赛期`;
  if (save.stage === 'end') return `${save.seasonYear} 赛季结束`;
  const total = calendarLengthForSave(save);
  return `第 ${Math.min((save.raceIndex || 0) + 1, total)} / ${total} 站`;
}

function slotStageTag(save) {
  if (save.stage === 'preseason') return 'PRE-SEASON';
  if (save.stage === 'offseason') return 'OFF-SEASON';
  if (save.stage === 'end') return 'SEASON COMPLETE';
  return 'IN SEASON';
}

function saveTimeLabel(timestamp) {
  if (!timestamp) return '旧版存档';
  try {
    return new Intl.DateTimeFormat('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(timestamp));
  } catch (err) {
    return '已保存';
  }
}

/* ---------- pre-season helpers ---------- */
function setupProgressCount() {
  return [state.designConfirmed, state.lineupConfirmed, !!state.sponsorId].filter(Boolean).length;
}

function setupHeaderHTML(step) {
  const team = currentTeam();
  const steps = [
    { n: '01', label: '赛车设计', done: state.designConfirmed },
    { n: '02', label: '车手阵容', done: state.lineupConfirmed },
    { n: '03', label: '商务赞助', done: !!state.sponsorId }
  ];
  return `<header class="setup-top">
    <button type="button" class="brand brand-button" data-action="back-to-landing" aria-label="返回主菜单">${brandMarkup(true)}</button>
    <div class="setup-team-id" style="${teamStyle(team)}">
      ${teamBadge(team)}
      <div><div class="eyebrow no-rule">YOUR TEAM</div><div class="setup-team-name">${team.cn}</div></div>
      <span class="badge team">SLOT ${String(state.slot || 1).padStart(2, '0')}</span>
      <span class="badge">2026</span>
    </div>
    <div class="setup-top-meta">
      <div class="top-stat"><span>可用预算</span><b class="mono">${money(state.cash, 2)}</b></div>
      <div class="top-stat"><span>董事目标</span><b>车队 P${team.targetCC}</b></div>
    </div>
  </header>
  <div class="setup-steps">
    ${steps.map((s, i) => `<button type="button" class="setup-step ${i === step ? 'active' : ''} ${s.done ? 'done' : ''}" data-action="setup-step" data-step="${i}">
      <span class="step-index">${s.done ? icon('check') : s.n}</span>
      <span class="step-copy"><small>Step ${s.n}</small><b>${s.label}</b></span>
      <span class="step-state">${s.done ? '就绪' : i === step ? '进行中' : '待处理'}</span>
    </button>`).join('')}
    <div class="setup-progress-mini"><span>${setupProgressCount()}/3</span><i><b style="width:${(setupProgressCount() / 3) * 100}%"></b></i></div>
  </div>`;
}

function viewSetup() {
  const team = currentTeam();
  if (!team) { state.screen = 'teams'; return viewTeamSelect(); }
  const step = clamp(Number(state.setupStep) || 0, 0, 2);
  let content = '';
  if (step === 0) content = renderDesignStep(team);
  else if (step === 1) content = renderDriversStep(team);
  else content = renderSponsorStep(team);
  return `<main class="screen setup-screen screen-enter" style="${teamStyle(team)}">
    <div class="setup-rail" aria-hidden="true">PRE-SEASON 2026</div>
    <div class="setup-container">
      ${setupHeaderHTML(step)}
      ${content}
      <footer class="setup-foot">
        <span>PADDOCK BOSS / ${team.name.toUpperCase()} / SEASON 2026</span>
        <span><i class="dot" style="color:var(--accent)"></i>SLOT ${String(state.slot || 1).padStart(2, '0')} · 自动保存已开启</span>
      </footer>
    </div>
  </main>`;
}

function renderDesignStep(team) {
  const stats = currentCarStats();
  const ovr = carOvr(stats);
  const used = Object.values(state.allocation).reduce((a, b) => a + b, 0);
  const remaining = DESIGN_POINTS - used;
  const mods = philosophyMods();
  const philosophiyBlock = state.philosophy ? PHILOSOPHIES[state.philosophy] : null;

  const allocRows = Object.keys(CAR_STAT_LABELS).map((key) => {
    const allocated = state.allocation[key] || 0;
    const base = team.base[key];
    const mod = mods[key] || 0;
    return `<div class="alloc-row">
      <div class="alloc-meta">
        <span class="alloc-name">${CAR_STAT_LABELS[key]}<small>${CAR_STAT_SHORT[key]}</small></span>
        <span class="alloc-delta">${mod ? `<i class="${mod > 0 ? 'up' : 'down'}">${mod > 0 ? '+' : ''}${mod}</i>` : ''}${allocated ? `<i class="up">+${allocated}</i>` : ''}</span>
      </div>
      <div class="alloc-control">
        <button type="button" class="alloc-btn" data-action="alloc-point" data-stat="${key}" data-dir="-1" ${allocated <= 0 ? 'disabled' : ''} aria-label="减少${CAR_STAT_LABELS[key]}研发点">${icon('minus')}</button>
        <div class="alloc-bar"><i style="width:${clamp(stats[key], 3, 100)}%"></i><span class="alloc-ticks">${[1,2,3,4].map((n) => `<em class="${n <= allocated ? 'on' : ''}"></em>`).join('')}</span></div>
        <b class="alloc-value">${stats[key]}</b>
        <button type="button" class="alloc-btn" data-action="alloc-point" data-stat="${key}" data-dir="1" ${allocated >= 4 || remaining <= 0 ? 'disabled' : ''} aria-label="增加${CAR_STAT_LABELS[key]}研发点">${icon('plus')}</button>
      </div>
    </div>`;
  }).join('');

  return `<div class="setup-page">
    <div class="setup-page-head">
      <div>
        <div class="eyebrow">Step 01 / New car concept</div>
        <h1>先把赛车，造得像一台冠军。</h1>
        <p>选择设计哲学，把 12 个研发点投向你相信的地方。性能与可靠性的取舍，会在赛道上被放大。</p>
      </div>
      <div class="setup-page-aside">
        <span>董事目标</span>
        <b>${team.goal}</b>
      </div>
    </div>

    <div class="design-layout">
      <article class="panel blueprint-panel">
        <div class="panel-head">
          <span class="panel-title">赛车蓝图预览 <em>2026 REGULATION</em></span>
          <span class="badge">CAR-01</span>
        </div>
        <div class="blueprint-stage">
          <div class="blueprint-grid"></div>
          ${carBlueprintSVG('var(--team)')}
          <div class="blueprint-watermark">PB-26</div>
          <div class="car-ovr-badge"><span>预测综合性能</span><strong>${ovr}</strong><i>/ 100</i></div>
        </div>
        <div class="blueprint-stats">
          ${Object.keys(CAR_STAT_LABELS).map((key) => `<div class="bp-stat">
            <span>${CAR_STAT_SHORT[key]}</span>
            <b>${stats[key]}</b>
            <i><em style="width:${stats[key]}%"></em></i>
          </div>`).join('')}
        </div>
        <div class="note-line">${icon('info')} 数据为模拟评分，实际表现还会受到车手、赛道与策略影响。</div>
      </article>

      <article class="panel design-controls">
        <div class="panel-head">
          <span class="panel-title">设计哲学</span>
          <span class="panel-hint">四选一</span>
        </div>
        <div class="philosophy-grid">
          ${Object.values(PHILOSOPHIES).map((p) => `<button type="button" class="philosophy ${state.philosophy === p.id ? 'active' : ''}" data-action="choose-philosophy" data-philosophy="${p.id}">
            <span class="phil-head"><b>${p.name}</b><small>${p.en}</small></span>
            <span class="phil-desc">${p.desc}</span>
            <span class="phil-note">${p.note}</span>
            <span class="phil-ticks">${Object.entries(p.bonus).map(([k, v]) => `<i class="${v > 0 ? 'up' : 'down'}">${CAR_STAT_SHORT[k]} ${v > 0 ? '+' : ''}${v}</i>`).join('')}</span>
          </button>`).join('')}
        </div>

        <div class="alloc-head">
          <div><span class="panel-title">风洞研发点</span><span class="panel-hint">每点 +1 属性 · 单项最多 4 点</span></div>
          <div class="points-left ${remaining === 0 ? 'empty' : ''}"><b>${remaining}</b><span>剩余</span></div>
        </div>
        <div class="alloc-list">${allocRows}</div>
        <div class="design-confirm-row">
          <button type="button" class="text-btn" data-action="reset-design">重置设计</button>
          <button type="button" class="btn btn-team" data-action="confirm-design" ${(!state.philosophy || remaining > 0) ? 'disabled' : ''}>
            ${state.designConfirmed ? '设计已锁定 · 进入车手阵容' : '锁定设计 · 进入车手阵容'}<span class="arr">→</span>
          </button>
        </div>
        ${(!state.philosophy || remaining > 0) ? `<div class="confirm-hint">${!state.philosophy ? '请选择一种设计哲学' : `还有 ${remaining} 个研发点未分配`}</div>` : ''}
        ${philosophiyBlock ? `<div class="design-summary"><span>设计方向</span><b>${philosophiyBlock.name} / ${philosophiyBlock.en}</b></div>` : ''}
      </article>
    </div>
  </div>`;
}

function driverCardHTML(driver, team, market = false) {
  const isPlayer = state.roster.includes(driver.id);
  const morale = moraleFor(driver.id);
  const moraleClass = morale >= 70 ? 'good' : morale >= 50 ? 'ok' : 'bad';
  const effective = effectiveDriverStats(driver);
  const form = effective?.form ?? 0;
  return `<article class="driver-card ${market ? 'market-driver' : ''}" style="${teamStyle(team)}">
    <div class="driver-card-head">
      ${avatarHTML(driver, true)}
      <div class="driver-name-block">
        <span class="driver-number">#${driver.num} / ${driver.flag}</span>
        <h3>${driver.cn}</h3>
        <span class="driver-en">${driver.name} · ${driverAge(driver)} 岁</span>
        ${formBadgeHTML(form, { compact: true })}
      </div>
      <div class="driver-ovr"><span>OVR</span><b>${effective?.ovr || driver.ovr}</b><small class="ovr-delta ${form >= 0.9 ? 'up' : form <= -0.9 ? 'down' : ''}">${formDeltaText(form)}</small></div>
    </div>
    <div class="driver-attrs">
      ${Object.keys(DRIVER_STAT_LABELS).map((key) => `<div class="driver-attr"><span>${DRIVER_STAT_LABELS[key]}</span><i><em style="width:${effective?.[key] || driver[key]}%"></em></i><b>${effective?.[key] || driver[key]}</b></div>`).join('')}
    </div>
    ${isPlayer ? `<div class="driver-morale-row morale-${moraleClass}">
      <span>士气</span><i><em style="width:${morale}%"></em></i><b>${morale} · ${moraleLabel(morale)}</b>
    </div>
    <div class="driver-form-row">
      <span>状态</span>${formSparkHTML(driver.id)}${formBadgeHTML(form)}
    </div>` : ''}
    <div class="driver-card-foot">
      <div><span>合同薪资 / 站</span><b class="mono">${money(driver.salary, 2)}</b></div>
      <div><span>合同至</span><b class="mono">${contractEndFor(driver.id) || '—'} 赛季</b></div>
      <span class="badge ${isPlayer ? 'ok' : ''}">${isPlayer ? 'RACE DRIVER' : 'TEAM'}</span>
    </div>
  </article>`;
}

function marketRowHTML(driver) {
  const activeTeamId = activeTeamOfDriver(driver.id);
  const activeTeam = activeTeamId ? TEAM_MAP[activeTeamId] : null;
  const color = driverColor(driver);
  const buyout = buyoutFee(driver.id);
  const end = contractEndFor(driver.id);
  const effective = effectiveDriverStats(driver);
  const form = effective?.form ?? 0;
  const marketFormBadge = Math.abs(form) >= 0.3 ? formBadgeHTML(form, { compact: true }) : '';
  return `<button type="button" class="market-row ${activeTeam ? 'is-contracted' : 'is-free'}" style="--c:${color};--c-rgb:${hexToRgb(color)};--row-team:${activeTeam?.color || '#7e8a98'}" data-action="open-sign-driver" data-driver="${driver.id}" aria-label="与${driver.cn}谈判${activeTeam ? `，需要买断费${money(buyout, 2)}` : '，自由身'}">
    <span class="market-row-avatar">${avatarHTML(driver)}</span>
    <span class="market-row-main">
      <span class="market-row-name"><b>${driver.cn}</b><i>${driver.flag}</i><span class="market-club ${activeTeam ? 'contracted' : 'free'}">${activeTeam ? activeTeam.cn : '自由身'}</span>${marketFormBadge}</span>
      <span class="market-row-en">${driver.name} · ${driverAge(driver)} 岁${activeTeam ? ` · 合同至 ${end}` : driver.pastTeam ? ` · 前 ${driver.pastTeam}` : ''}</span>
      <span class="market-row-attrs">速度 ${effective?.pace ?? driver.pace} · 稳定 ${effective?.consistency ?? driver.consistency} · 保胎 ${effective?.tyre ?? driver.tyre} · 雨战 ${effective?.wet ?? driver.wet}</span>
    </span>
    <span class="market-row-ovr"><b>${effective?.ovr ?? driver.ovr}</b><small>OVR</small></span>
    <span class="market-row-side"><b class="mono">${money(driver.salary, 2)}</b><small>每站</small><em>${activeTeam ? `买断 ${money(buyout, 1)}` : '无买断 · 谈判'} →</em></span>
  </button>`;
}

function renderDriversStep(team) {
  const lineup = rosterDrivers();
  initializeContracts();
  ensurePlayerMorale();
  const available = DRIVERS.filter((d) => !state.roster.includes(d.id)).sort((a, b) => developedDriverOvr(b) - developedDriverOvr(a));
  const freeDrivers = available.filter((d) => !activeTeamOfDriver(d.id));
  const contractedDrivers = available.filter((d) => !!activeTeamOfDriver(d.id));
  const filter = ['all', 'free', 'contracted'].includes(state.marketFilter) ? state.marketFilter : 'all';
  const market = filter === 'free' ? freeDrivers : filter === 'contracted' ? contractedDrivers : available;
  const salaries = salarySum();
  const avgMorale = Math.round(lineup.reduce((sum, d) => sum + moraleFor(d.id), 0) / (lineup.length || 1));
  return `<div class="setup-page">
    <div class="setup-page-head">
      <div>
        <div class="eyebrow">Step 02 / Driver line-up</div>
        <h1>两个座位，两种性格。</h1>
        <p>22 位正选与近五年正式车手。合同在身需买断，替换席位需解约；年限与士气决定长期成本。</p>
      </div>
      <div class="setup-page-aside">
        <span>车手薪资支出</span>
        <b class="mono">${money(salaries, 2)} <small>/ 站</small></b>
        <span style="margin-top:8px;display:block;color:var(--ink-faint)">可谈判 ${available.length} 人 · 自由身 ${freeDrivers.length} 人</span>
      </div>
    </div>

    <div class="drivers-layout">
      <article class="panel lineup-panel">
        <div class="panel-head">
          <span class="panel-title">你的阵容 <em>RACE DRIVERS</em></span>
          <span class="badge ${state.lineupConfirmed ? 'ok' : ''}">${state.lineupConfirmed ? '已确认' : '待确认'}</span>
        </div>
        <div class="lineup-list">
          ${lineup.map((driver, i) => `<div class="lineup-slot">
            <div class="slot-label"><span>CAR #${i + 1}</span><i>${i === 0 ? '1号车手' : '2号车手'}</i></div>
            ${driverCardHTML(driver, team)}
          </div>`).join('')}
        </div>
        <div class="lineup-summary">
          <div><span>阵容综合评定</span><b>${Math.round(lineup.reduce((a, d) => a + effectiveDriverOvr(d), 0) / (lineup.length || 1))}</b></div>
          <div><span>薪资合计</span><b class="mono">${money(salaries, 2)} / 站</b></div>
          <div><span>阵容士气</span><b>${avgMorale} · ${moraleLabel(avgMorale)}</b></div>
          <button type="button" class="btn ${state.lineupConfirmed ? 'btn-outline' : 'btn-team'}" data-action="confirm-lineup" ${state.lineupConfirmed ? 'disabled' : ''}>${state.lineupConfirmed ? '阵容已确认' : '确认现有阵容'}${state.lineupConfirmed ? '' : '<span class="arr">→</span>'}</button>
        </div>
      </article>

      <section class="panel market-panel">
        <div class="panel-head">
          <span class="panel-title">车手市场 <em>DRIVERS ${DRIVER_POOL_YEARS}</em></span>
          <span class="badge warn">赛季开始后冻结</span>
        </div>
        <div class="market-headline">
          <p>自由身只需签约费；合同在身需买断，替换席位另付解约金。</p>
          <div class="market-filter"><span>按 OVR 排序</span><b>${market.length} 位显示</b></div>
        </div>
        <div class="market-tabs">
          <button type="button" class="market-tab ${filter === 'all' ? 'active' : ''}" data-action="market-filter" data-filter="all">全部 <b>${available.length}</b></button>
          <button type="button" class="market-tab ${filter === 'free' ? 'active' : ''}" data-action="market-filter" data-filter="free">自由身 <b>${freeDrivers.length}</b></button>
          <button type="button" class="market-tab ${filter === 'contracted' ? 'active' : ''}" data-action="market-filter" data-filter="contracted">合同在身 <b>${contractedDrivers.length}</b></button>
        </div>
        <div class="market-list">
          ${market.length ? market.map((d) => marketRowHTML(d)).join('') : `<div class="empty-state">该筛选下没有可用车手。</div>`}
        </div>
        <details class="fold fold-mini market-rules-fold">
          <summary>市场规则与士气影响 <span class="fold-arrow">›</span></summary>
          <div class="fold-body">市场覆盖 ${DRIVER_POOL_YEARS} 共 ${DRIVERS.length} 位正式出赛车手。签约费、买断费与解约金一次性扣除。士气高于 70 会提升有效评分，低于 50 会拖慢排位与正赛表现；车手状态每站还会动态浮动。</div>
        </details>
        ${state.lineupConfirmed ? `<div class="next-row"><button type="button" class="btn btn-team" data-action="setup-step" data-step="2">继续 · 商务合作<span class="arr">→</span></button></div>` : ''}
      </section>
    </div>
  </div>`;
}

function scheduleMatchesSearch(track) {
  const query = String(state.scheduleSearch || '').trim().toLowerCase();
  if (!query) return true;
  return [track.gp, track.circuit, track.city, track.country, track.era || '', track.desc || '']
    .join(' ')
    .toLowerCase()
    .includes(query);
}

function scheduleDraftTracks() {
  return (state.scheduleDraft || []).map((id) => TRACK_MAP[id]).filter(Boolean);
}

function scheduleOptionHTML(track) {
  const draft = state.scheduleDraft || [];
  const picked = draft.includes(track.id);
  const full = draft.length >= TRACKS.length;
  const disabled = picked || full;
  return `<button type="button" class="schedule-option ${picked ? 'is-picked' : ''} ${track.legacy ? 'is-classic' : ''}"
    data-action="schedule-add" data-track="${track.id}" ${disabled ? 'disabled' : ''}
    title="${picked ? '已加入赛历' : full ? '赛历已满 ${TRACKS.length} 站' : '加入赛历'}">
    <span class="schedule-option-map">${circuitSVG(track, { thick: 8, stroke: 1.7, opacity: '.82' })}</span>
    <span class="schedule-option-copy">
      <b>${track.gp}</b>
      <small>${track.circuit} · ${track.country}</small>
      <em>${track.lengthKm.toFixed(3)} KM · ${track.laps} 圈 · ${track.legacy ? track.era : 'CURRENT'}</em>
    </span>
    <span class="schedule-option-add">${picked ? icon('check') : icon('plus')}</span>
  </button>`;
}

function scheduleGroupHTML(title, subtitle, tracks) {
  if (!tracks.length) return '';
  return `<section class="schedule-group">
    <div class="schedule-group-head"><span>${title}</span><small>${subtitle}</small><b>${tracks.length}</b></div>
    <div class="schedule-group-grid">${tracks.map((track) => scheduleOptionHTML(track)).join('')}</div>
  </section>`;
}

function scheduleAvailableHTML() {
  const current = TRACKS.filter((track) => scheduleMatchesSearch(track));
  const classic = HISTORIC_TRACKS.filter((track) => scheduleMatchesSearch(track));
  if (!current.length && !classic.length) {
    return `<div class="schedule-empty">没有匹配的赛道。试试其他关键词。</div>`;
  }
  return `${scheduleGroupHTML('现役赛历', `OFFICIAL / ${TRACKS.length}`, current)}${scheduleGroupHTML('经典赛道', `HISTORIC / ${HISTORIC_TRACKS.length}`, classic)}`;
}

function scheduleSelectedHTML() {
  const tracks = scheduleDraftTracks();
  if (!tracks.length) {
    return `<div class="schedule-empty schedule-selected-empty">还没有选择赛道。<br>从左侧加入赛道，或使用「补满」生成一套完整赛历。</div>`;
  }
  return tracks.map((track, index) => `<div class="schedule-selected-row ${track.legacy ? 'is-classic' : ''}">
    <span class="ssr-round">${String(index + 1).padStart(2, '0')}</span>
    <span class="ssr-main">
      <b>${track.gp}</b>
      <small>${track.circuit} · ${track.country}${track.legacy ? ` · ${track.era}` : ''}</small>
    </span>
    <span class="ssr-actions">
      <button type="button" data-action="schedule-move" data-index="${index}" data-dir="-1" title="上移" ${index === 0 ? 'disabled' : ''}>↑</button>
      <button type="button" data-action="schedule-move" data-index="${index}" data-dir="1" title="下移" ${index === tracks.length - 1 ? 'disabled' : ''}>↓</button>
      <button type="button" class="ssr-remove" data-action="schedule-remove" data-index="${index}" title="移除">×</button>
    </span>
  </div>`).join('');
}

function scheduleEditorHTML() {
  const count = (state.scheduleDraft || []).length;
  return `<div class="schedule-editor">
    <section class="schedule-pool">
      <div class="schedule-pool-head">
        <div class="schedule-search">
          ${icon('search')}
          <input id="schedule-search" type="search" autocomplete="off" placeholder="搜索赛道、城市或国家" value="${escapeHTML(state.scheduleSearch || '')}">
        </div>
        <span class="badge">${TRACK_POOL.length} 条可选</span>
      </div>
      <div class="schedule-pool-scroll" id="schedule-available">${scheduleAvailableHTML()}</div>
    </section>

          <button type="button" data-action="schedule-reset">标准</button>
          <button type="button" data-action="schedule-auto">补满</button>
          <button type="button" data-action="schedule-clear">清空</button>
        </div>
      </div>
      <div class="schedule-selected-scroll">${scheduleSelectedHTML()}</div>
      <div class="schedule-selected-note">顺序即赛季顺序。可少于 ${TRACKS.length} 站，但不能超过 ${TRACKS.length} 站；赛季开始后赛历锁定。经典赛道数据与轮廓为玩法示意。</div>
    </aside>
  </div>`;
}

function scheduleActions() {
  const count = (state.scheduleDraft || []).length;
  return [
    { label: '取消', action: 'close-modal' },
    { label: count ? `保存赛历 · ${count} 站` : '至少选择 1 站', action: 'schedule-confirm', kind: 'btn-primary', arrow: false, attrs: count ? '' : 'disabled' }
  ];
}

function openScheduleEditor() {
  if (!calendarEditable()) {
    toast(state.stage === 'offseason' ? '请先处理休赛期，再调整下赛季赛历。' : '赛季已经开始，赛历只能在季前或休赛期修改。', 'error');
    return;
  }
  state.scheduleDraft = normalizeCalendarIds(state.calendarIds).slice();
  state.scheduleSearch = '';
  openModal({
    kicker: 'Season calendar / Build your own',
    title: '把经典赛道，带回赛历。',
    team: currentTeam(),
    size: 'xl',
    dismissible: true,
    body: scheduleEditorHTML(),
    actions: scheduleActions()
  });
}

function refreshScheduleEditor(options = {}) {
  if (!modalData) return;
  const pool = document.querySelector('.schedule-pool-scroll');
  const selected = document.querySelector('.schedule-selected-scroll');
  const poolTop = pool ? pool.scrollTop : 0;
  const selectedTop = options.selectedToEnd && selected ? selected.scrollHeight : selected ? selected.scrollTop : 0;
  modalData.body = scheduleEditorHTML();
  modalData.actions = scheduleActions();
  const modal = document.querySelector('#modal-root .modal');
  if (!modal) {
    renderModal();
    return;
  }
  const body = modal.querySelector('.modal-body');
  const actions = modal.querySelector('.modal-actions');
  if (body) body.innerHTML = modalData.body;
  if (actions) actions.innerHTML = modalActionsHTML(modalData.actions);
  const nextPool = document.querySelector('.schedule-pool-scroll');
  const nextSelected = document.querySelector('.schedule-selected-scroll');
  if (nextPool) nextPool.scrollTop = poolTop;
  if (nextSelected) nextSelected.scrollTop = selectedTop;
}

function updateScheduleAvailable() {
  const root = document.getElementById('schedule-available');
  if (root) root.innerHTML = scheduleAvailableHTML();
}

function scheduleAdd(trackId) {
  if (!modalData || !state.scheduleDraft) return;
  if (!TRACK_MAP[trackId] || state.scheduleDraft.includes(trackId)) return;
  if (state.scheduleDraft.length >= TRACKS.length) {
    toast(`最多只能选择 ${TRACKS.length} 站。`, 'error');
    return;
  }
  state.scheduleDraft.push(trackId);
  refreshScheduleEditor({ selectedToEnd: true });
}

function scheduleRemove(index) {
  if (!modalData || !state.scheduleDraft) return;
  state.scheduleDraft.splice(index, 1);
  refreshScheduleEditor();
}

function scheduleMove(index, dir) {
  if (!modalData || !state.scheduleDraft) return;
  const next = index + dir;
  if (index < 0 || next < 0 || index >= state.scheduleDraft.length || next >= state.scheduleDraft.length) return;
  const [id] = state.scheduleDraft.splice(index, 1);
  state.scheduleDraft.splice(next, 0, id);
  refreshScheduleEditor();
}

function scheduleResetDefault() {
  if (!modalData) return;
  state.scheduleDraft = defaultCalendarIds();
  state.scheduleSearch = '';
  refreshScheduleEditor();
}

function scheduleAutoFill() {
  if (!modalData) return;
  state.scheduleDraft = state.scheduleDraft || [];
  TRACKS.forEach((track) => {
    if (state.scheduleDraft.length >= TRACKS.length) return;
    if (!state.scheduleDraft.includes(track.id)) state.scheduleDraft.push(track.id);
  });
  refreshScheduleEditor({ selectedToEnd: true });
}

function scheduleClear() {
  if (!modalData) return;
  state.scheduleDraft = [];
  refreshScheduleEditor();
}

function scheduleConfirm() {
  if (!modalData) return;
  if (!calendarEditable()) {
    toast('赛季进行中，赛历已经锁定。', 'error');
    return;
  }
  const rawDraft = state.scheduleDraft || [];
  if (!rawDraft.length) {
    toast('至少选择 1 条赛道。', 'error');
    return;
  }
  const draft = normalizeCalendarIds(rawDraft);
  state.calendarIds = draft;
  if (state.stage !== 'offseason') {
    state.raceIndex = 0;
    state.weekend = null;
  }
  state.scheduleDraft = null;
  state.scheduleSearch = '';
  closeModal();
  saveState();
  render();
  toast(`赛历已确认：${draft.length} 站 · ${state.calendarIds.map((id) => TRACK_MAP[id]?.gp).slice(0, 2).join(' / ')}${draft.length > 2 ? ' / …' : ''}`, 'success');
}

function rndNodeHTML(node) {
  const completed = (state.upgradeNodes || []).includes(node.id);
  const isActive = state.activeUpgrade?.nodeId === node.id;
  const prereqMet = nodePrereqsMet(node);
  const otherActive = !!state.activeUpgrade && !isActive;
  const cost = upgradeNodeCost(node);
  const affordable = state.cash >= cost;
  const canStart = !completed && !isActive && !otherActive && prereqMet && affordable;
  let label = '立项 · ' + money(cost, 1);
  if (completed) label = '已交付';
  else if (isActive) label = `研发中 · ${state.activeUpgrade.roundsLeft} 站后交付`;
  else if (!prereqMet) label = '前置节点未完成';
  else if (otherActive) label = '研发线占用中';
  else if (!affordable) label = '预算不足';
  const riskClass = node.riskDelta > 0 ? 'risk-up' : node.riskDelta < 0 ? 'risk-down' : '';
  const branch = RND_BRANCH_MAP[node.branch];
  return `<article class="tree-node ${completed ? 'is-completed' : ''} ${isActive ? 'is-active' : ''} ${!prereqMet && !completed ? 'is-locked' : ''}">
    <div class="node-top">
      <span class="node-tier" style="--branch:${branch.color}">T${node.tier}</span>
      <span class="node-state">${completed ? '已交付' : isActive ? '研发中' : prereqMet ? '可研发' : '未解锁'}</span>
    </div>
    <h4>${node.name}<em>${node.en}</em></h4>
    <p class="node-desc" title="${node.desc}">${node.desc}</p>
    <div class="node-effects">
      ${Object.entries(node.effects).map(([key, value]) => `<span>${CAR_STAT_LABELS[key]} <b>+${value}</b></span>`).join('')}
    </div>
    <div class="node-meta">
      <div><span>成本</span><b class="mono">${money(cost, 1)}</b></div>
      <div><span>周期</span><b>${node.rounds} 站</b></div>
      <div><span>开发风险</span><b class="${node.devRisk >= 0.1 ? 'risk-up' : node.devRisk >= 0.06 ? 'risk-mid' : ''}">${Math.round(node.devRisk * 100)}%</b></div>
      <div><span>可靠性风险</span><b class="${riskClass}">${node.riskDelta > 0 ? '+' : ''}${node.riskDelta.toFixed(1)}%</b></div>
    </div>
    ${isActive ? `<div class="node-progress"><i style="width:${((node.rounds - state.activeUpgrade.roundsLeft) / node.rounds) * 100}%"></i></div>` : ''}
    ${!prereqMet && !completed ? `<div class="node-requires">前置：${node.requires.map((id) => RND_NODE_MAP[id]?.name).filter(Boolean).join(' + ')}</div>` : ''}
    <button type="button" class="btn btn-sm ${completed ? 'btn-outline' : canStart ? 'btn-outline' : 'btn-ghost'} node-btn" data-action="buy-upgrade" data-upgrade="${node.id}" ${canStart ? '' : 'disabled'}>${label}</button>
  </article>`;
}

  return state.races.find((race) => race.roundIndex === roundIndex) || null;
}

    if (result) {
      const winRow = result.rows.find((row) => row.position === 1);

/* ============================================================
   RACE RESULT ARCHIVE
   ============================================================ */
function openRaceResultModal(roundIndex) {
  const result = findRaceResult(Number(roundIndex));
  if (!result) {
    toast('这场比赛还没有可查看的结果。', 'error');
    return;
  }
  const track = activeTrackById(result.trackId) || seasonCalendar().find((item) => item.id === result.trackId) || nextTrack();
  const roundNo = track?.round || (Number(result.roundIndex) + 1);
  const rows = (result.rows || []).slice().sort((a, b) => {
    if (a.dnf && b.dnf) return String(a.driverId).localeCompare(String(b.driverId));
    if (a.dnf) return 1;
    if (b.dnf) return -1;
    return (a.position || 99) - (b.position || 99);
  });
  if (!rows.length) {
    openModal({
      kicker: `ROUND ${String(roundNo).padStart(2, '0')} / FINAL CLASSIFICATION`,
      title: `${track.gp} · 车手排名`,
      team: currentTeam(),
      body: '<p>这场比赛没有可用的排名记录。</p>',
      actions: [{ label: '关闭', action: 'close-modal', kind: 'btn-primary' }]
    });
    return;
  }
  const winnerRow = rows.find((row) => row.position === 1);
  const winner = winnerRow ? DRIVER_MAP[winnerRow.driverId] : null;
  const winnerTeam = winnerRow ? TEAM_MAP[winnerRow.teamId] : null;
  const fastestRow = rows
    .filter((row) => Number.isFinite(row.bestLap))
    .sort((a, b) => a.bestLap - b.bestLap)[0];
  const fastestDriver = fastestRow ? DRIVER_MAP[fastestRow.driverId] : null;
  const playerRows = rows.filter((row) => row.teamId === state.teamId);
  const playerFinished = playerRows.filter((row) => !row.dnf && row.position);
  const playerBest = playerFinished.length ? Math.min(...playerFinished.map((row) => row.position)) : null;
  const playerPoints = playerRows.reduce((sum, row) => sum + (row.points || 0), 0);
  const finishedCount = rows.filter((row) => !row.dnf).length;
  const dnfCount = rows.length - finishedCount;

  const tableRows = rows.map((row) => {
    const driver = DRIVER_MAP[row.driverId];

/* ============================================================
   PRACTICE + SEGMENTED QUALIFYING
   ============================================================ */
function practiceProgram(id) {
  return PRACTICE_PROGRAMS.find((program) => program.id === id) || PRACTICE_PROGRAMS[0];
}

function practiceReady(weekend) {
  return !!weekend?.practice && weekend.practice.sessions.filter((s) => !s.skipped).length >= 3;
}

function practiceCompleted(weekend) {
  return !!weekend?.practice && weekend.practice.sessions.length >= 3;
}

function practiceTimesForPlayer(track, weekend, focus) {
  const weather = ensureWeekendWeather(weekend, track);
  const water = clamp(Number(weather.startWater) || 0, 0, 100);
  const rain = clamp(Number(weather.startRain) || 0, 0, 1);
  const wet = water >= WET_SURFACE_THRESHOLD;
  return state.roster.map((driverId) => {
    const driver = DRIVER_MAP[driverId];
    const score = combinedScore(state.teamId, driver, track, wet);
    const sessionCount = weekend.practice.sessions.length;
    const focusOffset = focus.id === 'quali' ? -0.28 : focus.id === 'tyre' ? 0.55 : 0.04;
    const time = track.baseLap + 0.75 + surfacePaceOffset(water, rain) * 2.4 + (100 - score) * 0.083 - sessionCount * 0.10 + focusOffset + randn() * 0.20;
    return { driverId, time: round2(time) };
  });
}

function applyPracticeSession(sessionIndex, focusId, skipped = false) {
  const weekend = state.weekend;
  if (!weekend) return { ok: false, message: '比赛周末尚未生成。' };
  if (practiceCompleted(weekend)) return { ok: false, message: '练习赛已经全部结束。' };
  if (sessionIndex !== weekend.practice.sessions.length) return { ok: false, message: '请按顺序完成练习赛。' };
  const track = activeTrackById(weekend.trackId) || nextTrack();
  if (skipped) {
    weekend.practice.sessions.push({ session: sessionIndex + 1, skipped: true, programId: null, gain: 0 });
    return { ok: true };
  }
  const focus = practiceProgram(focusId);
  const times = practiceTimesForPlayer(track, weekend, focus);
  weekend.prep[focus.stat] = Math.min(PREP_MAX, (weekend.prep[focus.stat] || 0) + focus.gain);
  const messageMap = {
    setup: '前后轴平衡进入窗口，车手对入弯稳定性的反馈明显改善。',
    tyre: '长距离模拟显示后轮退化低于预期，正赛窗口更可控。',
    quali: '低油量模拟完成，软胎第一圈的温度窗口已经找到。'
  };
  weekend.practice.sessions.push({
    session: sessionIndex + 1,
    programId: focus.id,
    name: focus.name,
    stat: focus.stat,
    gain: focus.gain,
    times,
    message: messageMap[focus.id],
    skipped: false
  });
  return { ok: true };
}

function saveAndRenderWeekend() {
  saveState();
  render({ preserveScroll: true });
}

function runPracticeSession(sessionIndex, focusId) {
  const result = applyPracticeSession(sessionIndex, focusId);
  if (!result.ok) {
    toast(result.message, 'error');
    return;
  }
  const weekend = state.weekend;
  if (practiceCompleted(weekend)) toast('练习赛完成，准备进入排位赛。', 'success');
  saveAndRenderWeekend();
}

function autoCompletePractice() {
  const weekend = state.weekend;
  if (!weekend) return;
  const cycle = ['setup', 'tyre', 'quali'];
  while (!practiceCompleted(weekend)) {
    const index = weekend.practice.sessions.length;
    const result = applyPracticeSession(index, cycle[index % cycle.length]);
    if (!result.ok) break;
  }
  saveAndRenderWeekend();
  toast('剩余练习赛已由工程师团队完成。', 'success');
}

function skipPracticeWeekend() {
  const weekend = state.weekend;
  if (!weekend) return;
  while (!practiceCompleted(weekend)) {
    applyPracticeSession(weekend.practice.sessions.length, 'setup', true);
  }
  saveAndRenderWeekend();
  toast('已跳过练习赛，未获得准备度增益。');
}

function buildQualiEntrants(track, weekend) {
  const entrants = [];
  const weather = ensureWeekendWeather(weekend, track);
  const wet = (weather.startWater || 0) >= WET_SURFACE_THRESHOLD || (weather.startRain || 0) > 0.04;
  TEAMS.forEach((team) => {
    effectiveLineup(team.id).forEach((driverId) => {
      const driver = DRIVER_MAP[driverId];
      if (!driver) return;
      const score = combinedScore(team.id, driver, track, wet);
      entrants.push({
        driverId,
        teamId: team.id,
        driver,
        score,
        isPlayer: team.id === state.teamId
      });
    });
  });
  return entrants;
}

function simulateQualiSegment(weekend, track, stageIndex) {
  const weather = ensureWeekendWeather(weekend, track);
  const water = clamp(Number(weather.startWater) || 0, 0, 100);
  const rain = clamp(Number(weather.startRain) || 0, 0, 1);
  const allEntrants = buildQualiEntrants(track, weekend);
  let pool = allEntrants;
  if (stageIndex > 0) {
    const previous = weekend.qualiSegments[stageIndex - 1];
    const advancing = new Set(previous.entrants.filter((entry) => !entry.eliminated).map((entry) => entry.driverId));
    pool = allEntrants.filter((entry) => advancing.has(entry.driverId));
  }
  const evolution = stageIndex === 0 ? 0 : stageIndex === 1 ? -0.11 : -0.28;
  const results = pool.map((entry) => {
    const effective = effectiveDriverStats(entry.driver);
    const noise = randn() * (0.10 + (100 - (effective?.consistency || entry.driver.consistency)) * 0.0022);
    const playerPrep = entry.isPlayer ? (weekend.prep.quali || 0) * 0.006 : 0;
    const time = track.baseLap - 1.55 + surfacePaceOffset(water, rain) * 2.35 + (100 - entry.score) * 0.082 + evolution + noise - playerPrep;
    return { driverId: entry.driverId, teamId: entry.teamId, driver: entry.driver, isPlayer: entry.isPlayer, time: round2(time) };
  }).sort((a, b) => a.time - b.time);
  const best = results[0]?.time || 0;
  const advanceCount = stageIndex === 0 ? 16 : stageIndex === 1 ? 10 : 10;
  results.forEach((entry, i) => {
    entry.position = i + 1;
    entry.gap = round2(entry.time - best);
    entry.eliminated = stageIndex < 2 ? i >= advanceCount : false;
  });
  const eliminatedIds = results.filter((entry) => entry.eliminated).map((entry) => entry.driverId);
  return {
    stage: stageIndex,
    name: `Q${stageIndex + 1}`,
    entrants: results,
    advanceCount,
    eliminatedIds,
    pole: results[0] || null
  };
}

function finalizeQualification(weekend) {
  const [q1, q2, q3] = weekend.qualiSegments;
  if (!q1 || !q2 || !q3) return;
  const q3Order = q3.entrants.slice().sort((a, b) => a.time - b.time);
  const q2Eliminated = q2.entrants.filter((entry) => entry.eliminated).sort((a, b) => a.time - b.time);
  const q1Eliminated = q1.entrants.filter((entry) => entry.eliminated).sort((a, b) => a.time - b.time);
  const combined = [
    ...q3Order.map((entry) => ({ ...entry, segment: 'Q3' })),
    ...q2Eliminated.map((entry) => ({ ...entry, segment: 'Q2' })),
    ...q1Eliminated.map((entry) => ({ ...entry, segment: 'Q1' }))
  ];
  const poleTime = q3Order[0]?.time || 0;
  weekend.quali = combined.map((entry, i) => ({
    driverId: entry.driverId,
    teamId: entry.teamId,
    position: i + 1,
    time: entry.time,
    gap: round2(Math.max(0, entry.time - poleTime)),
    segment: entry.segment
  }));
}

/* ---------- live qualifying ---------- */
const QUALI_SESSION_SECONDS = [18 * 60, 15 * 60, 13 * 60];
const QUALI_TICK_MS = 120;
let liveQuali = null;

function formatSessionClock(seconds) {
  const total = Math.max(0, Math.ceil(seconds));
  const minutes = Math.floor(total / 60);
  const secs = total % 60;
  return `${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function buildLiveQualiSession(weekend, track, stageIndex) {
  const finalSegment = simulateQualiSegment(weekend, track, stageIndex);
  const duration = QUALI_SESSION_SECONDS[stageIndex];
  const entries = finalSegment.entrants.map((entry, index) => ({
    driverId: entry.driverId,
    teamId: entry.teamId,
    driver: entry.driver,
    isPlayer: entry.isPlayer,
    finalTime: entry.time,
    bestTime: null,
    lastLap: null,
    laps: 0,
    seed: index
  }));
  const entryMap = new Map(entries.map((entry) => [entry.driverId, entry]));
  const attempts = [];
  finalSegment.entrants.forEach((finalEntry, index) => {
    const count = 3 + (index % 4 === 0 ? 1 : 0);
    for (let attempt = 0; attempt < count; attempt += 1) {
      const fraction = clamp(0.07 + (attempt / count) * 0.74 + (index % 7) * 0.022 + Math.random() * 0.06, 0.04, 0.95);
      const improvement = attempt === count - 1 ? 0 : (count - 1 - attempt) * (0.24 + Math.random() * 0.34);
      attempts.push({
        at: fraction * duration,
        driverId: finalEntry.driverId,
        time: round2(finalEntry.time + improvement),
        lap: attempt + 1
      });
    }
  });
  attempts.sort((a, b) => a.at - b.at);
  return {
    track,
    weekend,
    stageIndex,
    stageName: `Q${stageIndex + 1}`,
    duration,
    elapsed: 0,
    speed: [1, 2, 4, 8, 16].includes(Number(state.simSpeed)) ? Number(state.simSpeed) : 1,
    paused: false,
    finished: false,
    entries,
    entryMap,
    attempts,
    nextAttempt: 0,
    finalSegment,
    feed: [],
    timer: null,
    lastTick: 0,
    advanceCount: stageIndex === 0 ? 16 : 10
  };
}

function qualiLiveStandings() {
  if (!liveQuali) return [];
  return liveQuali.entries.slice().sort((a, b) => {
    if (a.bestTime == null && b.bestTime == null) return a.seed - b.seed;
    if (a.bestTime == null) return 1;
    if (b.bestTime == null) return -1;
    return a.bestTime - b.bestTime;
  });
}

  const weekend = state.weekend;
  if (!weekend) return;
  if (!practiceCompleted(weekend)) {
    toast('请先完成练习赛。', 'error');

  if (weekend.qualiStage >= 3) return;

function restartQualiTimer() {
  if (!liveQuali) return;
  if (liveQuali.timer) clearInterval(liveQuali.timer);
  liveQuali.lastTick = performance.now();
  liveQuali.timer = setInterval(qualiTick, QUALI_TICK_MS);
}

function qualiTick() {
  if (!liveQuali) return;
  const now = performance.now();
  const dt = clamp((now - (liveQuali.lastTick || now)) / 1000, 0, 2);
  liveQuali.lastTick = now;
  if (liveQuali.finished) return;
  if (liveQuali.paused) return;
  liveQuali.elapsed += dt * (liveQuali.speed || 1);
  let attemptsHappened = false;
  while (liveQuali.nextAttempt < liveQuali.attempts.length && liveQuali.attempts[liveQuali.nextAttempt].at <= liveQuali.elapsed) {
    const attempt = liveQuali.attempts[liveQuali.nextAttempt];
    const entry = liveQuali.entryMap.get(attempt.driverId);
    if (entry) {
      entry.laps += 1;
      entry.lastLap = attempt.time;
      const improved = entry.bestTime == null || attempt.time < entry.bestTime;
      entry.bestTime = entry.bestTime == null ? attempt.time : Math.min(entry.bestTime, attempt.time);
      liveQuali.feed.unshift({ at: liveQuali.elapsed, name: entry.driver.cn, time: attempt.time, improved });
      liveQuali.feed = liveQuali.feed.slice(0, 12);
    }
    liveQuali.nextAttempt += 1;
    attemptsHappened = true;
  }
  if (attemptsHappened) renderQualiLiveUI();
  else {
    const clock = document.getElementById('quali-clock');
    if (clock) clock.textContent = formatSessionClock(liveQuali.duration - liveQuali.elapsed);
    const fill = document.getElementById('quali-progress-fill');
    if (fill) fill.style.width = `${clamp((liveQuali.elapsed / liveQuali.duration) * 100, 0, 100)}%`;
  }
  if (liveQuali.elapsed >= liveQuali.duration) completeLiveQuali(false);
}

function toggleQualiPause() {

function setQualiSpeed(speed) {
  if (!liveQuali || liveQuali.finished) return;
  if (![1, 2, 4, 8, 16].includes(Number(speed))) return;
  liveQuali.speed = Number(speed);
  state.simSpeed = liveQuali.speed;
  document.querySelectorAll('#quali-layer .race-speed-btn').forEach((btn) => btn.classList.toggle('active', Number(btn.dataset.speed) === liveQuali.speed));
  renderQualiLiveUI();
}

function completeLiveQuali(skipped) {
  if (!liveQuali || liveQuali.finished) return;
  liveQuali.finished = true;
  if (liveQuali.timer) clearInterval(liveQuali.timer);
  liveQuali.timer = null;
  const session = liveQuali;
  const weekend = state.weekend;
  if (weekend && weekend.qualiStage === session.stageIndex) {
    weekend.qualiSegments.push(session.finalSegment);
    weekend.qualiStage += 1;
    if (weekend.qualiStage >= 3) finalizeQualification(weekend);
    saveState();
  }
  const layer = document.getElementById('quali-layer');
  if (layer) layer.remove();
  document.body.classList.remove('quali-open');
  liveQuali = null;
  render({ preserveScroll: true });
  toast(`${session.stageName} ${skipped ? '已快速完成' : '完成'}。${weekend && weekend.qualiStage >= 3 ? '发车格已锁定。' : '下一节等待开始。'}`, 'success');
}

function autoCompleteQualifying() {

function recommendedStartTyre(track, wet) {
  const weather = state.weekend?.weather;
  const water = weather?.startWater ?? (wet ? 42 : 0);
  const rain = weather?.startRain ?? (wet ? 0.3 : 0);
  return recommendedTyreForWater(water, track?.laps || 50, track, rain);
}

function recommendedStops(track, wet) {
  if (wet) return 1;
  return track.tyre > 0.7 ? 2 : 1;
}

const STRATEGY_MODEL_VERSION = 3;

function defaultStrategyForDriver(driver, track, wet, weekend = state.weekend) {
  const recommendation = engineerRecommendation(driver, track, wet, weekend);
  return {
    startTyre: recommendation.startTyre,
    stops: recommendation.stops,
    windowKey: recommendation.windowKey,
    mode: recommendation.mode
  };
}

function ensureWeekendStrategies(weekend, track, wet, recommendations = null, options = {}) {
  if (!weekend.strategies || typeof weekend.strategies !== 'object') weekend.strategies = {};
  const refresh = options.refresh !== false && weekend.strategyModelVersion !== STRATEGY_MODEL_VERSION && !weekend.strategyEdited;
  const missing = state.roster.some((driverId) => DRIVER_MAP[driverId] && !weekend.strategies[driverId]);
  if (!refresh && !missing) return weekend.strategies;
  const players = state.roster.map((driverId) => DRIVER_MAP[driverId]).filter(Boolean);
  const recs = recommendations || teamStrategyRecommendations(players, track, wet, weekend);
  let touched = false;
  state.roster.forEach((driverId) => {
    const driver = DRIVER_MAP[driverId];
    if (!driver) return;
    const recommendation = recs[driverId];
    if (!recommendation) return;
    if (refresh || !weekend.strategies[driverId]) {
      weekend.strategies[driverId] = {
        startTyre: recommendation.startTyre,
        stops: recommendation.stops,
        windowKey: recommendation.windowKey,
        mode: recommendation.mode
      };
      touched = true;
    }
  });
  if (touched) weekend.strategyModelVersion = STRATEGY_MODEL_VERSION;
  return weekend.strategies;
}


function strategyPlanText(strategy) {
  const tyre = TYRES[strategy?.startTyre] || TYRES.medium;
  const mode = strategy?.mode === 'push' ? '冲刺' : strategy?.mode === 'conserve' ? '保胎' : '平衡';
  if (Number(strategy?.stops) === 0) return `${tyre.short} · 0停 · ${mode}`;
  const windowLabel = strategy?.windowKey === 'early' ? '提前' : strategy?.windowKey === 'late' ? '推迟' : '标准';
  return `${tyre.short} · ${strategy?.stops || 1}停 · ${windowLabel} · ${mode}`;
}

function applyEngineerPlan(driverId) {
  if (!state.weekend) return;
  const track = activeTrackById(state.weekend.trackId) || nextTrack();
  const driver = DRIVER_MAP[driverId];
  if (!driver) return;
  const players = state.roster.map((id) => DRIVER_MAP[id]).filter(Boolean);
  const recommendations = teamStrategyRecommendations(players, track, !!state.weekend.wet, state.weekend);
  const recommendation = recommendations[driverId];
  if (!recommendation) return;
  switchStrategyTab(driverId);
  const card = document.querySelector(`[data-strategy-driver="${driverId}"]`);
  if (!card) return;
  const tyreInput = card.querySelector(`input[type="radio"][value="${recommendation.startTyre}"]`);
  if (tyreInput) tyreInput.checked = true;
  const stopsSelect = card.querySelector('[name="stops"]');
  if (stopsSelect) stopsSelect.value = String(recommendation.stops);
  const windowSelect = card.querySelector('[name="window"]');
  if (windowSelect) windowSelect.value = recommendation.windowKey;
  const modeSelect = card.querySelector('[name="mode"]');
  if (modeSelect) modeSelect.value = recommendation.mode;
  updateStrategyPreview();
  saveState();
  const applyLabel = recommendation.split ? '已采用车队分流方案' : '已采用工程师方案';
  toast(`${applyLabel}：${recommendation.summary}`, 'success');
}

function readStrategyCard(driverId) {
  const card = document.querySelector(`[data-strategy-driver="${driverId}"]`);
  if (!card) return null;
  const tyreInput = card.querySelector('input[type="radio"]:checked');
  const stopValue = Number.isFinite(Number(card.querySelector('[name="stops"]')?.value))
    ? clamp(Number(card.querySelector('[name="stops"]').value), 0, 2)
    : 1;
  return {
    startTyre: TYRES[tyreInput?.value] ? tyreInput.value : 'medium',
    stops: stopValue,
    windowKey: card.querySelector('[name="window"]')?.value || 'standard',
    mode: card.querySelector('[name="mode"]')?.value || 'balanced'
  };
}

function persistStrategyDrafts() {
  const weekend = state.weekend;
  if (!weekend) return;
  const track = activeTrackById(weekend.trackId) || nextTrack();
  ensureWeekendStrategies(weekend, track, !!weekend.wet, null, { refresh: false });
  state.roster.forEach((driverId) => {
    const draft = readStrategyCard(driverId);
    if (draft) state.weekend.strategies[driverId] = { ...draft };
  });
  weekend.strategyEdited = true;
}

function raceStrategiesFromForm() {
  persistStrategyDrafts();
  const weekend = state.weekend;
  if (!weekend) return {};
  const track = activeTrackById(weekend.trackId) || nextTrack();
  ensureWeekendStrategies(weekend, track, !!weekend.wet, null, { refresh: false });
  const map = {};
  state.roster.forEach((driverId) => {
    map[driverId] = { ...weekend.strategies[driverId] };
  });
  return map;
}
