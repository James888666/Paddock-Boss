.standing-pos { font-family: var(--font-mono); font-size: 13px; color: var(--ink-faint); }
.is-player .standing-pos { color: var(--accent); }
.standing-driver { display: flex; align-items: center; gap: 8px; min-width: 150px; }
.standing-driver .avatar { width: 26px; height: 26px; }
.standing-driver b { display: block; font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
.standing-driver span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; }
.standing-team { display: flex; align-items: center; gap: 7px; min-width: 125px; }
.standing-team .team-mono { width: 20px; height: 20px; font-size: 9px; }
.standing-team span, .standing-team b { white-space: nowrap; }
.standing-team b { font-size: 12px; color: var(--ink-dim); font-weight: 500; }
.standing-team span { display: block; font-size: 10px; color: var(--ink-faint); }
.standing-team > div span { font-family: var(--font-mono); font-size: 8.5px; margin-top: 1px; }
.standing-gap { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint) !important; }
.standing-pts { font-family: var(--font-display); font-style: italic; font-size: 18px !important; font-weight: 800; color: var(--ink) !important; text-align: right; }
.standings-footnote { padding: 9px 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.standings-table.small td { padding: 7px 10px; }
.standings-table.small th { padding: 7px 10px; }
.points-explainer .points-row { display: grid; grid-template-columns: repeat(5, 1fr); }
.points-row > div { padding: 9px 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: center; }
.points-row > div:nth-child(5n) { border-right: 0; }
.points-row > div:nth-child(n+6) { border-bottom: 0; }
.points-row span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.points-row b { display: block; font-family: var(--font-display); font-style: italic; font-size: 18.5px; font-weight: 800; line-height: 1.2; color: var(--ink-dim); }

/* ---------- weekend briefing ---------- */
.weekend-topline { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 12px; }
.weekend-crumb { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-faint); }
.weekend-banner {
  position: relative; overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(100% 140% at 100% 0%, rgba(var(--accent-rgb), .16), transparent 56%),
    linear-gradient(135deg, rgba(255,255,255,.05), transparent 42%),
    #0b1016;
  display: flex; justify-content: space-between; gap: 24px; align-items: stretch;
  padding: 24px 26px;
  min-height: 210px;
  isolation: isolate;
}
.weekend-banner::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--accent), transparent 65%); }
.weekend-banner-bg { position: absolute; z-index: -1; right: -2%; top: -10%; width: 58%; height: 130%; color: var(--accent); opacity: .5; }
.weekend-banner-bg svg { width: 100%; height: 100%; }
.weekend-banner-copy { position: relative; z-index: 1; max-width: 64%; }
.weekend-banner-copy .eyebrow { display: flex; align-items: center; gap: 7px; }
.weekend-banner-copy h1 { font-size: clamp(36px, 4vw, 54px); font-weight: 850; letter-spacing: -.055em; line-height: 1.02; margin-top: 8px; }
.weekend-banner-copy > p { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--ink-mute); margin-top: 5px; text-transform: uppercase; }
.weekend-banner-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 16px; }
.weekend-banner-tags span { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); padding: 4px 7px; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute); background: rgba(0,0,0,.14); }
.weekend-banner-tags .icon { width: 10px; height: 10px; color: var(--accent); }
.weekend-banner-tags .is-wet { color: var(--info); border-color: rgba(99,184,255,.25); }
.weekend-banner-side { display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; gap: 14px; z-index: 1; text-align: right; }
.weather-orb {
  width: 104px; height: 104px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 1px solid var(--line-strong);
  background: radial-gradient(circle at 50% 40%, rgba(255,202,88,.12), transparent 68%), rgba(0,0,0,.2);
  box-shadow: inset 0 0 30px rgba(0,0,0,.4);
}
.weather-orb.wet { background: radial-gradient(circle at 50% 40%, rgba(99,184,255,.17), transparent 68%), rgba(0,0,0,.2); }
.weather-orb b { font-family: var(--font-display); font-style: italic; font-size: 22px; font-weight: 900; letter-spacing: -.04em; line-height: 1; color: var(--warn); }
.weather-orb.wet b { color: var(--info); }
.weather-orb span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-mute); margin-top: 4px; }
.weekend-team-quali { border-top: 1px solid var(--line); padding-top: 9px; text-align: right; }
.weekend-team-quali span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.weekend-team-quali b { display: block; font-family: var(--font-display); font-style: italic; font-size: 25px; font-weight: 800; line-height: 1.05; }
.weekend-team-quali small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; }

.weekend-grid { display: grid; grid-template-columns: minmax(0, 1.36fr) minmax(320px, .74fr); gap: 12px; margin-top: 12px; align-items: start; }
.weekend-main, .weekend-side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.weekend-track-body { display: grid; grid-template-columns: 1.05fr 1fr; }
.weekend-track-map {
  position: relative; min-height: 190px; display: flex; align-items: center; justify-content: center; padding: 14px;
  color: var(--accent);
  background: linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
  background-size: 28px 28px;
  border-right: 1px solid var(--line);
}
.weekend-track-map svg { width: min(100%, 400px); height: auto; }
.weekend-track-map > span { position: absolute; left: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; }
.weekend-track-copy { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 13px; }
.weekend-track-copy p { font-size: 12px; color: var(--ink-mute); line-height: 1.7; }
.track-spec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.track-spec-grid > div { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.track-spec-grid span { font-size: 10px; color: var(--ink-faint); }
.track-spec-grid b { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--ink-mute); }
.track-spec-grid i { height: 2px; grid-column: 1 / -1; background: rgba(255,255,255,.07); display: block; }
.track-spec-grid i em { display: block; height: 100%; background: var(--accent); opacity: .7; }

.quali-head, .quali-row { display: grid; grid-template-columns: 32px 1.6fr 1fr 75px 60px; gap: 8px; align-items: center; padding: 7px 16px; }
.quali-head { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .07em; border-bottom: 1px solid var(--line); }
.quali-head span:nth-child(4), .quali-head span:nth-child(5) { text-align: right; }
.quali-row { border-bottom: 1px solid rgba(255,255,255,.04); min-height: 36px; }
.quali-row:last-child { border-bottom: 0; }
.quali-row.is-pole { background: rgba(255,255,255,.02); }
.quali-row.is-player { background: rgba(var(--accent-rgb), .07); box-shadow: inset 2px 0 0 var(--accent); }
.quali-pos { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); text-align: center; }
.quali-row.is-pole .quali-pos { color: var(--accent); }
.quali-driver { display: flex; align-items: center; gap: 7px; min-width: 0; }
.quali-driver .avatar { width: 23px; height: 23px; }
.quali-driver b { display: block; font-size: 11.5px; color: var(--ink-dim); font-weight: 500; }
.quali-driver small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-team { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-team i { width: 5px; height: 5px; border-radius: 99px; flex: 0 0 auto; }
.quali-time, .quali-gap { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); text-align: right; }
.quali-gap { color: var(--ink-faint); }
.quali-foot { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding: 8px 16px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.quali-foot span { display: flex; align-items: center; gap: 5px; }
.quali-foot .icon { width: 10px; height: 10px; }

.strategy-panel .panel-head { background: rgba(var(--accent-rgb), .025); }
.strategy-form { padding: 14px; }
.form-block { margin-bottom: 12px; }
.form-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
.form-label > span { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
.form-label small, .form-field span small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; margin-left: 5px; }
.tyre-choice-list { display: flex; flex-direction: column; gap: 5px; }
.tyre-choice { position: relative; display: block; cursor: pointer; }
.tyre-choice input { position: absolute; opacity: 0; pointer-events: none; }
.tyre-choice-inner {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 3px;
  background: rgba(255,255,255,.018); transition: .18s;
}
.tyre-choice:hover .tyre-choice-inner { border-color: var(--line-strong); background: rgba(255,255,255,.04); }
.tyre-choice input:checked + .tyre-choice-inner { border-color: color-mix(in srgb, var(--tyre) 55%, transparent); background: color-mix(in srgb, var(--tyre) 7%, transparent); }
.tyre-choice input:focus-visible + .tyre-choice-inner { outline: 2px solid var(--accent-2); outline-offset: 2px; }
.tyre-circle {
  width: 27px; height: 27px; flex: 0 0 auto; border-radius: 50%;
  border: 2px solid var(--tyre); color: var(--tyre);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 700;
  box-shadow: inset 0 0 0 2px #0b0f14;
}
.tyre-copy { flex: 1; }
.tyre-copy b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 600; }
.tyre-copy small { display: block; font-size: 9.5px; color: var(--ink-faint); margin-top: 1px; }
.tyre-radio { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--line-strong); position: relative; flex: 0 0 auto; }
.tyre-choice input:checked + .tyre-choice-inner .tyre-radio { border-color: var(--tyre); }
.tyre-choice input:checked + .tyre-choice-inner .tyre-radio::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--tyre); }
.form-two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.form-field { display: flex; flex-direction: column; gap: 5px; }
.form-field > span { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--ink-mute); }
.form-field select {
  width: 100%; appearance: none; -webkit-appearance: none;
  border: 1px solid var(--line); background:
    linear-gradient(45deg, transparent 50%, var(--ink-mute) 50%) calc(100% - 14px) calc(50% - 2px) / 4px 4px no-repeat,
    linear-gradient(135deg, var(--ink-mute) 50%, transparent 50%) calc(100% - 10px) calc(50% - 2px) / 4px 4px no-repeat,
    rgba(255,255,255,.025);
  padding: 8px 24px 8px 9px; color: var(--ink-dim); border-radius: 3px;
  font-size: 12px; cursor: pointer;
}
.form-field select:hover { border-color: var(--line-strong); background-color: rgba(255,255,255,.04); }
.form-field select option { background: #10161e; color: var(--ink-dim); }
.engineer-note { display: flex; gap: 9px; border: 1px solid var(--line); background: rgba(255,255,255,.018); padding: 9px; margin-top: 12px; }
.engineer-avatar { width: 24px; height: 24px; display: grid; place-items: center; color: var(--accent); border: 1px solid rgba(var(--accent-rgb), .25); flex: 0 0 auto; }
.engineer-avatar .icon { width: 13px; height: 13px; }
.engineer-note b { display: block; font-size: 11px; color: var(--ink-dim); }
.engineer-note p { font-size: 10px; color: var(--ink-faint); line-height: 1.55; margin-top: 2px; }
.strategy-summary { display: grid; grid-template-columns: repeat(3, 1fr); margin: 12px 0 10px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.strategy-summary > div { padding: 8px 3px; border-left: 1px solid var(--line); }
.strategy-summary > div:first-child { border-left: 0; }
.strategy-summary span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.strategy-summary b { display: block; font-size: 11px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strategy-disclaimer { font-size: 9.5px; color: var(--ink-faint); line-height: 1.5; text-align: center; margin-top: 8px; }
.weekend-weather-panel { padding-bottom: 0; }
.weather-detail { display: grid; grid-template-columns: 1fr 1fr; }
.weather-detail > div { padding: 9px 14px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); }
.weather-detail > div:nth-child(odd) { border-left: 0; }
.weather-detail span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.weather-detail b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 500; margin-top: 2px; }
.weather-detail b.wet-text { color: var(--info); }
.weather-note { padding: 9px 14px 12px; font-size: 10.5px; color: var(--ink-faint); line-height: 1.65; }

@media (max-width: 1280px) {
  .commercial-nums { flex-basis: 40%; }
  .standings-layout { grid-template-columns: 1fr; }
  .standings-side { display: grid; grid-template-columns: 1.2fr .8fr; }
  .weekend-grid { grid-template-columns: minmax(0, 1.25fr) minmax(300px, .8fr); }
  .calendar-row { grid-template-columns: 65px minmax(210px, 1.5fr) minmax(160px, .8fr) minmax(150px, .7fr); gap: 14px; }
  .cal-circuit { width: 62px; }
}
@media (max-width: 1080px) {
  .commercial-grid { grid-template-columns: 1fr; }
  .weekend-grid { grid-template-columns: 1fr; }
  .weekend-side { display: grid; grid-template-columns: 1.2fr .8fr; align-items: start; }
  .weekend-banner-bg { opacity: .35; }
  .calendar-row { grid-template-columns: 58px minmax(200px, 1.4fr) minmax(150px, .8fr); }
  .cal-result { grid-column: 2 / -1; justify-content: flex-start; border-top: 1px dashed var(--line); padding-top: 9px; }
  .cal-result small { text-align: left; }
  .cal-winner, .cal-player-result { text-align: left; }
  .cal-player-result { border-left: 0; padding-left: 0; }
  .cal-result .btn { margin-left: auto; }
}
@media (max-width: 900px) {
  .weekend-banner { padding: 18px; }
  .weekend-banner-copy { max-width: 72%; }
  .weekend-track-body { grid-template-columns: 1fr; }
  .weekend-track-map { border-right: 0; border-bottom: 1px solid var(--line); min-height: 160px; }
  .standings-side { grid-template-columns: 1fr; }
  .commercial-nums { flex-basis: 36%; }
  .commercial-brand { padding: 20px; }
  .commercial-nums > div { padding: 10px 16px; }
  .calendar-row { grid-template-columns: 52px 1fr; }
  .cal-specs { grid-column: 2; }
  .cal-result { grid-column: 2; }
  .cal-round { grid-row: 1 / span 3; }
}
@media (max-width: 700px) {
  .commercial-hero { flex-direction: column; }
  .commercial-nums { flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--line); grid-template-columns: 1fr 1fr; }
  .commercial-nums > div { border-bottom: 0; border-left: 1px solid var(--line); }
  .commercial-nums > div:first-child { border-left: 0; }
  .weekend-side { grid-template-columns: 1fr; }
  .weekend-banner { flex-direction: column; }
  .weekend-banner-copy { max-width: 100%; }
  .weekend-banner-side { flex-direction: row; align-items: center; justify-content: space-between; text-align: left; }
  .weekend-team-quali { border-top: 0; padding-top: 0; text-align: left; }
  .weather-orb { width: 80px; height: 80px; }
  .weather-orb b { font-size: 20px; }
  .weekend-crumb { display: none; }
  .season-progress-panel { grid-template-columns: 1fr; gap: 8px; }
  .season-progress-line { grid-column: 1; margin-top: 0; }
  .quali-head, .quali-row { grid-template-columns: 28px 1.5fr 1fr 68px; }
  .quali-head span:nth-child(5), .quali-gap { display: none; }
  .quali-team { display: none; }
  .quali-head span:nth-child(3) { display: none; }
  .standings-side { display: flex; }
  .contract-term-list > div { grid-template-columns: 1fr; gap: 3px; }
  .reward-blocks { grid-template-columns: 1fr 1fr; }
  .cal-specs { display: none; }
  .calendar-row { padding: 12px; gap: 12px; }
  .cal-track { gap: 7px; }
  .cal-circuit { width: 46px; }
  .cal-copy p { display: none; }
  .cal-result { flex-wrap: wrap; }
}
@media (max-width: 480px) {
  .commercial-nums { grid-template-columns: 1fr; }
  .commercial-nums > div { border-left: 0; border-top: 1px solid var(--line); }
  .commercial-nums > div:first-child { border-top: 0; }
  .target-head { flex-direction: column; align-items: flex-start; gap: 4px; }
  .weekend-banner-copy h1 { font-size: 32px; }
  .quali-head, .quali-row { grid-template-columns: 24px 1fr 64px; }
  .quali-head span:nth-child(3), .quali-team { display: none; }
  .weekend-track-map { min-height: 130px; }
  .tyre-choice-inner { padding: 7px; }
  .strategy-form { padding: 11px; }
  .standings-side { gap: 10px; }
  .calendar-row { grid-template-columns: 44px 1fr; }
  .cal-result .btn { width: 100%; margin-left: 0; }
}

/* ---------- legibility pass ---------- */
.quali-row { min-height: 38px; }
.quali-driver b { font-size: 12.5px; }
.quali-driver small { font-size: 9px; }
.quali-team { font-size: 11px; }
.quali-time, .quali-gap { font-size: 11px; }
.quali-head { font-size: 9px; }
.form-label > span { font-size: 13px; }
.tyre-copy b { font-size: 13px; }
.tyre-copy small { font-size: 10.5px; }
.form-field > span { font-size: 12px; }
.form-field select { font-size: 13px; padding-top: 9px; padding-bottom: 9px; }
.engineer-note b { font-size: 12px; }
.engineer-note p { font-size: 11px; }
.strategy-summary b { font-size: 11.5px; }
.strategy-disclaimer { font-size: 10px; }
.weekend-banner-tags span { font-size: 10px; }
.target-head { font-size: 10.5px; }

.ledger-row b { font-size: 11px; }
.contract-term-list > div { font-size: 12.5px; }
.contract-term-list span { font-size: 10px; }

.standings-table td { font-size: 12.5px; }

/* ---------- 22-car support ---------- */
.quali-table { max-height: 530px; overflow-y: auto; scrollbar-width: thin; }
.quali-head { position: sticky; top: 0; background: #0b1017; z-index: 2; }

/* ============================================================
   WEEKEND SESSION FLOW — practice, qualifying, final grid
   ============================================================ */
.weekend-timeline {
  display: flex; align-items: center; gap: 0;
  border: 1px solid var(--line); border-top: 0;
  background: rgba(255,255,255,.015);
  padding: 9px 14px;
  margin-bottom: 12px;
  overflow-x: auto;
}
.wt-step { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; opacity: .42; }
.wt-step.active, .wt-step.done { opacity: 1; }
.wt-dot {
  width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--line-strong);
  border-radius: 50%; font-family: var(--font-mono); font-size: 9px; color: var(--ink-mute);
}
.wt-dot .icon { width: 11px; height: 11px; }
.wt-step.done .wt-dot { color: var(--ok); border-color: rgba(66,224,165,.35); background: rgba(66,224,165,.055); }
.wt-step.active .wt-dot { color: #080b0f; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 14px rgba(var(--accent-rgb),.28); }
.wt-step.is-race .wt-dot { border-radius: 3px; }
.wt-step b { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); font-weight: 600; letter-spacing: .04em; }
.wt-step small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; white-space: nowrap; }
.wt-step.active b { color: var(--ink); }
.wt-link { flex: 1; min-width: 18px; height: 1px; background: var(--line); margin: 0 9px; }
.wt-step.done + .wt-link { background: rgba(66,224,165,.3); }

.weekend-session-panel { overflow: hidden; }
.weekend-session-body { padding: 14px; }
.prep-summary { border: 1px solid var(--line); background: rgba(255,255,255,.018); padding: 11px 12px; }
.prep-summary-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.prep-summary-head > span { font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
.prep-summary-head small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .04em; }
.prep-meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 9px; }
.prep-meter > div { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.prep-meter span { font-size: 10.5px; color: var(--ink-mute); }
.prep-meter span small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-left: 4px; }
.prep-meter b { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); font-weight: 500; }
.prep-meter b i { font-style: normal; font-size: 8.5px; color: var(--ink-faint); }
.prep-meter > i { display: block; height: 3px; background: rgba(255,255,255,.07); margin: 5px 0 3px; }
.prep-meter > i em { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.prep-meter > small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }

.practice-sessions { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
.practice-session { border: 1px solid var(--line); background: rgba(255,255,255,.014); }
.practice-session.is-active { border-color: rgba(var(--accent-rgb), .35); background: rgba(var(--accent-rgb), .035); }
.practice-session.is-locked { opacity: .48; }
.practice-session-head { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-bottom: 1px solid var(--line); }
.ps-no { font-family: var(--font-display); font-style: italic; font-weight: 900; letter-spacing: -.02em; font-size: 18.5px; color: var(--ink-mute); min-width: 32px; }
.practice-session.is-active .ps-no { color: var(--accent); }
.ps-title { flex: 1; min-width: 0; }
.ps-title b { display: block; font-size: 12.5px; color: var(--ink-dim); font-weight: 600; }
.ps-title small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; }
.ps-status { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .04em; white-space: nowrap; }
.practice-session.is-active .ps-status { color: var(--accent); }
.practice-session.is-done .ps-status { color: var(--ok); }
.focus-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 9px; }
.focus-option {
  display: flex; align-items: flex-start; gap: 7px; text-align: left;
  padding: 9px 8px; border: 1px solid var(--line); border-radius: 2px;
  background: rgba(0,0,0,.12); color: var(--ink-dim); transition: .18s;
}
.focus-option:hover { border-color: rgba(var(--accent-rgb),.45); background: rgba(var(--accent-rgb),.06); }
.focus-icon { width: 21px; height: 21px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); flex: 0 0 auto; }
.focus-icon .icon { width: 11px; height: 11px; }
.focus-copy { flex: 1; min-width: 0; }
.focus-copy b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 600; }
.focus-copy small { display: block; font-size: 9.5px; line-height: 1.5; color: var(--ink-faint); margin-top: 2px; }
.focus-option > em { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--accent); white-space: nowrap; padding-top: 1px; }
.practice-session-result { padding: 9px 11px 10px; }
.ps-program { display: flex; align-items: baseline; gap: 9px; }
.ps-program span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.ps-program b { font-size: 12px; color: var(--ink-dim); font-weight: 600; }
.ps-program em { font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ok); margin-left: auto; }
.ps-times { display: flex; gap: 24px; margin-top: 7px; flex-wrap: wrap; }
.ps-times span { font-size: 10px; color: var(--ink-faint); }
.ps-times b { display: inline-block; margin-left: 6px; color: var(--ink-dim); font-weight: 500; }
.practice-session-result p { font-size: 10px; color: var(--ink-mute); line-height: 1.55; margin-top: 5px; }
.practice-skip-note { padding: 9px 11px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.practice-locked { padding: 9px 11px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.weekend-session-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); background: rgba(0,0,0,.12); }
.weekend-session-actions .btn { flex: 0 0 auto; }
.session-action-hint { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); text-align: right; }
.practice-complete-note { display: flex; align-items: center; gap: 7px; margin-top: 12px; border: 1px solid var(--line); padding: 10px; font-size: 11px; color: var(--ink-mute); }
.practice-complete-note .icon { color: var(--accent); width: 13px; height: 13px; }

.quali-stage-overview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.quali-stage-chip { border: 1px solid var(--line); background: rgba(255,255,255,.015); padding: 8px 9px; opacity: .5; }
.quali-stage-chip.done, .quali-stage-chip.active { opacity: 1; }
.quali-stage-chip.active { border-color: rgba(var(--accent-rgb), .45); background: rgba(var(--accent-rgb), .05); }
.quali-stage-chip > span { display: flex; justify-content: space-between; gap: 5px; font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); }
.quali-stage-chip > span i { font-style: normal; font-size: 8.5px; color: var(--ink-faint); }
.quali-stage-chip > b { display: block; font-size: 12px; font-weight: 600; color: var(--ink-dim); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.quali-stage-chip > small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 1px; }
.quali-stage-chip.done > b { color: var(--ink); }

.race-result-summary span {
  display: block; font-family: var(--font-mono); font-size: 8px;
  letter-spacing: .05em; color: var(--ink-faint);
}
.race-result-summary b {
  display: block; margin-top: 3px;
  font-size: 13px; font-weight: 600; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.race-result-summary em {
  display: block; margin-top: 2px;
  font-style: normal; font-family: var(--font-mono); font-size: 8px;
  color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.race-result-table-wrap {
  max-height: min(52vh, 540px); overflow-y: auto;
  border: 1px solid var(--line); background: rgba(0,0,0,.2);
  scrollbar-width: thin;
}
.race-result-table-wrap .result-table-head {
  position: sticky; top: 0; z-index: 2; background: #0c1118;
}
.race-result-foot {
  display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint);
}
.result-fl {
  display: inline-block; margin-left: 3px; padding: 1px 3px;
  border: 1px solid rgba(201,140,255,.35);
  font-style: normal; font-family: var(--font-mono); font-size: 7px;
  line-height: 1.2; color: #c98cff; vertical-align: 1px;
}
@media (max-width: 700px) {
  .race-result-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .race-result-table-wrap { max-height: 45vh; }
}

/* ---- race.css ---- */
/* ============================================================
   LIVE RACE — HUD, timing tower, circuit, decisions, results
   ============================================================ */

body.race-open { overflow: hidden; }

.race-layer {
  position: fixed; inset: 0; z-index: 150;
  display: flex; flex-direction: column;
  background:
    radial-gradient(1100px 650px at 62% 0%, rgba(var(--accent-rgb), .08), transparent 62%),
    #05070a;
  color: var(--ink);
  isolation: isolate;
  overflow: hidden;
}
.race-layer::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse at 50% 20%, #000, transparent 80%);
}

/* ---------- HUD ---------- */
.race-hud {
  flex: 0 0 auto;
  display: grid; grid-template-columns: minmax(220px, 1.2fr) 170px minmax(270px, 1fr) auto;
  gap: 20px; align-items: center;
  padding: 13px 20px;
  min-height: 74px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(14,19,26,.96), rgba(9,13,18,.9));
}
.race-hud-event { min-width: 0; }
.race-hud-event .eyebrow { font-size: 9.5px; letter-spacing: .15em; }
.race-hud-title { display: flex; align-items: baseline; gap: 10px; margin-top: 3px; min-width: 0; }
.race-hud-title b { font-size: 19px; font-weight: 750; letter-spacing: -.035em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.race-hud-title span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .05em; white-space: nowrap; }
.race-hud-lap { display: flex; align-items: baseline; gap: 6px; border-left: 1px solid var(--line); padding-left: 20px; }
.race-hud-lap span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .12em; }
.race-hud-lap b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 34px; letter-spacing: -.045em; line-height: .9; }
.race-hud-lap i { font-family: var(--font-mono); font-size: 11px; font-style: normal; color: var(--ink-mute); }
.race-hud-meta { display: flex; align-items: center; gap: 11px; min-width: 0; }
.race-condition {
  font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .1em;
  padding: 4px 7px; border: 1px solid rgba(255,202,88,.32); color: var(--warn); background: rgba(255,202,88,.06);
}
.race-condition.wet { color: var(--info); border-color: rgba(99,184,255,.32); background: rgba(99,184,255,.07); }
.race-condition.damp { color: #9db4c8; border-color: rgba(157,180,200,.32); background: rgba(157,180,200,.07); }
.race-condition.heavy { color: #7fb2ff; border-color: rgba(79,141,255,.5); background: rgba(79,141,255,.12); }
.race-flag-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em; color: var(--ok);
  border: 1px solid rgba(66,224,165,.25); background: rgba(66,224,165,.055); padding: 4px 7px;
}
.race-flag-pill .dot { width: 4px; height: 4px; }
.race-flag-pill em { font-style: normal; }
.race-flag-pill.is-sc { color: var(--warn); border-color: rgba(255,202,88,.33); background: rgba(255,202,88,.065); }
.race-flag-pill.is-sc .dot { background: var(--warn); }
.race-flag-pill.is-vsc { color: var(--info); border-color: rgba(99,184,255,.36); background: rgba(99,184,255,.07); }
.race-flag-pill.is-vsc .dot { background: var(--info); }
.race-flag-pill.is-yellow { color: var(--warn); border-color: rgba(255,202,88,.42); background: rgba(255,202,88,.09); }
.race-flag-pill.is-yellow .dot { background: var(--warn); }
.race-flag-pill.is-red { color: var(--bad); border-color: rgba(255,96,114,.45); background: rgba(255,96,114,.09); }
.race-flag-pill.is-red .dot { background: var(--bad); }
.race-flag-pill.is-sc .dot, .race-flag-pill.is-vsc .dot, .race-flag-pill.is-yellow .dot, .race-flag-pill.is-red .dot { animation: raceFlagPulse 1.1s ease-in-out infinite; }
@keyframes raceFlagPulse { 0%, 100% { opacity: 1; } 50% { opacity: .28; } }
.race-hud-meta small { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .04em; white-space: nowrap; }
.race-hud-controls { display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
.race-control-btn {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 30px; padding: 0 9px;
  border: 1px solid var(--line-strong); background: rgba(255,255,255,.03);
  color: var(--ink-dim); border-radius: 2px; font-size: 11px; transition: .18s;
}
.race-control-btn .icon { width: 12px; height: 12px; }
.race-control-btn:hover { color: var(--ink); border-color: rgba(255,255,255,.35); background: rgba(255,255,255,.07); }
.race-control-btn.is-paused { color: var(--accent); border-color: rgba(var(--accent-rgb), .4); background: rgba(var(--accent-rgb), .08); }
.race-skip-btn { color: var(--ink-mute); }
.race-speed-group { display: flex; border: 1px solid var(--line); }
.race-speed-btn {
  min-width: 28px; height: 28px; border: 0; border-right: 1px solid var(--line);
  background: transparent; color: var(--ink-faint);
  font-family: var(--font-mono); font-size: 10px; transition: .18s;
}
.race-speed-btn:last-child { border-right: 0; }
.race-speed-btn:hover { color: var(--ink-dim); background: rgba(255,255,255,.045); }
.race-speed-btn.active { color: #07090c; background: var(--accent); font-weight: 700; }
.race-progress-track { flex: 0 0 auto; height: 2px; background: rgba(255,255,255,.06); position: relative; }
.race-progress-track i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 12px rgba(var(--accent-rgb), .65); transition: width .25s linear; }

/* ---------- body layout ---------- */
.race-body {
  flex: 1; min-height: 0;
  display: grid; grid-template-columns: 326px minmax(0, 1fr) 300px;
  gap: 10px; padding: 10px 12px 12px;
}
.race-panel {
  border: 1px solid var(--line);
  background:
    linear-gradient(160deg, rgba(255,255,255,.026), transparent 34%),
    rgba(11, 16, 22, .82);
  border-radius: 3px;
  min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.race-panel-head {
  flex: 0 0 auto;
  min-height: 38px; padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .1em; color: var(--ink-mute); text-transform: uppercase;
}
.race-panel-head em { font-style: normal; color: var(--ink-faint); margin-left: 5px; font-size: 8.5px; }
.race-live-tag { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-faint); font-size: 8.5px; letter-spacing: .06em; }
.race-live-tag .dot { width: 4px; height: 4px; color: var(--ok); animation: livePulse 1.5s ease-in-out infinite; }
@keyframes livePulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; box-shadow: 0 0 9px var(--ok); } }

/* ---------- timing tower ---------- */
.race-tower-panel { min-width: 0; }
.race-tower-cols {
  flex: 0 0 auto;
  display: grid; grid-template-columns: 22px minmax(0,1fr) 48px 56px;
  gap: 7px; align-items: center;
  padding: 6px 12px 6px 24px;
  font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .06em;
  border-bottom: 1px solid var(--line);
}
.race-tower-cols span:last-child { text-align: right; }
.race-tower { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.tower-row {
  display: grid; grid-template-columns: 22px 2px minmax(0,1fr) 48px 56px;
  gap: 7px; align-items: center;
  min-height: 36px; padding: 0 12px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  position: relative;
  transition: background .2s;
}
.tower-row:hover { background: rgba(255,255,255,.025); }
.tower-row.is-player { background: rgba(var(--accent-rgb), .075); box-shadow: inset 2px 0 0 var(--accent); }
.tower-row.is-retired { opacity: .42; }
.tower-pos { font-family: var(--font-mono); font-size: 12px; color: var(--ink-mute); position: relative; padding-left: 2px; }
.tower-row.is-player .tower-pos { color: var(--ink); }
.tower-move {
  position: absolute; right: -2px; top: -4px;
  font-style: normal; font-size: 8px; color: var(--ok);
}
.tower-move.down { color: var(--bad); }
.tower-stripe { height: 16px; width: 2px; background: var(--row-team); opacity: .9; }
.tower-driver { min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.tower-driver b { font-size: 13px; font-weight: 600; color: var(--ink-dim); line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tower-row.is-player .tower-driver b { color: var(--ink); }
.tower-driver small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .02em; display: flex; align-items: center; gap: 3px; }
.tower-driver small i { font-style: normal; color: var(--ink-faint); }
.tower-tyre { display: flex; align-items: center; gap: 3px; justify-content: flex-start; }
.tower-tyre-dot {
  width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--tyre); color: var(--tyre);
  display: grid; place-items: center; font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  box-shadow: inset 0 0 0 1px #06090d;
}
.tower-tyre em { font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.tower-dnf { font-style: normal; font-size: 8.5px; color: var(--bad); border: 1px solid rgba(255,96,114,.25); padding: 1px 3px; border-radius: 2px; white-space: nowrap; }
.tower-gap { font-family: var(--font-mono); font-size: 10px; text-align: right; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
.tower-row.is-player .tower-gap { color: var(--ink-dim); }
.race-tower-foot { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 7px 12px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); text-align: center; letter-spacing: .03em; }
.race-tower-foot span { display: inline-block; width: 9px; height: 9px; border: 2px solid #fff; border-radius: 50%; vertical-align: -2px; margin-right: 4px; background: var(--accent); }

/* ---------- centre ---------- */
.race-center { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.race-map-panel { flex: 1; min-height: 0; }
.race-map-panel .race-panel-head { border-bottom: 0; }
.race-map-lap { color: var(--ink-faint); font-size: 8.5px; }
.race-map-lap b { color: var(--ink-dim); font-weight: 500; }
.race-map-stage {
  flex: 1; min-height: 0; position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 0 14px 2px;
  background:
    radial-gradient(ellipse at 50% 52%, rgba(var(--accent-rgb), .06), transparent 62%);
}
.race-map-grid-lines {
  position: absolute; inset: 6%;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse at center, #000 15%, transparent 74%);
  pointer-events: none;
}
.race-track-svg { width: 100%; height: 100%; position: relative; z-index: 1; overflow: visible; }
.race-dot { transition: transform .25s linear, opacity .4s ease; transform-origin: 0 0; }
.race-dot.is-player circle:first-child { filter: url(#dotGlow); }
.race-map-legend {
  position: absolute; left: 15px; bottom: 9px; z-index: 2;
  display: flex; align-items: center; gap: 9px;
  font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .03em;
}
.legend-hero { color: var(--accent); border: 1px solid rgba(var(--accent-rgb), .28); padding: 2px 5px; }
.race-map-legend > span:last-child { display: flex; align-items: center; gap: 5px; }
.race-map-legend > span:last-child::before { content: ""; width: 7px; height: 7px; border: 1.5px solid #fff; border-radius: 50%; background: var(--accent); }
.race-map-footer {
  flex: 0 0 auto; display: flex; border-top: 1px solid var(--line);
  padding: 0 14px;
}
.race-map-footer > div { flex: 1; padding: 8px 0; border-left: 1px solid var(--line); padding-left: 12px; }
.race-map-footer > div:first-child { border-left: 0; padding-left: 0; }
.race-map-footer span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .04em; }
.race-map-footer b { display: block; font-size: 10.5px; color: var(--ink-mute); font-weight: 500; margin-top: 1px; }
.race-radio-panel { flex: 0 0 188px; }
.race-feed { flex: 1; overflow-y: auto; padding: 4px 12px 9px; }
.radio-item { display: grid; grid-template-columns: 26px 2px minmax(0,1fr); gap: 7px; padding: 5px 0; align-items: start; border-bottom: 1px solid rgba(255,255,255,.04); }
.radio-item:last-child { border-bottom: 0; }
.radio-lap { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); padding-top: 1px; }
.radio-line { width: 2px; height: 100%; min-height: 14px; background: var(--line-strong); }
.radio-item p { font-size: 11px; line-height: 1.5; color: var(--ink-mute); }
.radio-item.start p, .radio-item.success p { color: var(--ink-dim); }
.radio-item.pit .radio-line { background: var(--warn); }
.radio-item.pit p { color: var(--warn); }
.radio-item.warn .radio-line { background: var(--warn); }
.radio-item.danger .radio-line { background: var(--bad); }
.radio-item.danger p { color: var(--bad); }
.radio-item.success .radio-line { background: var(--ok); }
.radio-item.success p { color: var(--ok); }

/* ---------- right race side ---------- */
.race-side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.race-plan-panel { flex: 1; min-height: 0; }
.race-player-status { overflow-y: auto; min-height: 0; }
.race-driver-status { padding: 11px 13px; border-bottom: 1px solid var(--line); }
.race-driver-status:last-child { border-bottom: 0; }
.race-driver-status.is-retired { opacity: .58; }
.race-status-head { display: flex; align-items: center; gap: 8px; }
.race-status-head .avatar { width: 29px; height: 29px; }
.race-status-name { flex: 1; min-width: 0; }
.race-status-name b { display: block; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.race-status-name span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.race-status-pos { text-align: right; }
.race-status-pos span { display: block; font-family: var(--font-display); font-style: italic; font-size: 21px; font-weight: 900; letter-spacing: -.03em; line-height: .9; }
.race-status-pos small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.race-status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--line); background: var(--line); margin-top: 8px; }
.race-status-grid > div { background: #0b1016; padding: 5px 7px; }
.race-status-grid span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.race-status-grid b { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-dim); font-weight: 500; margin-top: 1px; }
.mini-tyre { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--tyre); color: var(--tyre); display: inline-grid; place-items: center; font-family: var(--font-mono); font-size: 8.5px; font-weight: 700; }
.race-pitline { margin-top: 6px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.race-control-panel { flex: 0 0 auto; }
.race-info { padding: 4px 13px; }
.race-info > div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.04); padding: 5px 0; }
.race-info > div:last-child { border-bottom: 0; }
.race-info span { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.race-info b { font-size: 10px; color: var(--ink-mute); font-weight: 500; text-align: right; }
.race-info .race-water-row {
  display: block; padding: 1px 0 6px; border-bottom: 0;
}
.race-water-track {
  display: block; height: 4px; width: 100%;
  background: rgba(255,255,255,.06); overflow: hidden;
  border-radius: 2px;
}
.race-water-track i {
  display: block; height: 100%; width: 0;
  background: var(--info); border-radius: 2px;
  transition: width .35s linear, background .35s linear;
  box-shadow: 0 0 8px rgba(99,184,255,.45);
}
.race-pitwall .race-tyre-picks { gap: 2px; }
.race-pitwall .race-tyre-btn { width: 25px; height: 25px; }
.race-hint { display: flex; gap: 6px; padding: 8px 13px 10px; border-top: 1px solid var(--line); }
.race-hint .icon { width: 11px; height: 11px; color: var(--ink-faint); margin-top: 1px; flex: 0 0 auto; }
.race-hint p { font-size: 9.5px; line-height: 1.55; color: var(--ink-faint); }

/* ---------- decisions ---------- */
.race-decision-overlay {
  position: fixed; inset: 0; z-index: 170;
  display: grid; place-items: center;
  padding: 20px;
  background: rgba(3,5,8,.68);
  backdrop-filter: blur(7px);
  animation: overlayIn .2s ease both;
}
.race-decision-card {
  width: min(100%, 730px);
  border: 1px solid var(--line-strong);
  background:
    radial-gradient(110% 110% at 100% 0%, rgba(var(--accent-rgb), .10), transparent 58%),
    linear-gradient(160deg, #131a23, #090d13 72%);
  box-shadow: 0 60px 140px -30px rgba(0,0,0,.95);
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  animation: modalIn .35s var(--ease) both;
}
.race-decision-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--driver, var(--accent)); }
.race-decision-card.is-red-flag::before { background: var(--bad); }
.race-decision-card.is-red-flag .decision-index { color: var(--bad); }
.race-decision-card.is-red-flag .decision-live { color: var(--bad); }
.decision-topline { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 18px; border-bottom: 1px solid var(--line); font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-faint); }
.decision-live { display: inline-flex; align-items: center; gap: 5px; color: var(--warn); }
.decision-live .dot { color: currentColor; }
.decision-driver-row { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; padding: 18px 20px 14px; }
.decision-driver-row h3 { font-size: 25px; font-weight: 800; letter-spacing: -.035em; line-height: 1.15; margin-top: 4px; }
.decision-driver-row p { font-size: 12px; color: var(--ink-mute); line-height: 1.65; margin-top: 5px; max-width: 500px; }
.decision-pos { text-align: right; border-left: 1px solid var(--line); padding-left: 16px; }
.decision-pos span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .06em; }
.decision-pos b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 29px; letter-spacing: -.04em; line-height: 1; }
.decision-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 20px 16px; }
.decision-options.is-single { grid-template-columns: 1fr; }
.decision-option {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  padding: 12px; border: 1px solid var(--line); border-radius: 2px;
  background: rgba(255,255,255,.025); color: var(--ink-dim);
  transition: .2s;
}
.decision-option:hover { border-color: var(--line-strong); background: rgba(255,255,255,.055); transform: translateY(-1px); }
.decision-option.is-primary { border-color: rgba(var(--accent-rgb), .3); background: rgba(var(--accent-rgb), .055); }
.decision-option.is-primary:hover { border-color: rgba(var(--accent-rgb), .65); background: rgba(var(--accent-rgb), .1); }
.decision-index { font-family: var(--font-mono); font-size: 10px; color: var(--accent); padding-top: 2px; }
.decision-option-copy { flex: 1; }
.decision-option-copy b { display: block; font-size: 14px; color: var(--ink); font-weight: 600; }
.decision-option-copy small { display: block; font-size: 11px; color: var(--ink-mute); margin-top: 2px; line-height: 1.45; }
.decision-option-copy em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 5px; }
.decision-arrow { color: var(--ink-faint); font-family: var(--font-mono); font-size: 13px; padding-top: 1px; }
.decision-foot { display: flex; align-items: center; justify-content: space-between; gap: 14px; border-top: 1px solid var(--line); padding: 9px 20px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.decision-foot span { display: flex; align-items: center; gap: 5px; }
.decision-foot .icon { width: 10px; height: 10px; }

/* ---------- results ---------- */
.results-overlay {
  position: fixed; inset: 0; z-index: 180;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 3vh 18px;
  background: rgba(3,5,8,.8);
  backdrop-filter: blur(9px);
  overflow-y: auto;
  animation: overlayIn .3s ease both;
}
.results-card {
  width: min(100%, 1060px);
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background:
    radial-gradient(100% 120% at 100% 0%, rgba(var(--accent-rgb), .11), transparent 52%),
    linear-gradient(160deg, #111821, #090c11 62%);
  box-shadow: 0 60px 160px -30px #000;
  position: relative;
  overflow: hidden;
  animation: modalIn .4s var(--ease) both;
}
.results-card.is-win::before {
  content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background-image: repeating-conic-gradient(rgba(255,255,255,.028) 0 25%, transparent 0 50%);
  background-size: 20px 20px;
  mask-image: linear-gradient(135deg, #000, transparent 40%);
}
.results-stripe { position: absolute; z-index: 2; left: 0; top: 0; right: 0; height: 2px; }
.results-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 12px 22px; border-bottom: 1px solid var(--line);

}
.results-head-label { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.results-head-label .dot { color: var(--accent); width: 4px; height: 4px; }
.results-head-track { color: var(--ink-mute); }
.results-head-weather { color: var(--ink-faint); white-space: nowrap; }
.results-hero {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
  padding: 20px 22px 18px; border-bottom: 1px solid var(--line);
  position: relative; z-index: 1;
}
.result-hero-copy h2 { font-size: clamp(26px, 3vw, 38px); font-weight: 850; letter-spacing: -.045em; line-height: 1.13; margin-top: 5px; }
.result-hero-copy p { font-size: 11.5px; color: var(--ink-mute); margin-top: 6px; }
.result-hero-numbers { display: flex; gap: 22px; flex: 0 0 auto; }
.result-big, .result-points { text-align: right; border-left: 1px solid var(--line); padding-left: 18px; }
.result-big span, .result-points span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .07em; }
.result-big b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 43px; line-height: .92; letter-spacing: -.05em; }
.result-points b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 31px; line-height: 1; letter-spacing: -.03em; color: var(--accent); }
.results-body { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(290px, .72fr); position: relative; z-index: 1; }
.results-left { min-width: 0; border-right: 1px solid var(--line); }
.results-right { padding: 14px; display: flex; flex-direction: column; gap: 9px; }
.result-table-head, .result-row { display: grid; grid-template-columns: 28px minmax(130px,1.18fr) .9fr 1fr 34px; gap: 8px; align-items: center; padding: 6px 14px; }
.result-table-head { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .07em; border-bottom: 1px solid var(--line); }
.result-table-head span:nth-child(4), .result-table-head span:nth-child(5) { text-align: right; }
.result-row { border-bottom: 1px solid rgba(255,255,255,.04); min-height: 33px; }
.result-row.is-player { background: rgba(var(--accent-rgb), .07); box-shadow: inset 2px 0 0 var(--accent); }
.result-row.is-dnf { opacity: .55; }
.result-pos { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-mute); text-align: center; }
.result-driver { display: flex; align-items: center; gap: 7px; min-width: 0; }
.result-driver .avatar { width: 24px; height: 24px; }
.result-driver b { display: block; font-size: 11.5px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-row.is-player .result-driver b { color: var(--ink); }
.result-driver small { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-team { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-team i { width: 5px; height: 5px; border-radius: 50%; flex: 0 0 auto; }
.result-time { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); text-align: right; }
.result-pts { font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); text-align: right; }
.result-row.is-player .result-pts { color: var(--accent); }
.result-legend { display: flex; justify-content: space-between; gap: 16px; padding: 8px 14px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); border-top: 1px solid var(--line); }
.result-legend span { display: flex; align-items: center; gap: 4px; }
.result-legend .icon { width: 9px; height: 9px; }
.board-reaction { border: 1px solid var(--line); background: rgba(255,255,255,.018); padding: 10px; }
.board-reaction.great, .board-reaction.good { border-color: rgba(66,224,165,.22); background: rgba(66,224,165,.035); }
.board-reaction.poor, .board-reaction.bad, .board-reaction.dnf { border-color: rgba(255,96,114,.22); background: rgba(255,96,114,.03); }
.board-reaction-top { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .06em; color: var(--ink-faint); }
.board-reaction-top b { font-family: var(--font-display); font-style: italic; font-size: 19px; font-weight: 900; }
.board-reaction-top b.positive { color: var(--ok); }
.board-reaction-top b.negative { color: var(--bad); }
.board-reaction h4 { font-size: 14px; font-weight: 650; margin-top: 3px; }
.board-reaction p { font-size: 10px; line-height: 1.55; color: var(--ink-mute); margin-top: 3px; }
.result-finance { border: 1px solid var(--line); background: rgba(255,255,255,.014); }
.result-finance-head { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding: 7px 9px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.result-finance-head b { color: var(--ink-dim); font-weight: 500; }
.result-fin-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 9px; font-size: 10px; color: var(--ink-mute); }
.result-fin-row b { font-family: var(--font-mono); font-size: 10px; font-weight: 500; }
.result-fin-row b.income { color: var(--ok); }
.result-fin-row b.expense { color: var(--ink-faint); }
.result-fin-row.total { border-top: 1px solid var(--line); margin-top: 2px; padding-top: 7px; padding-bottom: 6px; }
.result-fin-row.total span { color: var(--ink-dim); }
.result-fin-row.total b { color: var(--ink); }
.result-delivery { display: flex; gap: 8px; border: 1px solid rgba(66,224,165,.2); background: rgba(66,224,165,.035); padding: 8px; align-items: center; }
.result-delivery > div:first-child { width: 27px; height: 27px; color: var(--ok); border: 1px solid rgba(66,224,165,.25); display: grid; place-items: center; flex: 0 0 auto; }
.result-delivery .icon { width: 13px; height: 13px; }
.result-delivery span { display: block; font-family: var(--font-mono); font-size: 8px; color: var(--ok); letter-spacing: .06em; }
.result-delivery b { display: block; font-size: 11px; font-weight: 600; }
.result-delivery small { display: block; font-size: 9px; color: var(--ink-faint); }
.season-complete-note { border: 1px solid rgba(var(--accent-rgb), .25); background: rgba(var(--accent-rgb), .045); padding: 8px 10px; }
.season-complete-note span { font-family: var(--font-mono); font-size: 8.5px; color: var(--accent); letter-spacing: .08em; }
.season-complete-note p { font-size: 10px; color: var(--ink-mute); line-height: 1.5; margin-top: 2px; }
.results-right > .btn { margin-top: 2px; }
.results-footnote { text-align: center; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }

/* ---------- responsive ---------- */
@media (max-width: 1300px) {
  .race-body { grid-template-columns: 300px minmax(0,1fr) 280px; }
  .race-hud { grid-template-columns: minmax(190px, 1fr) 140px minmax(240px, .9fr) auto; gap: 14px; }
  .race-hud-title b { font-size: 18.5px; }
  .race-hud-title span { display: none; }
  .race-tower-foot { font-size: 8.5px; }
}
@media (max-width: 1120px) {
  .race-layer { overflow-y: auto; }
  .race-hud { position: sticky; top: 0; z-index: 20; grid-template-columns: minmax(180px,1fr) 130px 1fr; }
  .race-hud-controls { grid-column: 1 / -1; justify-content: flex-start; border-top: 1px solid var(--line); padding-top: 8px; }
  .race-body { display: grid; grid-template-columns: 292px minmax(0,1fr); overflow: visible; padding-bottom: 20px; }
  .race-tower-panel { min-height: 540px; max-height: 640px; }
  .race-center { min-height: 640px; }
  .race-side { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
  .race-plan-panel { min-height: 220px; max-height: 320px; }
  .race-control-panel { min-height: 0; }
  .results-body { grid-template-columns: 1fr; }
  .results-left { border-right: 0; border-bottom: 1px solid var(--line); }
  .results-right { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
  .results-right > .btn, .results-footnote, .season-complete-note { grid-column: 1 / -1; }
}
@media (max-width: 820px) {
  .race-hud { grid-template-columns: 1fr auto; padding: 11px 12px; gap: 8px 14px; }
  .race-hud-lap { border-left: 0; padding-left: 0; justify-self: end; }
  .race-hud-meta { display: none; }
  .race-hud-controls { grid-column: 1 / -1; justify-content: space-between; }
  .race-body { grid-template-columns: 1fr; padding: 8px; }
  .race-tower-panel { max-height: 440px; min-height: 380px; order: 2; }
  .race-center { order: 1; min-height: 500px; }
  .race-side { order: 3; grid-template-columns: 1fr; }
  .race-plan-panel { max-height: none; }
  .race-radio-panel { flex-basis: 170px; }
  .race-hud-event .eyebrow { display: none; }
  .race-hud-title b { font-size: 17.5px; }
  .race-decision-driver-row { grid-template-columns: 46px 1fr; }
  .decision-pos { display: none; }
  .decision-options { grid-template-columns: 1fr; }
  .decision-driver-row h3 { font-size: 21px; }
  .results-overlay { padding: 12px; }
  .results-head { flex-wrap: wrap; gap: 5px 14px; padding: 10px 14px; }
  .results-head-track { order: 3; width: 100%; }
  .results-hero { flex-direction: column; align-items: flex-start; padding: 16px 14px; }
  .result-hero-numbers { width: 100%; border-top: 1px solid var(--line); padding-top: 10px; justify-content: flex-start; }
  .result-big { border-left: 0; padding-left: 0; }
  .results-right { display: flex; padding: 12px; }
  .result-table-head, .result-row { grid-template-columns: 22px minmax(100px,1.2fr) .8fr 1fr 26px; gap: 5px; padding: 6px 10px; }
  .result-legend { flex-direction: column; gap: 3px; }
  .race-control-btn span { display: none; }
  .race-control-btn { padding: 0 8px; }
}
@media (max-width: 560px) {
  .race-hud-title b { font-size: 16px; }
  .race-hud-lap b { font-size: 26px; }
  .race-center { min-height: 380px; }
  .race-map-footer > div:nth-child(2) { display: none; }
  .decision-topline { font-size: 8.5px; padding: 9px 13px; }
  .race-decision-card { border-radius: 2px; }
  .decision-driver-row { padding: 14px 14px 10px; gap: 10px; }
  .decision-options { padding: 0 14px 12px; }
  .decision-foot { padding: 8px 14px; }
  .decision-foot span:first-child { display: none; }
  .results-card { border-radius: 2px; }
  .result-table-head, .result-row { grid-template-columns: 20px 1.4fr .8fr 26px; }
  .result-table-head span:nth-child(3), .result-team { display: none; }
  .result-time { grid-column: 3; }
  .results-head-weather { display: none; }
}
