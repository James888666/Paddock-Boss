<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090d">
<title>PADDOCK BOSS · 围场总裁 — 2026 F1 车队经营模拟（非官方）</title>
<meta name="description" content="2026 车队经营模拟原型：11 支真实车队、22 位正选与近五年 36 位正式车手，选车库、造赛车、跑赛季。">
<style>/* ---- base.css ---- */
/* ============================================================
   PADDOCK BOSS — base / design system / main menu / team select
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-width: 320px;
  background:
    radial-gradient(1100px 760px at 82% -12%, rgba(var(--accent-rgb), .13), transparent 62%),
    radial-gradient(900px 600px at -8% 108%, rgba(72, 112, 255, .06), transparent 60%),
    var(--bg0);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  opacity: .5;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse at 50% 35%, #000 0%, transparent 82%);
}
::selection { background: var(--accent); color: #080a0d; }

:root {
  --bg0: #06080b;
  --bg1: #0a0d12;
  --bg2: #0f141b;
  --panel: #10161e;
  --panel-2: #141b25;
  --panel-3: #1a2330;
  --ink: #f3f6fa;
  --ink-dim: #a7b2bf;
  --ink-mute: #74808e;
  --ink-faint: #4b5663;
  --line: rgba(255, 255, 255, .085);
  --line-strong: rgba(255, 255, 255, .17);
  --accent: #ff4d2e;
  --accent-2: #ffc857;
  --accent-rgb: 255, 77, 46;
  --team: #ff4d2e;
  --team-rgb: 255, 77, 46;
  --ok: #42e0a5;
  --warn: #ffca58;
  --bad: #ff6072;
  --info: #63b8ff;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  --font-display: "Helvetica Neue", "Arial Narrow", "DIN Alternate", "Bahnschrift Condensed", sans-serif;
  --font-mono: "SFMono-Regular", "Roboto Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --radius: 14px;
  --ease: cubic-bezier(.22, .9, .24, 1);
}

a { color: inherit; text-decoration: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, input, select { -webkit-tap-highlight-color: transparent; }
svg { display: block; }
h1, h2, h3, h4, p { margin: 0; }
img { max-width: 100%; }

:focus-visible {
  outline: 2px solid var(--accent-2);
  outline-offset: 3px;
}
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: #090c11; }
::-webkit-scrollbar-thumb { background: #26303d; border-radius: 20px; border: 2px solid #090c11; }
::-webkit-scrollbar-thumb:hover { background: #354252; }

/* ---------- utility ---------- */
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.condensed { font-family: var(--font-display); }
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  font-family: var(--font-mono);
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: .19em;
  text-transform: uppercase;
  color: var(--ink-mute);
}
.eyebrow::before {
  content: "";
  width: 22px;
  height: 1px;
  background: var(--accent);
  display: inline-block;
}
.eyebrow.no-rule::before { display: none; }
.muted { color: var(--ink-mute); }
.dim { color: var(--ink-dim); }
.accent { color: var(--accent); }
.tnum { font-variant-numeric: tabular-nums; }
.upper { text-transform: uppercase; }
.nowrap { white-space: nowrap; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.screen { min-height: 100vh; position: relative; }
.screen-enter { animation: screenIn .48s var(--ease) both; }
@keyframes screenIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.stagger > * { animation: riseIn .6s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .05s; }
.stagger > *:nth-child(3) { animation-delay: .1s; }
.stagger > *:nth-child(4) { animation-delay: .15s; }
.stagger > *:nth-child(5) { animation-delay: .2s; }
.stagger > *:nth-child(6) { animation-delay: .25s; }
@keyframes riseIn {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- buttons ---------- */
.btn {
  --btn-bg: transparent;
  --btn-ink: var(--ink);
  --btn-line: var(--line-strong);
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 46px;
  padding: 0 22px;
  border: 1px solid var(--btn-line);
  background: var(--btn-bg);
  color: var(--btn-ink);
  border-radius: 4px;
  font-weight: 700;
  font-size: 15.5px;
  letter-spacing: .02em;
  white-space: nowrap;
  transition: transform .2s var(--ease), background .2s, border-color .2s, box-shadow .25s, color .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn[disabled], .btn.is-disabled {
  opacity: .36;
  pointer-events: none;
  filter: grayscale(.4);
}
.btn .arr {
  font-family: var(--font-mono);
  font-weight: 400;
  transition: transform .2s var(--ease);
}
.btn:hover .arr { transform: translateX(4px); }
.btn-primary {
  --btn-bg: var(--accent);
  --btn-ink: #080a0d;
  --btn-line: var(--accent);
  box-shadow: 0 10px 34px -14px rgba(var(--accent-rgb), .8);
}
.btn-primary:hover { box-shadow: 0 16px 40px -14px rgba(var(--accent-rgb), 1); background: var(--accent-2); border-color: var(--accent-2); }
.btn-team {
  --btn-bg: var(--team);
  --btn-ink: #07090c;
  --btn-line: var(--team);
  box-shadow: 0 10px 34px -16px rgba(var(--team-rgb), .9);
}
.btn-outline {
  background: rgba(255,255,255,.025);
  border-color: var(--line-strong);
}
.btn-outline:hover { background: rgba(255,255,255,.07); border-color: rgba(255,255,255,.32); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-dim); padding-inline: 10px; }
.btn-ghost:hover { color: var(--ink); background: rgba(255,255,255,.04); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; gap: 8px; }
.btn-lg { min-height: 56px; padding: 0 30px; font-size: 16.5px; }
.btn-block { width: 100%; }
.btn-danger { --btn-bg: rgba(255, 77, 92, .12); --btn-ink: #ff8c97; --btn-line: rgba(255, 77, 92, .35); }
.btn-danger:hover { background: rgba(255, 77, 92, .2); }
.icon-btn {
  width: 38px; height: 38px; display: inline-grid; place-items: center;
  border: 1px solid var(--line); border-radius: 4px; background: rgba(255,255,255,.03);
  color: var(--ink-dim); transition: .2s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-strong); background: rgba(255,255,255,.07); }

/* ---------- badges / chips / tags ---------- */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(255,255,255,.035);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  white-space: nowrap;
}
.badge.team { border-color: rgba(var(--team-rgb), .35); background: rgba(var(--team-rgb), .1); color: color-mix(in srgb, var(--team) 72%, white); }
.badge.ok { color: var(--ok); border-color: rgba(66,224,165,.3); background: rgba(66,224,165,.08); }
.badge.warn { color: var(--warn); border-color: rgba(255,202,88,.28); background: rgba(255,202,88,.08); }
.badge.bad { color: var(--bad); border-color: rgba(255,96,114,.28); background: rgba(255,96,114,.08); }
.dot {
  width: 6px; height: 6px; border-radius: 99px; background: currentColor; display: inline-block;
  box-shadow: 0 0 8px currentColor;
}

/* ============================================================
   LANDING
   ============================================================ */
.landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  padding: clamp(18px, 3.2vw, 40px) clamp(20px, 4.5vw, 76px) 0;
}
.landing-bg {
  position: absolute;
  inset: 0;
  z-index: -2;
  overflow: hidden;
  background:
    radial-gradient(760px 520px at 73% 45%, rgba(var(--accent-rgb), .14), transparent 65%),
    linear-gradient(115deg, rgba(255,255,255,.02), transparent 40%);
}
.landing-bg::before {
  content: "";
  position: absolute;
  inset: -20%;
  background:
    repeating-linear-gradient(112deg, transparent 0 138px, rgba(255,255,255,.032) 139px 140px, transparent 141px 300px);
  mask-image: linear-gradient(90deg, transparent 10%, #000 65%, transparent 100%);
  opacity: .75;
}
.landing-bg::after {
  content: "26";
  position: absolute;
  top: 5%;
  right: -1%;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 900;
  font-size: clamp(330px, 46vw, 720px);
  line-height: .75;
  letter-spacing: -.09em;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.055);
  user-select: none;
}
.landing-glow {
  position: absolute;
  left: 58%; top: 32%;
  width: 46vw; height: 70vh;
  transform: translate(-50%, -50%) rotate(-18deg);
  background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), .1), transparent);
  filter: blur(70px);
  z-index: -1;
  pointer-events: none;
}
.landing-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: relative;
  z-index: 3;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border: 1px solid rgba(var(--accent-rgb), .55);
  background: linear-gradient(145deg, rgba(var(--accent-rgb), .2), rgba(var(--accent-rgb), .03));
  border-radius: 3px;
  position: relative;
  overflow: hidden;
}
.brand-mark::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.18), transparent 70%); transform: translateX(-120%); animation: markSweep 6s ease-in-out infinite; }
@keyframes markSweep { 0%, 65%, 100% { transform: translateX(-120%); } 80% { transform: translateX(120%); } }
.brand-mark svg { width: 22px; height: 22px; }
.brand-name {
  font-family: var(--font-display);
  font-weight: 800;
  font-style: italic;
  letter-spacing: -.035em;
  font-size: 20px;
  line-height: .9;
  text-transform: uppercase;
}
.brand-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .3em;
  color: var(--ink-mute);
  text-transform: uppercase;
  margin-top: 4px;
}
.top-meta { display: flex; align-items: center; gap: 14px; }
.top-link {
  font-family: var(--font-mono);
  font-size: 12.5px;
  letter-spacing: .1em;
  color: var(--ink-mute);
  text-transform: uppercase;
  transition: color .2s;
  border: 0;
  background: none;
  padding: 6px 0;
}
.top-link:hover { color: var(--ink); }
.top-sep { width: 1px; height: 16px; background: var(--line); }

.landing-hero {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1.02fr) minmax(380px, .98fr);
  align-items: center;
  gap: clamp(30px, 4vw, 70px);
  padding: clamp(36px, 6vh, 80px) 0 clamp(24px, 4vh, 56px);
  position: relative;
  z-index: 2;
}
.hero-copy { max-width: 760px; }
.hero-kicker { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.hero-kicker .line { width: 48px; height: 1px; background: var(--accent); }
.hero-kicker span {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .22em; color: var(--ink-dim); text-transform: uppercase;
}
.hero-title {
  font-family: var(--font-body);
  font-weight: 900;
  font-size: clamp(64px, 9.2vw, 144px);
  line-height: .82;
  letter-spacing: -.07em;
  margin-left: -.06em;
}
.hero-title .en {
  display: block;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 900;
  text-transform: uppercase;
  color: transparent;
  -webkit-text-stroke: 1px rgba(255,255,255,.32);
  font-size: .62em;
  letter-spacing: -.03em;
  line-height: .95;
  margin-bottom: .16em;
}
.hero-title .cn {
  display: block;
  background: linear-gradient(96deg, #fff 4%, #d5dce4 58%, rgba(255,255,255,.34));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  position: relative;
}
.hero-title .cn em {
  font-style: normal;
  color: var(--accent);
  -webkit-text-fill-color: var(--accent);
  text-shadow: 0 0 50px rgba(var(--accent-rgb), .28);
}
.hero-desc {
  max-width: 500px;
  margin-top: 28px;
  color: var(--ink-dim);
  font-size: 16.5px;
  line-height: 1.9;
}
.hero-desc strong { color: var(--ink); font-weight: 600; }
.hero-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 34px; }
.hero-note {
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-faint);
  letter-spacing: .08em;
  text-transform: uppercase;
}
.hero-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 38px; }
.hero-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 3px;
  background: rgba(255,255,255,.022);
  color: var(--ink-mute);
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: .11em;
  text-transform: uppercase;
}
.hero-pill::before { content: ""; width: 4px; height: 4px; background: var(--accent); border-radius: 99px; }

/* landing technical card */
.hero-visual { position: relative; min-height: 480px; display: flex; align-items: center; justify-content: center; }
.visual-orbit {
  position: absolute;
  width: min(34vw, 520px); aspect-ratio: 1;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 50%;
}
.visual-orbit::before {
  content: ""; position: absolute; inset: 12%; border: 1px dashed rgba(255,255,255,.075); border-radius: 50%;
  animation: orbitSpin 60s linear infinite;
}
.visual-orbit::after {
  content: ""; position: absolute; inset: 24%; border: 1px solid rgba(var(--accent-rgb), .18); border-radius: 50%;
  box-shadow: inset 0 0 60px rgba(var(--accent-rgb), .06);
}
@keyframes orbitSpin { to { transform: rotate(360deg); } }
.tech-card {
  position: relative;
  width: min(100%, 500px);
  border: 1px solid var(--line-strong);
  background:
    linear-gradient(145deg, rgba(255,255,255,.055), transparent 36%),
    linear-gradient(180deg, rgba(14,20,28,.94), rgba(9,12,17,.96));
  backdrop-filter: blur(14px);
  box-shadow: 0 40px 100px -40px rgba(0,0,0,.95);
  padding: 16px;
  border-radius: 6px;
  transform: rotate(-1.4deg);
  overflow: visible;
}
.tech-card::before, .tech-card::after {
  content: ""; position: absolute; width: 14px; height: 14px; border-color: rgba(var(--accent-rgb), .7); border-style: solid;
}
.tech-card::before { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.tech-card::after { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }
.tech-top, .tech-bottom {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--ink-mute); text-transform: uppercase;
}
.tech-top { padding: 2px 4px 12px; border-bottom: 1px solid var(--line); }
.tech-top .live { display: flex; align-items: center; gap: 6px; color: var(--accent); }
.tech-canvas {
  position: relative;
  padding: 8px 0 4px;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 30px 30px;
  margin: 2px 0;
}
.tech-canvas .car { width: 100%; height: auto; filter: drop-shadow(0 20px 22px rgba(0,0,0,.6)); }
.tech-canvas .scan {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.tech-canvas .scan::after {
  content: ""; position: absolute; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb), .8), transparent);
  box-shadow: 0 0 16px rgba(var(--accent-rgb), .5);
  animation: scan 7s ease-in-out infinite;
}
@keyframes scan { 0%, 100% { top: 18%; opacity: .2; } 50% { top: 82%; opacity: .8; } }
.tech-callouts { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px 10px; }
.callout { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; text-transform: uppercase; line-height: 1.6; }
.callout b { display: block; color: var(--ink-dim); font-weight: 500; font-size: 11px; }
.tech-bottom { padding: 12px 4px 0; border-top: 1px solid var(--line); }
.tech-bottom .progress {
  flex: 1; height: 2px; background: rgba(255,255,255,.08); margin: 0 6px; overflow: hidden;
}
.tech-bottom .progress i { display: block; height: 100%; width: 72%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.tech-tag {
  position: absolute; right: -16px; top: 52px;
  background: var(--accent); color: #08090c;
  font-family: var(--font-mono); font-size: 11px; font-weight: 800; letter-spacing: .12em;
  padding: 6px 14px; transform: rotate(2deg);
  box-shadow: 0 12px 30px -10px rgba(var(--accent-rgb), .8);
}
.visual-side {
  position: absolute; left: -34px; bottom: 26px;
  background: rgba(9,12,17,.88); border: 1px solid var(--line);
  padding: 12px 16px; min-width: 158px;
  backdrop-filter: blur(10px);
  border-left: 2px solid var(--accent);
  box-shadow: var(--shadow);
}
.visual-side .k { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .16em; text-transform: uppercase; }
.visual-side .v { font-family: var(--font-display); font-style: italic; font-weight: 800; font-size: 26px; letter-spacing: -.03em; line-height: 1.15; }
.visual-side .v small { font-size: 12px; color: var(--ink-mute); font-style: normal; letter-spacing: .05em; font-family: var(--font-mono); }

.landing-ticker {
  position: relative;
  z-index: 2;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  margin: 0 calc(clamp(20px, 4.5vw, 76px) * -1);
  padding: 0 clamp(20px, 4.5vw, 76px);
  height: 48px;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: rgba(255,255,255,.018);
}
.ticker-track { display: flex; align-items: center; gap: 34px; white-space: nowrap; animation: ticker 46s linear infinite; will-change: transform; }
.landing-ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes ticker { to { transform: translateX(-50%); } }
.ticker-item {
  display: inline-flex; align-items: center; gap: 9px;
  font-family: var(--font-mono); font-size: 9ch; font-size: 11.5px; letter-spacing: .12em; color: var(--ink-mute); text-transform: uppercase;
}
.ticker-item i { width: 4px; height: 4px; border-radius: 99px; background: var(--accent); display: inline-block; }
.ticker-item b { color: var(--ink-dim); font-weight: 500; }
.landing-foot {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 15px 0 17px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-faint); letter-spacing: .11em; text-transform: uppercase;
}
.landing-foot span { display: flex; align-items: center; gap: 7px; }

/* ============================================================
   TEAM SELECT
   ============================================================ */
.select-screen {
  min-height: 100vh;
  padding: clamp(18px, 3vw, 34px) clamp(20px, 4.5vw, 72px) 132px;
  display: flex;
  flex-direction: column;
}
.select-top {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: clamp(26px, 4.5vh, 48px);
}
.back-link {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute);
  border: 0; background: none; padding: 4px 0; transition: .2s;
}
.back-link:hover { color: var(--ink); gap: 12px; }
.select-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 30px; flex-wrap: wrap; margin-bottom: 30px; }
.select-heading h1 {
  font-size: clamp(34px, 4.6vw, 58px); font-weight: 800; letter-spacing: -.045em; line-height: 1.12;
}
.select-heading h1 span { color: var(--ink-faint); }
.select-heading p { color: var(--ink-mute); font-size: 15px; max-width: 380px; line-height: 1.8; }
.teams-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  flex: 1;
  align-content: start;
}
.team-card {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 306px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background:
    radial-gradient(130% 90% at 100% 0%, rgba(var(--team-rgb), .13), transparent 52%),
    linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.012) 46%, rgba(255,255,255,.005));
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  color: var(--ink);
  transition: transform .3s var(--ease), border-color .3s, box-shadow .3s, background .3s;
}
.team-card::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, var(--team), color-mix(in srgb, var(--team) 14%, transparent) 74%, transparent);
  opacity: .8;
}
.team-card::after {
  content: ""; position: absolute; right: -28%; top: -20%; width: 70%; height: 90%;
  background: linear-gradient(120deg, transparent 30%, rgba(var(--team-rgb), .07) 46%, transparent 62%);
  transform: translateX(-30%);
  transition: transform .6s var(--ease);
  pointer-events: none;
}
.team-card:hover { transform: translateY(-4px); border-color: rgba(var(--team-rgb), .38); box-shadow: 0 30px 60px -34px rgba(0,0,0,.9); }
.team-card:hover::after { transform: translateX(44%); }
.team-card.selected {
  border-color: rgba(var(--team-rgb), .78);
  box-shadow: 0 0 0 1px rgba(var(--team-rgb), .55), 0 30px 70px -34px rgba(var(--team-rgb), .4);
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(var(--team-rgb), .21), transparent 55%),
    linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.014));
}
.team-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: relative; z-index: 1; }
.team-identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
.team-mono {
  flex: 0 0 auto;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 1px solid rgba(var(--team-rgb), .38);
  background: linear-gradient(145deg, rgba(var(--team-rgb), .18), rgba(var(--team-rgb), .035));
  color: color-mix(in srgb, var(--team) 70%, white);
  font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 16.5px; letter-spacing: -.05em;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
}
.team-name-wrap { min-width: 0; }
.team-name-en {
  font-family: var(--font-display); font-weight: 800; letter-spacing: -.015em; font-size: 18.5px; text-transform: uppercase; line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.team-name-cn { font-size: 13px; color: var(--ink-mute); margin-top: 4px; display: flex; align-items: center; gap: 7px; }
.team-name-cn i { width: 14px; height: 2px; background: var(--team); display: inline-block; }
.team-diff { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.pips { display: flex; gap: 3px; }
.pips i { width: 4px; height: 12px; background: rgba(255,255,255,.1); border-radius: 1px; }
.pips i.on { background: var(--team); box-shadow: 0 0 7px rgba(var(--team-rgb), .55); }
.team-diff span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .06em; white-space: nowrap; }
.team-desc {
  font-size: 14px; color: var(--ink-mute); line-height: 1.7; margin-top: 16px; min-height: 40px;
  position: relative; z-index: 1;
}
.team-car-row {
  display: flex; align-items: center; gap: 12px; margin-top: 18px; position: relative; z-index: 1;
}
.team-car-row .mini-car { width: 76px; opacity: .8; flex: 0 0 auto; }
.team-signal { flex: 1; }
.signal-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
.signal-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
.signal-val { font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); }
.signal-bar { height: 3px; background: rgba(255,255,255,.07); overflow: hidden; }
.signal-bar i { display: block; height: 100%; background: linear-gradient(90deg, rgba(var(--team-rgb), .45), var(--team)); }
.team-drivers { display: flex; gap: 6px; margin-top: 15px; position: relative; z-index: 1; }
.driver-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 7px 5px 5px;
  border: 1px solid var(--line); border-radius: 2px; background: rgba(0,0,0,.14);
  font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-dim); letter-spacing: .03em;
}
.helmet-mini {
  width: 17px; height: 17px; border-radius: 50%;
  background:
    linear-gradient(180deg, transparent 48%, rgba(0,0,0,.55) 49% 62%, transparent 63%),
    radial-gradient(circle at 35% 30%, #eef3fa, var(--team) 66%);
  border: 1px solid rgba(255,255,255,.18);
  flex: 0 0 auto;
}
.team-goal {
  margin-top: auto; padding-top: 15px; padding-right: 28px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 1;
}
.team-goal span { font-size: 12px; color: var(--ink-mute); }
.team-goal b { font-family: var(--font-mono); font-size: 11px; color: color-mix(in srgb, var(--team) 65%, white); letter-spacing: .03em; font-weight: 600; text-align: right; }
.team-check {
  position: absolute; right: 16px; bottom: 16px; width: 22px; height: 22px;
  border-radius: 50%; background: var(--team); color: #07090c;
  display: grid; place-items: center; font-size: 14px; font-weight: 900;
  opacity: 0; transform: scale(.6); transition: .25s var(--ease);
}
.team-card.selected .team-check { opacity: 1; transform: scale(1); }

.select-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  padding: 14px clamp(20px, 4.5vw, 72px);
  background: rgba(7, 10, 14, .9);
  border-top: 1px solid var(--line-strong);
  backdrop-filter: blur(18px);
}
.contract-preview { display: flex; align-items: center; gap: 20px; min-width: 0; }
.contract-empty { color: var(--ink-mute); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.contract-empty .kbd {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border: 1px solid var(--line);
  border-radius: 3px; color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px;
}
.contract-team { display: flex; align-items: center; gap: 12px; }
.contract-meta { display: flex; align-items: center; gap: 22px; }
.contract-stat .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; color: var(--ink-faint); text-transform: uppercase; }
.contract-stat .v { font-family: var(--font-mono); font-size: 14px; color: var(--ink-dim); margin-top: 2px; }
.contract-stat .v b { color: var(--ink); font-weight: 600; }
.select-bar .btn { flex: 0 0 auto; }

/* ============================================================
   MODALS / TOASTS
   ============================================================ */
.overlay {
  position: fixed; inset: 0; z-index: 200;
  display: grid; place-items: center;
  padding: 22px;
  background: rgba(3, 5, 8, .78);
  backdrop-filter: blur(12px);
  animation: overlayIn .22s ease both;
}
@keyframes overlayIn { from { opacity: 0; } }
.modal {
  position: relative;
  width: min(100%, 540px);
  max-height: min(88vh, 800px);
  overflow: auto;
  padding: 28px;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(var(--team-rgb), .1), transparent 58%),
    linear-gradient(165deg, #141b24, #0b0f15 68%);
  box-shadow: 0 50px 130px -30px rgba(0,0,0,.96);
  animation: modalIn .36s var(--ease) both;
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(.98); } }
.modal::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--team), transparent 72%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.modal-title { font-size: 22px; font-weight: 750; letter-spacing: -.025em; line-height: 1.25; margin-top: 7px; }
.modal-close {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: rgba(255,255,255,.03); color: var(--ink-mute);
  display: grid; place-items: center; font-size: 17.5px; transition: .2s;
}
.modal-close:hover { color: var(--ink); background: rgba(255,255,255,.08); }
.modal-body { color: var(--ink-dim); font-size: 15px; line-height: 1.75; }
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; flex-wrap: wrap; }

#toast-root { position: fixed; right: 18px; top: 18px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 10px;
  min-width: 220px; max-width: min(90vw, 380px);
  padding: 12px 16px;
  background: rgba(17, 24, 33, .96);
  border: 1px solid var(--line-strong);
  border-left: 2px solid var(--accent);
  border-radius: 3px;
  font-size: 14px; color: var(--ink-dim);
  box-shadow: 0 24px 60px -24px #000;
  animation: toastIn .35s var(--ease) both;
}
.toast.out { animation: toastOut .3s ease forwards; }
.toast b { color: var(--ink); font-weight: 600; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
.toast:nth-last-child(n+3) { display: none; }
@keyframes toastOut { to { opacity: 0; transform: translateX(16px); } }

/* ---------- no-save modal (generic) ---------- */
.confirm-points { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); margin: 16px 0; }
.confirm-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 13px; border-bottom: 1px solid var(--line); font-size: 14px; }
.confirm-row:last-child { border-bottom: 0; }
.confirm-row span { color: var(--ink-mute); }
.confirm-row b { color: var(--ink); font-family: var(--font-mono); font-weight: 500; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1180px) {
  .landing-hero { grid-template-columns: 1fr; padding-top: 42px; }
  .hero-copy { max-width: 820px; }
  .hero-visual { display: none; }
  .hero-title { font-size: clamp(66px, 13vw, 140px); }
  .teams-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .landing { padding-inline: 20px; }
  .landing-ticker { margin-inline: -20px; padding-inline: 20px; }
  .landing-foot { flex-direction: column; align-items: flex-start; gap: 8px; }
  .top-meta .top-link:first-child { display: none; }
  .hero-title { font-size: clamp(56px, 15vw, 104px); }
  .hero-desc { font-size: 15.5px; }
  .hero-kicker { margin-bottom: 20px; }
  .select-screen { padding-inline: 18px; padding-bottom: 160px; }
  .select-heading { margin-bottom: 22px; }
  .teams-grid { grid-template-columns: 1fr; }
  .team-card { min-height: 274px; }
  .select-bar { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px 18px; }
  .contract-preview { justify-content: space-between; }
  .contract-meta { gap: 14px; }
  .contract-meta .contract-stat:nth-child(3) { display: none; }
  .select-bar .btn { width: 100%; }
  .tech-card { display: none; }
}
@media (max-width: 520px) {
  .landing-top .top-meta { gap: 8px; }
  .hero-actions .btn { width: 100%; }
  .hero-actions { align-items: stretch; }
  .hero-pills { margin-top: 26px; }
  .hero-pills .hero-pill:nth-child(n+4) { display: none; }
  .contract-team .team-mono { display: none; }
  .contract-meta .contract-stat:nth-child(2) { display: none; }
  .select-heading h1 { font-size: 34px; }
  .select-heading p { font-size: 14px; }
  .modal { padding: 22px; }
  .modal-actions .btn { flex: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---------- 2026 11-team grid / disclaimer ---------- */
.teams-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.teams-grid .team-card { min-height: 300px; }
.team-drivers { flex-wrap: wrap; }
.select-disclaimer {
  max-width: 900px;
  margin-top: 14px;
  font-family: var(--font-mono);
  font-size: 9.5px;
  line-height: 1.6;
  letter-spacing: .03em;
  color: var(--ink-faint);
}
@media (max-width: 1360px) { .teams-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1040px) { .teams-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 700px) { .teams-grid { grid-template-columns: 1fr; } }

/* ---------- long official team names ---------- */
.team-name-en {
  white-space: normal;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  font-size: 16.5px;
  line-height: 1.12;
  padding-right: 2px;
}
.team-identity { align-items: flex-start; }
.team-mono { margin-top: 1px; }
.select-disclaimer { font-size: 10.5px; max-width: 1000px; }

/* ============================================================
   SAVE SLOTS
   ============================================================ */
.save-slots-section {
  position: relative;
  z-index: 2;
  margin-top: 8px;
  padding: clamp(26px, 4.5vh, 46px) 0 clamp(22px, 3.5vh, 38px);
  border-top: 1px solid var(--line);
  scroll-margin-top: 20px;
}
.save-slots-heading { display: flex; justify-content: space-between; align-items: flex-end; gap: 28px; margin-bottom: 17px; }
.save-slots-heading h2 { font-size: clamp(22px, 2.8vw, 32px); font-weight: 800; letter-spacing: -.04em; line-height: 1.2; margin-top: 6px; }
.save-slots-heading > p { max-width: 380px; color: var(--ink-mute); font-size: 12.5px; line-height: 1.7; text-align: right; }
.save-slots-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.slot-card {
  min-height: 230px;
  border: 1px solid var(--line);
  background:
    radial-gradient(130% 100% at 100% 0%, rgba(var(--team-rgb), .10), transparent 58%),
    linear-gradient(155deg, rgba(255,255,255,.04), rgba(255,255,255,.012) 60%),
    #0b1016;
  padding: 13px;
  border-radius: 4px;
  position: relative;
  display: flex;
  flex-direction: column;
  transition: border-color .25s, transform .25s, box-shadow .25s;
}
.slot-card.slot-filled { border-color: rgba(var(--team-rgb), .22); }
.slot-card.slot-filled::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, var(--team), transparent 70%); }
.slot-card.slot-filled:hover { border-color: rgba(var(--team-rgb), .55); transform: translateY(-3px); box-shadow: 0 24px 50px -30px rgba(0,0,0,.9); }
.slot-card.slot-empty { border-style: dashed; background: rgba(255,255,255,.012); }
.slot-card.slot-empty:hover { border-color: var(--line-strong); }
.slot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.slot-index { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .12em; }
.slot-state { font-family: var(--font-mono); font-size: 8.5px; color: color-mix(in srgb, var(--team) 64%, white); border: 1px solid rgba(var(--team-rgb),.26); padding: 2px 5px; letter-spacing: .05em; }
.slot-empty .slot-state { color: var(--ink-faint); border-color: var(--line); }
.slot-team-row { display: flex; align-items: center; gap: 8px; margin-top: 13px; }
.slot-team-row .team-mono { width: 31px; height: 31px; font-size: 12px; }
.slot-team-row > div { min-width: 0; }
.slot-team-row b { display: block; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 16.5px; letter-spacing: -.015em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-team-row span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.slot-team-row em { margin-left: auto; font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }
.slot-drivers { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 9px; }
.slot-driver { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 2px; padding: 3px 5px 3px 3px; font-size: 10px; color: var(--ink-mute); }
.slot-driver .avatar { width: 17px; height: 17px; }
.slot-driver .avatar b { display: none; }
.slot-driver i { font-style: normal; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); }
.slot-info { display: grid; grid-template-columns: 1.1fr .9fr 1.2fr; gap: 8px; margin-top: 11px; border-top: 1px solid var(--line); padding-top: 8px; }
.slot-info span { display: block; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.slot-info b { display: block; font-size: 10.5px; color: var(--ink-mute); font-weight: 500; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-actions { display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 11px; }
.slot-actions .btn { flex: 1; }
.slot-clear { border: 0; background: none; color: var(--ink-faint); font-family: var(--font-mono); font-size: 9px; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.slot-clear:hover { color: var(--bad); }
.slot-imported { position: absolute; right: 10px; bottom: 44px; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); }
.slot-empty-body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; padding: 8px 4px 14px; }
.slot-empty-mark { width: 27px; height: 27px; border: 1px solid var(--line-strong); display: grid; place-items: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 16px; margin-bottom: 8px; }
.slot-empty-body h3 { font-size: 17.5px; font-weight: 700; letter-spacing: -.02em; }
.slot-empty-body p { max-width: 240px; font-size: 10.5px; line-height: 1.55; color: var(--ink-faint); margin-top: 4px; }
.slot-empty > .btn { width: 100%; }
.save-slots-foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 10px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); line-height: 1.5; }
.save-slots-foot span:last-child { color: var(--ink-mute); white-space: nowrap; }
@media (max-width: 1000px) {
  .save-slots-grid { grid-template-columns: 1fr; }
  .slot-card { min-height: 0; }
  .slot-empty-body { padding-top: 18px; }
  .save-slots-heading { flex-direction: column; align-items: flex-start; gap: 8px; }
  .save-slots-heading > p { text-align: left; max-width: 520px; }
  .slot-team-row b { font-size: 16px; }
}
@media (max-width: 700px) {
  .slot-info { grid-template-columns: 1fr 1fr; }
  .slot-info > div:last-child { grid-column: 1 / -1; }
  .save-slots-foot { flex-direction: column; gap: 4px; }
}
.slot-imported { display: inline-block; margin-top: 5px; font-family: var(--font-mono); font-size: 8px; color: var(--ink-faint); letter-spacing: .03em; }

/* ---------- collapsible secondary copy ---------- */
details.fold {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.014);
  border-radius: 3px;
  overflow: hidden;
}
details.fold > summary {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  cursor: pointer;
  list-style: none;
  color: var(--ink-mute);
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.4;
  transition: color .18s, background .18s;
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::marker { content: ""; }
details.fold > summary:hover { color: var(--ink-dim); background: rgba(255,255,255,.025); }
details.fold[open] > summary { border-bottom: 1px solid var(--line); color: var(--ink-dim); }
details.fold .fold-arrow { margin-left: auto; font-family: var(--font-mono); font-size: 15px; color: var(--ink-faint); transition: transform .18s; }
details.fold[open] .fold-arrow { transform: rotate(90deg); color: var(--accent); }
details.fold .fold-body { padding: 10px 13px 12px; font-size: 13px; line-height: 1.7; color: var(--ink-mute); }
details.fold.fold-mini > summary { padding: 7px 10px; font-size: 11.5px; }
details.fold.fold-mini .fold-body { padding: 8px 10px 10px; font-size: 12px; }
details.fold.fold-plain { border: 0; background: transparent; }
details.fold.fold-plain > summary { padding: 0; }
details.fold.fold-plain .fold-body { padding: 7px 0 0; }

/* prevent label breaks in tight team cards */
.team-goal span { white-space: nowrap; flex: 0 0 auto; }
.team-goal b { flex: 1; }

/* ============================================================
   SEASON CALENDAR BUILDER
   ============================================================ */
.modal-xl {
  width: min(100%, 1180px);
  max-height: 94vh;
  padding: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.modal-xl .modal-head { flex: 0 0 auto; }
.modal-xl .modal-body { flex: 1 1 auto; min-height: 0; }
.modal-xl .modal-actions { flex: 0 0 auto; margin-top: 14px; }
.schedule-editor {
  display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(300px, .55fr);
  gap: 12px; height: min(62vh, 610px); min-height: 360px;
}
.schedule-pool, .schedule-selected {
  border: 1px solid var(--line); border-radius: 4px;
  background:
    linear-gradient(160deg, rgba(255,255,255,.026), transparent 36%),
    rgba(8, 12, 17, .72);
  display: flex; flex-direction: column; min-height: 0; overflow: hidden;
}
.schedule-pool-head {
  flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
  padding: 10px 11px; border-bottom: 1px solid var(--line);
}
.schedule-search {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line-strong); border-radius: 3px;
  padding: 0 10px; background: rgba(255,255,255,.025);
}
.schedule-search .icon { width: 15px; height: 15px; color: var(--ink-faint); flex: 0 0 auto; }
.schedule-search input {
  flex: 1; min-width: 0; height: 34px; border: 0; outline: 0;
  background: transparent; color: var(--ink);
  font-size: 12px; font-family: var(--font-body);
}
.schedule-search input::placeholder { color: var(--ink-faint); }
.schedule-search input::-webkit-search-cancel-button { filter: invert(.6); }
.schedule-pool-scroll, .schedule-selected-scroll {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
}
.schedule-pool-scroll { padding: 10px; }
.schedule-group + .schedule-group { margin-top: 14px; }
.schedule-group-head {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 2px 7px; border-bottom: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-mute);
  letter-spacing: .05em;
}
.schedule-group-head small { color: var(--ink-faint); font-size: 8.5px; }
.schedule-group-head b { margin-left: auto; font-weight: 500; color: var(--ink-faint); }
.schedule-group-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.schedule-option {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) 22px;
  gap: 8px; align-items: center; text-align: left;
  padding: 7px; border: 1px solid var(--line); border-radius: 3px;
  background: rgba(255,255,255,.018); color: var(--ink-dim);
  transition: border-color .16s, background .16s;
}
.schedule-option:hover { border-color: rgba(var(--accent-rgb), .38); background: rgba(var(--accent-rgb), .045); }
.schedule-option.is-classic { border-left: 2px solid rgba(255,202,88,.42); }
.schedule-option.is-picked { border-color: rgba(66,224,165,.35); background: rgba(66,224,165,.045); opacity: .78; }
.schedule-option:disabled { cursor: default; }
.schedule-option-map {
  width: 58px; height: 46px; border: 1px solid var(--line);
  background: rgba(0,0,0,.18); color: var(--accent);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.schedule-option-map svg { width: 54px; height: 42px; }
.schedule-option-copy { min-width: 0; }
.schedule-option-copy b { display: block; font-size: 12px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.schedule-option-copy small { display: block; font-size: 9px; color: var(--ink-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.schedule-option-copy em { display: block; font-style: normal; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.schedule-option-add {
  width: 22px; height: 22px; border: 1px solid var(--line);
  display: grid; place-items: center; color: var(--ink-faint);
}
.schedule-option-add .icon { width: 12px; height: 12px; }
.schedule-option.is-picked .schedule-option-add { color: var(--ok); border-color: rgba(66,224,165,.3); }
.schedule-selected-head {
  flex: 0 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
  padding: 10px 11px; border-bottom: 1px solid var(--line);
}
.schedule-selected-head > div:first-child span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .07em; text-transform: uppercase; }
.schedule-selected-head > div:first-child b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.schedule-selected-head > div:first-child b i { font-style: normal; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.schedule-selected-tools { display: flex; gap: 4px; }
.schedule-selected-tools button {
  border: 1px solid var(--line); background: rgba(255,255,255,.025);
  color: var(--ink-faint); font-family: var(--font-mono); font-size: 8.5px;
  padding: 4px 6px; border-radius: 2px; transition: .16s;
}
.schedule-selected-tools button:hover { color: var(--accent); border-color: rgba(var(--accent-rgb), .4); }
.schedule-selected-scroll { padding: 6px 8px; }
.schedule-selected-row {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 7px; align-items: center; padding: 6px 4px;
  border-bottom: 1px solid rgba(255,255,255,.045);
}
.schedule-selected-row.is-classic { border-left: 2px solid rgba(255,202,88,.4); padding-left: 6px; }
.ssr-round { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.ssr-main { min-width: 0; }
.ssr-main b { display: block; font-size: 10px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ssr-main small { display: block; font-family: var(--font-mono); font-size: 7.5px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.ssr-actions { display: flex; gap: 2px; }
.ssr-actions button {
  width: 21px; height: 21px; border: 1px solid var(--line);
  background: rgba(255,255,255,.02); color: var(--ink-mute);
  font-family: var(--font-mono); font-size: 10px; line-height: 1; border-radius: 2px;
}
.ssr-actions button:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
.ssr-actions button:disabled { opacity: .25; cursor: default; }
.ssr-actions .ssr-remove:hover { color: var(--bad); border-color: rgba(255,96,114,.35); }
.schedule-selected-note {
  flex: 0 0 auto; border-top: 1px solid var(--line);
  padding: 8px 11px; font-family: var(--font-mono); font-size: 8px;
  color: var(--ink-faint); line-height: 1.55;
}
.schedule-empty { padding: 24px 14px; text-align: center; font-size: 10px; color: var(--ink-faint); line-height: 1.65; }
.schedule-selected-empty { padding: 30px 16px; }
.schedule-edit-card {
  margin: 0 16px 10px; border: 1px solid var(--line);
  background: rgba(255,255,255,.018); padding: 9px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.schedule-edit-copy { min-width: 0; }
.schedule-edit-copy .eyebrow { font-size: 8px; }
.schedule-edit-copy b { display: block; font-size: 10px; color: var(--ink-dim); margin-top: 3px; line-height: 1.45; }
.schedule-edit-copy small { display: block; font-size: 8.5px; color: var(--ink-faint); margin-top: 2px; }
.schedule-edit-card .btn { flex: 0 0 auto; }
.off-calendar-body { padding: 11px 13px 13px; }
.off-calendar-route { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-dim); }
.off-calendar-route span { font-weight: 600; }
.off-calendar-route i { color: var(--accent); font-style: normal; }
.off-calendar-body p { font-size: 9.5px; color: var(--ink-faint); line-height: 1.6; margin: 8px 0 10px; }
.calendar-control-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  border: 1px solid var(--line); background: rgba(255,255,255,.018);
  padding: 10px 13px; margin-bottom: 10px;
}
.calendar-mode { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.calendar-mode-tag {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid rgba(66,224,165,.28); background: rgba(66,224,165,.06);
  color: var(--ok); font-family: var(--font-mono); font-size: 8.5px;
  padding: 3px 7px; letter-spacing: .04em; white-space: nowrap;
}
.calendar-mode-tag.is-custom { color: var(--warn); border-color: rgba(255,202,88,.3); background: rgba(255,202,88,.06); }
.calendar-mode-tag .dot { width: 4px; height: 4px; }
.calendar-mode b { font-size: 11.5px; color: var(--ink-dim); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.calendar-mode small { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); }
.calendar-control-row .btn { flex: 0 0 auto; }
.calendar-lock-note { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); white-space: nowrap; }
.classic-cal-tag {
  display: inline-block; font-family: var(--font-mono); font-size: 7.5px;
  color: var(--warn); border: 1px solid rgba(255,202,88,.28);
  padding: 1px 4px; margin-left: 4px; vertical-align: 2px; letter-spacing: .04em;
}
@media (max-width: 900px) {
  .modal-xl { width: 100%; padding: 16px; overflow-y: auto; }
  .schedule-editor { grid-template-columns: 1fr; height: auto; }
  .schedule-pool { max-height: 44vh; }
  .schedule-selected { max-height: 38vh; }
  .calendar-control-row { flex-direction: column; align-items: flex-start; gap: 8px; }
}
@media (max-width: 620px) {
  .schedule-group-grid { grid-template-columns: 1fr; }
  .schedule-selected-head { flex-direction: column; align-items: flex-start; }
  .schedule-option { grid-template-columns: 48px minmax(0,1fr) 20px; }
  .schedule-option-map { width: 48px; height: 40px; }
  .schedule-option-map svg { width: 44px; height: 36px; }
  .calendar-mode { gap: 6px; }
}

@media (max-width: 900px) {
  .modal-xl .modal-body { flex: 0 0 auto; }
  .modal-xl .schedule-editor { height: auto; }
  .schedule-pool { max-height: 32vh; }
  .schedule-selected { max-height: 30vh; }
  .modal-xl .modal-actions { flex: 0 0 auto; }
}

/* ---- setup.css ---- */
/* ============================================================
   PRE-SEASON GARAGE — design / line-up / commercial
   ============================================================ */

.icon { width: 18px; height: 18px; flex: 0 0 auto; }
.brand-button { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); }
.brand-button:hover .brand-name { color: var(--accent); }
.brand-compact .brand-mark { width: 32px; height: 32px; }
.brand-compact .brand-mark svg { width: 18px; height: 18px; }
.brand-compact .brand-name { font-size: 18.5px; }
.brand-compact .brand-sub { font-size: 9px; }

/* ---------- driver avatar ---------- */
.avatar {
  position: relative;
  width: 38px; height: 38px; flex: 0 0 auto;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .18);
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.85), transparent 18%),
    linear-gradient(135deg, color-mix(in srgb, var(--c) 92%, white), color-mix(in srgb, var(--c) 45%, #070a0e));
  box-shadow: inset 0 -6px 12px rgba(0,0,0,.35);
  overflow: hidden;
}
.avatar::before {
  content: "";
  position: absolute; left: 50%; top: 8%;
  width: 46%; height: 90%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35) 48%, rgba(255,255,255,.05));
  border-radius: 50%;
}
.avatar-visor {
  position: absolute; left: 18%; right: 9%; top: 37%; height: 27%;
  background: linear-gradient(180deg, #101722, #030507);
  border-top: 1px solid rgba(255,255,255,.42);
  border-radius: 40% 22% 32% 42%;
  transform: skewX(-9deg);
}
.avatar b {
  position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%);
  font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ink);
  text-shadow: 0 1px 3px #000;
  letter-spacing: -.04em;
}
.avatar-lg { width: 54px; height: 54px; }
.avatar-lg b { font-size: 11px; }
.avatar-lg .avatar-visor { height: 25%; }

.driver-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-dim); }
.driver-tag i { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.tyre-pill { display: inline-flex; align-items: center; gap: 4px; }
.tyre-pill i {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--tyre); color: var(--tyre);
  display: grid; place-items: center; font-style: normal;
  font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.5);
}
.tyre-pill em { font-style: normal; font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute); }

/* ---------- setup shell ---------- */
.setup-screen {
  min-height: 100vh;
  background:
    radial-gradient(1000px 500px at 74% -8%, rgba(var(--accent-rgb), .10), transparent 65%),
    linear-gradient(180deg, #070a0e, #080b10);
  position: relative;
  overflow: hidden;
}
.setup-rail {
  position: fixed; left: -16px; top: 35%;
  transform: rotate(-90deg);
  transform-origin: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .55em;
  color: rgba(255,255,255,.13);
  pointer-events: none;
  z-index: 0;
}
.setup-container { width: min(1480px, 100%); margin: 0 auto; padding: 18px clamp(18px, 3.4vw, 50px) 30px; position: relative; z-index: 1; }
.setup-top {
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
  padding: 2px 0 18px;
  border-bottom: 1px solid var(--line);
}
.setup-team-id { display: flex; align-items: center; gap: 10px; }
.setup-team-name { font-family: var(--font-display); font-weight: 800; font-size: 17.5px; letter-spacing: -.02em; margin-top: 2px; }
.setup-top-meta { display: flex; align-items: stretch; gap: 0; border: 1px solid var(--line); background: rgba(255,255,255,.022); }
.top-stat { padding: 8px 16px; min-width: 120px; border-left: 1px solid var(--line); }
.top-stat:first-child { border-left: 0; }
.top-stat span { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; color: var(--ink-faint); text-transform: uppercase; }
.top-stat b { display: block; font-size: 14px; color: var(--ink-dim); font-weight: 600; margin-top: 3px; }
.top-stat b.mono { font-size: 15px; color: var(--ink); }
.setup-steps {
  display: flex; align-items: stretch; gap: 0;
  margin-top: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.014);
}
.setup-step {
  flex: 1; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  background: transparent; border: 0; border-right: 1px solid var(--line);
  text-align: left; color: var(--ink-mute);
  transition: background .2s, color .2s;
  position: relative;
}
.setup-step:hover { background: rgba(255,255,255,.025); color: var(--ink-dim); }
.setup-step.active { background: rgba(var(--accent-rgb), .07); color: var(--ink); }
.setup-step.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
.setup-step.done .step-index { color: var(--ok); border-color: rgba(66,224,165,.35); background: rgba(66,224,165,.08); }
.setup-step .step-index {
  width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 50%;
  display: grid; place-items: center; flex: 0 0 auto;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-mute);
}
.setup-step .step-index .icon { width: 12px; height: 12px; }
.step-copy { display: flex; flex-direction: column; min-width: 0; }
.step-copy small { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .12em; text-transform: uppercase; }
.step-copy b { font-size: 14.5px; font-weight: 600; margin-top: 1px; }
.step-state { margin-left: auto; font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; color: var(--ink-faint); }
.setup-step.active .step-state { color: var(--accent); }
.setup-step.done .step-state { color: var(--ok); }
.setup-progress-mini {
  display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-width: 134px;
}
.setup-progress-mini span { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); }
.setup-progress-mini > i { flex: 1; height: 3px; background: rgba(255,255,255,.08); display: block; }
.setup-progress-mini > i b { display: block; height: 100%; background: var(--accent); transition: width .4s var(--ease); }

.setup-page { padding: clamp(22px, 3.5vh, 42px) 0 46px; animation: screenIn .45s var(--ease) both; }
.setup-page-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
  margin-bottom: 24px;
}
.setup-page-head h1 {
  font-size: clamp(28px, 3.3vw, 44px);
  font-weight: 800; letter-spacing: -.045em; line-height: 1.2; margin-top: 10px;
}
.setup-page-head p {
  color: var(--ink-mute); font-size: 14.5px; line-height: 1.8; max-width: 640px; margin-top: 10px;
}
.setup-page-aside {
  flex: 0 0 250px; border-left: 2px solid var(--accent); padding: 2px 0 2px 15px;
}
.setup-page-aside span { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.setup-page-aside b { display: block; margin-top: 5px; font-size: 14px; color: var(--ink-dim); font-weight: 600; line-height: 1.55; }
.setup-page-aside b.mono { font-size: 20px; color: var(--ink); font-weight: 500; }
.setup-page-aside b small { font-size: 11px; color: var(--ink-faint); }

.panel {
  border: 1px solid var(--line);
  background:
    linear-gradient(160deg, rgba(255,255,255,.032), transparent 40%),
    rgba(12, 17, 23, .78);
  border-radius: 5px;
  position: relative;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); min-height: 48px;
}
.panel-title { font-size: 14.5px; font-weight: 650; color: var(--ink); letter-spacing: .01em; }
.panel-title em {
  font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
  letter-spacing: .12em; margin-left: 8px;
}
.panel-hint { font-family: var(--font-mono); font-size: 10px; letter-spacing: .05em; color: var(--ink-faint); }
.panel-lead { font-size: 13.5px; color: var(--ink-mute); line-height: 1.7; padding: 12px 16px 0; }
.note-line {
  display: flex; align-items: flex-start; gap: 7px;
  padding: 10px 16px; border-top: 1px solid var(--line);
  color: var(--ink-faint); font-size: 12px; line-height: 1.6;
}
.note-line .icon { width: 13px; height: 13px; margin-top: 1px; color: var(--ink-faint); }
.text-btn {
  background: none; border: 0; color: var(--ink-mute); font-size: 13px; padding: 6px 0;
  border-bottom: 1px solid transparent; transition: .2s;
}
.text-btn:hover { color: var(--ink); border-color: var(--line-strong); }
.empty-state { padding: 34px; text-align: center; color: var(--ink-mute); font-size: 14px; border: 1px dashed var(--line); }

/* ---------- design step ---------- */
.design-layout { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, .98fr); gap: 14px; align-items: start; }
.blueprint-panel { overflow: hidden; }
.blueprint-stage {
  position: relative; min-height: 336px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 26px 18px 10px;
  background:
    radial-gradient(circle at 50% 55%, rgba(var(--team-rgb), .09), transparent 56%),
    linear-gradient(160deg, rgba(255,255,255,.025), transparent 58%);
}
.blueprint-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: radial-gradient(ellipse at center, #000 4%, transparent 72%);
  opacity: .5;
}
.blueprint-stage .blueprint-car {
  width: min(100%, 620px); height: auto; position: relative; z-index: 1;
  filter: drop-shadow(0 30px 30px rgba(0,0,0,.55));
  animation: carReveal .8s var(--ease) both;
}
@keyframes carReveal { from { opacity: 0; transform: translateY(10px) scale(.98); } }
.blueprint-watermark {
  position: absolute; left: 18px; top: 16px;
  font-family: var(--font-display); font-style: italic; font-weight: 900;
  font-size: 48px; line-height: 1; letter-spacing: -.06em;
  color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,.075);
}
.car-ovr-badge {
  position: absolute; right: 18px; bottom: 14px; z-index: 2;
  display: flex; align-items: baseline; gap: 6px;
  border-left: 2px solid var(--accent); padding: 4px 0 4px 12px;
  background: linear-gradient(90deg, rgba(8,11,16,.5), transparent);
}
.car-ovr-badge span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .08em; display: block; align-self: center; }
.car-ovr-badge strong { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 46px; line-height: .9; letter-spacing: -.06em; color: var(--ink); }
.car-ovr-badge i { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.blueprint-stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); }
.bp-stat { padding: 12px 14px; border-left: 1px solid var(--line); }
.bp-stat:first-child { border-left: 0; }
.bp-stat span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; display: block; }
.bp-stat b { display: block; font-family: var(--font-display); font-style: italic; font-weight: 800; letter-spacing: -.03em; font-size: 22px; line-height: 1.1; margin-top: 2px; }
.bp-stat > i { display: block; height: 2px; background: rgba(255,255,255,.07); margin-top: 7px; }
.bp-stat > i em { display: block; height: 100%; background: var(--accent); }

.design-controls { padding-bottom: 14px; }
.design-controls .panel-head { padding-bottom: 12px; }
.philosophy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px 4px; }
.philosophy {
  display: flex; flex-direction: column; text-align: left; gap: 7px;
  padding: 12px;
  min-height: 146px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.022);
  color: var(--ink-dim); border-radius: 3px;
  transition: border-color .2s, background .2s, transform .2s;
}
.philosophy:hover { border-color: var(--line-strong); background: rgba(255,255,255,.045); transform: translateY(-1px); }
.philosophy.active {
  border-color: rgba(var(--team-rgb), .65);
  background:
    radial-gradient(120% 120% at 100% 0%, rgba(var(--team-rgb), .14), transparent 58%),
    rgba(255,255,255,.035);
}
.philosophy.active::after { content: ""; position: absolute; }
.phil-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.phil-head b { color: var(--ink); font-size: 15px; font-weight: 700; }
.phil-head small { font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; color: var(--ink-faint); }
.phil-desc { font-size: 12.5px; line-height: 1.6; color: var(--ink-mute); }
.phil-note { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .03em; margin-top: auto; }
.phil-ticks { display: flex; flex-wrap: wrap; gap: 4px; }
.phil-ticks i { font-style: normal; font-family: var(--font-mono); font-size: 10px; padding: 2px 5px; border-radius: 2px; background: rgba(255,255,255,.04); color: var(--ink-dim); }
.phil-ticks i.up { color: var(--ok); background: rgba(66,224,165,.07); }
.phil-ticks i.down { color: var(--bad); background: rgba(255,96,114,.07); }

.alloc-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 16px 10px; }
.alloc-head .panel-hint { display: block; margin-top: 4px; }
.points-left { text-align: right; }
.points-left b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 30px; line-height: .9; letter-spacing: -.04em; color: var(--accent); display: block; }
.points-left span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.points-left.empty b { color: var(--ok); }
.alloc-list { padding: 0 16px; }
.alloc-row { padding: 9px 0; border-bottom: 1px solid var(--line); }
.alloc-row:last-child { border-bottom: 0; }
.alloc-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.alloc-name { font-size: 13.5px; color: var(--ink-dim); }
.alloc-name small { font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; color: var(--ink-faint); margin-left: 7px; }
.alloc-delta { display: flex; gap: 4px; }
.alloc-delta i { font-style: normal; font-size: 10.5px; font-family: var(--font-mono); }
.alloc-delta i.up { color: var(--ok); }
.alloc-delta i.down { color: var(--bad); }
.alloc-control { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.alloc-btn {
  width: 24px; height: 24px; border: 1px solid var(--line-strong); border-radius: 2px;
  display: grid; place-items: center; color: var(--ink-dim); background: rgba(255,255,255,.03);
  transition: .2s; flex: 0 0 auto;
}
.alloc-btn .icon { width: 12px; height: 12px; }
.alloc-btn:hover:not(:disabled) { color: var(--ink); background: rgba(var(--accent-rgb), .16); border-color: rgba(var(--accent-rgb), .5); }
.alloc-btn:disabled { opacity: .45; cursor: not-allowed; }
.alloc-bar { flex: 1; height: 6px; background: rgba(255,255,255,.06); position: relative; overflow: hidden; }
.alloc-bar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(var(--accent-rgb), .45), var(--accent)); transition: width .25s var(--ease); }
.alloc-ticks { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); pointer-events: none; }
.alloc-ticks em { border-right: 1px solid rgba(0,0,0,.3); }
.alloc-ticks em.on { background: transparent; }
.alloc-ticks em:last-child { border-right: 0; }
.alloc-value { font-family: var(--font-mono); font-size: 14px; color: var(--ink); min-width: 24px; text-align: right; }
.design-confirm-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 16px 0; }
.confirm-hint { font-family: var(--font-mono); font-size: 10.5px; color: var(--warn); padding: 8px 16px 0; text-align: right; }
.design-summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; padding: 10px 16px 0; }
.design-summary span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }
.design-summary b { font-size: 13px; color: var(--ink-dim); font-weight: 600; }

/* ---------- drivers step ---------- */
.drivers-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.04fr); gap: 14px; align-items: start; }
.lineup-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.slot-label { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.slot-label span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .1em; }
.slot-label i { font-style: normal; font-family: var(--font-mono); font-size: 10px; color: var(--accent); background: rgba(var(--accent-rgb), .08); border: 1px solid rgba(var(--accent-rgb), .18); padding: 1px 5px; border-radius: 2px; }
.driver-card {
  border: 1px solid var(--line); background: rgba(255,255,255,.019); border-radius: 3px;
  padding: 13px 14px; position: relative;
}
.driver-card-head { display: flex; align-items: center; gap: 11px; }
.driver-name-block { min-width: 0; flex: 1; }
.driver-number { font-family: var(--font-mono); font-size: 10px; letter-spacing: .09em; color: var(--ink-faint); }
.driver-name-block h3 { font-size: 17.5px; line-height: 1.28; font-weight: 700; letter-spacing: -.01em; }
.driver-en { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--ink-mute); letter-spacing: .02em; margin-top: 1px; }
.driver-ovr { align-self: flex-start; display: flex; flex-direction: column; align-items: flex-end; }
.driver-ovr span { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; }
.driver-ovr b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 31px; line-height: .9; letter-spacing: -.05em; color: color-mix(in srgb, var(--accent) 76%, white); }
.driver-attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-top: 11px; padding-top: 10px; border-top: 1px solid var(--line); }
.driver-attr { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-mute); }
.driver-attr span { width: 28px; flex: 0 0 auto; }
.driver-attr i { flex: 1; height: 2px; background: rgba(255,255,255,.07); display: block; }
.driver-attr i em { display: block; height: 100%; background: color-mix(in srgb, var(--accent) 50%, rgba(255,255,255,.3)); }
.driver-attr b { font-family: var(--font-mono); font-size: 10px; color: var(--ink-dim); font-weight: 500; width: 16px; text-align: right; }
.driver-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
.driver-card-foot > div > span { font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); letter-spacing: .04em; display: block; }
.driver-card-foot > div > b { font-size: 13.5px; color: var(--ink-dim); font-weight: 500; }
.lineup-summary {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap;
}
.lineup-summary > div span { display: block; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .07em; color: var(--ink-faint); }
.lineup-summary > div b { display: block; font-size: 18.5px; font-family: var(--font-display); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
.lineup-summary > div b.mono { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--ink-dim); }
.market-list { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 12px 12px 3px; }
.market-driver { padding: 11px; }
.market-driver .driver-attrs { grid-template-columns: 1fr; gap: 3px; }
.market-driver .driver-card-head { gap: 8px; }
.market-driver .driver-card-head .avatar { width: 44px; height: 44px; }
.market-driver .driver-name-block h3 { font-size: 15.5px; }
.market-driver .driver-ovr b { font-size: 25px; }
.market-driver .driver-card-foot { align-items: flex-end; margin-top: 8px; flex-wrap: wrap; }
.market-driver .driver-card-foot > div:first-child { display: none; }
.market-actions { width: 100%; display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.signing-fee span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); display: block; letter-spacing: .02em; }
.signing-fee b { font-family: var(--font-mono); font-size: 12px; color: var(--ink-dim); font-weight: 500; }
.market-driver .driver-card-foot { margin-top: 9px; }
.sponsor-list .sponsor-card:only-child { grid-column: 1 / -1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 10px 22px; align-items: start; }
.sponsor-list .sponsor-card:only-child .sponsor-card-head { grid-column: 1 / -1; }
.sponsor-list .sponsor-card:only-child .sponsor-desc { grid-column: 1; }
.sponsor-list .sponsor-card:only-child .sponsor-numbers { grid-column: 1; align-self: start; }
.sponsor-list .sponsor-card:only-child .sponsor-terms { grid-column: 2; grid-row: 2 / span 2; border-top: 0; padding-top: 0; }
.sponsor-list .sponsor-card:only-child .sponsor-card-foot { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; }
.sponsor-list .sponsor-card:only-child .sponsor-card-foot .btn { width: auto; }
.market-panel .note-line { margin-top: 10px; }
.next-row { padding: 12px 16px 16px; display: flex; justify-content: flex-end; border-top: 1px solid var(--line); }

/* ---------- sponsor step ---------- */
.sponsor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.sponsor-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px; }
.sponsor-card {
  display: flex; flex-direction: column; gap: 10px;
  border: 1px solid var(--line); border-radius: 3px; padding: 14px;
  background:
    radial-gradient(90% 70% at 100% 0%, rgba(var(--sponsor-rgb), .09), transparent 55%),
    rgba(255,255,255,.018);
  position: relative;
}
.sponsor-card.selected { border-color: color-mix(in srgb, var(--sponsor) 50%, transparent); background: rgba(var(--sponsor-rgb), .05); }
.sponsor-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sponsor-mark { font-family: var(--font-display); font-weight: 900; letter-spacing: -.02em; font-size: 19px; color: var(--sponsor); line-height: 1; }
.sponsor-desc { font-size: 12.5px; color: var(--ink-mute); line-height: 1.65; flex: 1; }
.sponsor-numbers { display: flex; gap: 0; border: 1px solid var(--line); }
.sponsor-numbers > div { flex: 1; padding: 8px 9px; border-left: 1px solid var(--line); }
.sponsor-numbers > div:first-child { border-left: 0; }
.sponsor-numbers span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); }
.sponsor-numbers b { font-family: var(--font-mono); font-size: 14px; color: var(--ink); font-weight: 500; }
.sponsor-terms { border-top: 1px solid var(--line); padding-top: 9px; }
.sponsor-terms > span { display: block; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; margin-bottom: 5px; }
.term-row { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--ink-dim); line-height: 1.55; }
.term-row .icon { width: 11px; height: 11px; color: var(--ok); margin-top: 1px; }
.sponsor-card-foot { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-top: auto; }
.sponsor-card-foot small { font-size: 10.5px; color: var(--ink-faint); line-height: 1.5; }
.sponsor-card-foot .btn { width: 100%; }
.signed-note { display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid var(--line); padding: 12px 16px; color: var(--ink-mute); font-size: 12.5px; line-height: 1.6; }
.signed-note .icon { color: var(--ok); width: 13px; height: 13px; margin-top: 1px; }

.season-ready { padding-bottom: 14px; }
.ready-gauges { display: flex; justify-content: center; padding: 16px 16px 8px; }
.gauge-big {
  width: 148px; height: 148px; border-radius: 50%; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at center, #0b1016 55%, transparent 56%),
    conic-gradient(from 220deg, rgba(255,255,255,.1), rgba(var(--accent-rgb), .55), rgba(255,255,255,.02));
  border: 1px solid var(--line);
  box-shadow: inset 0 0 30px rgba(0,0,0,.5);
}
.gauge-big::before {
  content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.09);
}
.gauge-big.ready { background: radial-gradient(circle at center, #0b1016 55%, transparent 56%), conic-gradient(from 220deg, rgba(66,224,165,.15), rgba(66,224,165,.65), rgba(255,255,255,.02)); }
.gauge-big b { font-family: var(--font-display); font-style: italic; font-weight: 900; font-size: 27px; letter-spacing: -.045em; line-height: 1; position: relative; z-index: 1; }
.gauge-big.ready b { color: var(--ok); font-size: 22px; }
.gauge-big span { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); margin-top: 5px; z-index: 1; }
.ready-list { padding: 6px 16px 12px; }
.ready-row {
  width: 100%; display: flex; align-items: center; gap: 9px; text-align: left;
  background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 0;
  color: var(--ink-mute); font-size: 13px; transition: color .2s;
}
.ready-row:hover { color: var(--ink); }
.ready-row:last-child { border-bottom: 0; }
.ready-row small { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }
.ready-check { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line-strong); display: grid; place-items: center; flex: 0 0 auto; }
.ready-check .icon { width: 10px; height: 10px; }
.ready-row.done { color: var(--ink-dim); }
.ready-row.done .ready-check { border-color: rgba(66,224,165,.4); color: var(--ok); background: rgba(66,224,165,.06); }
.ready-row.done small { color: var(--ok); }
.board-brief { margin: 0 16px; padding: 11px 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.board-brief p { font-size: 13.5px; color: var(--ink-dim); margin-top: 5px; line-height: 1.6; }
.ready-budget { display: flex; gap: 0; margin: 12px 16px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.ready-budget > div { flex: 1; padding: 8px 0; }
.ready-budget span { display: block; font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }
.ready-budget b { display: block; font-family: var(--font-mono); font-size: 14px; color: var(--ink-dim); font-weight: 500; }
.season-ready > .btn { width: calc(100% - 32px); margin: 0 16px; }
.ready-hint { font-size: 12px; color: var(--ink-faint); text-align: center; padding: 8px 16px 0; line-height: 1.6; }
.setup-foot { display: flex; justify-content: space-between; gap: 20px; padding-top: 16px; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .08em; color: var(--ink-faint); text-transform: uppercase; }
.setup-foot span { display: flex; align-items: center; gap: 7px; }

/* ---------- sign-driver modal ---------- */
.seat-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.seat-choice {
  border: 1px solid var(--line); background: rgba(255,255,255,.02); border-radius: 3px;
  padding: 12px; text-align: left; transition: .2s; color: var(--ink);
}
.seat-choice:hover { border-color: var(--line-strong); background: rgba(255,255,255,.05); }
